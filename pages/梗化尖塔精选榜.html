<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>梗化尖塔 · 精选梗榜</title>
<style>
:root{
  --pink:#ffb3c9; --pink-deep:#f2769a; --purple:#a98cf0; --ink:#3d3550;
  --muted:#8a82a0; --card:#ffffffcc; --line:#f0e6f5;
}
*{box-sizing:border-box}
body{
  margin:0; padding:0 16px 56px; color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:
    radial-gradient(circle at 10% 6%,#ffe3ee 0%,transparent 44%),
    radial-gradient(circle at 92% 3%,#e8dcff 0%,transparent 42%),
    radial-gradient(circle at 50% 100%,#e2f2ff 0%,transparent 48%),
    #fdfaff;
  min-height:100vh;
}
.wrap{max-width:880px;margin:0 auto}
header{padding:40px 0 6px;text-align:center}
h1{margin:0;font-size:30px;letter-spacing:2px}
h1 span{background:linear-gradient(90deg,var(--pink-deep),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.8}
.sub b{color:var(--pink-deep)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0 18px}
.tabs button{
  border:1px solid var(--line); background:#fff; color:var(--muted);
  padding:8px 15px; border-radius:999px; cursor:pointer;
  font-size:13px; font-family:inherit; transition:.15s;
}
.tabs button:hover{border-color:var(--pink)}
.tabs button.on{
  background:linear-gradient(120deg,var(--pink),var(--purple));
  border-color:transparent; color:#fff; font-weight:600;
  box-shadow:0 4px 14px #d9a8e155;
}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:8px 18px 14px;box-shadow:0 6px 22px #b48ec91a;backdrop-filter:blur(6px)}
.row{
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  padding:13px 2px;border-bottom:1px dashed var(--line);
}
.row:last-child{border-bottom:0}
.old{color:var(--muted);font-size:14px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{color:var(--pink);font-size:13px}
.new{font-size:16px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.dice{
  display:block;margin:20px auto 0;border:0;cursor:pointer;
  background:linear-gradient(120deg,var(--pink),var(--purple));color:#fff;
  padding:11px 26px;border-radius:999px;font-size:14px;font-family:inherit;
  box-shadow:0 6px 18px #d9a8e155;font-weight:600;
}
.dice:active{transform:translateY(1px)}
.pop{
  position:fixed;inset:0;background:#3d355066;display:none;
  align-items:center;justify-content:center;padding:22px;z-index:9;
}
.pop.on{display:flex}
.pop .box{
  background:#fff;border-radius:22px;padding:26px 24px;max-width:420px;width:100%;
  text-align:center;box-shadow:0 20px 50px #3d355033;
}
.pop .o{color:var(--muted);font-size:14px;margin-bottom:8px;word-break:break-all}
.pop .n{font-size:24px;font-weight:700;color:var(--pink-deep);margin:6px 0 4px;line-height:1.4}
.pop .c{margin-top:12px;font-size:12px;color:var(--muted)}
.pop .x{
  margin-top:18px;border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:8px 20px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px;
}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:2}
@media (max-width:760px){
  h1{font-size:23px}
  header{padding-top:28px}
  .row{grid-template-columns:1fr auto 1fr;gap:8px}
  .old{font-size:13px}
  .new{font-size:15px}
  .tabs{gap:6px}
  .tabs button{padding:7px 12px;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>梗化尖塔 · <span>精选梗榜</span></h1>
    <p class="sub">从全 mod <b>3321</b> 条改动里挑的 <b id="total">—</b> 条 · 只改文案不改数值</p>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="list"></div>
  <div class="empty" id="empty" style="display:none">这一类还没挑</div>

  <button class="dice" id="dice">🎲 随便来一条</button>

  <footer>
    Steam 创意工坊搜「梗化尖塔 Meme Spire」就能订。<br>
    同作者的《尖塔任务 Quest Spire》也在工坊里。
  </footer>
</div>

<div class="pop" id="pop">
  <div class="box">
    <div class="o" id="popOld"></div>
    <div class="n" id="popNew"></div>
    <div class="c" id="popCat"></div>
    <button class="x" id="popClose">关掉</button>
  </div>
</div>

    { cat: "地图界面", old: "感谢惠顾。", now: "谢谢惠顾～终于上当了！" }

  const CATS = ["全部", "卡牌", "怪物招式", "药水道具", "地图界面"];
  let cur = "全部";

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const tabsEl = document.getElementById("tabs");

  document.getElementById("total").textContent = PICKS.length;

  tabsEl.innerHTML = CATS.map(c =>
    `<button data-cat="${c}" class="${c === cur ? "on" : ""}">${c}</button>`).join("");

  function render() {
    const rows = cur === "全部" ? PICKS : PICKS.filter(p => p.cat === cur);
    emptyEl.style.display = rows.length ? "none" : "block";
    listEl.style.display = rows.length ? "block" : "none";
    listEl.innerHTML = rows.map(p =>
      `<div class="row">
        <div class="old" title="${p.old}">${p.old}</div>
        <div class="arrow">➜</div>
        <div class="new" title="${p.now}">${p.now}</div>
      </div>`).join("");
  }

  tabsEl.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    cur = b.dataset.cat;
    Array.prototype.forEach.call(tabsEl.querySelectorAll("button"), x =>
      x.classList.toggle("on", x === b));
    render();
  });

  const pop = document.getElementById("pop");
  document.getElementById("dice").addEventListener("click", () => {
    const p = PICKS[Math.floor(Math.random() * PICKS.length)];
    document.getElementById("popOld").textContent = p.old;
    document.getElementById("popNew").textContent = p.now;
    document.getElementById("popCat").textContent = p.cat;
    pop.classList.add("on");
  });
  document.getElementById("popClose").addEventListener("click", () => pop.classList.remove("on"));
  pop.addEventListener("click", e => { if (e.target === pop) pop.classList.remove("on"); });

  render();
})();
</script>

</html>
