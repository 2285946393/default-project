<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0710; }
  body { font-family: "Microsoft YaHei", sans-serif; color: #e8d5f0; }

  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#sand { image-rendering: pixelated; cursor: crosshair; touch-action: none; display: none; }
  canvas#sand.on { display: block; }

  #loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at 50% 40%, #241531 0%, #0a0710 75%);
    z-index: 10; transition: opacity .6s;
  }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading .rune { font-size: 44px; animation: float 2.2s ease-in-out infinite; }
  @keyframes float { 0%,100%{ transform: translateY(0)} 50%{ transform: translateY(-10px)} }
  #loading .bar { width: 220px; height: 4px; border-radius: 2px; background: #2a1a38; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; border-radius: 2px;
    background: linear-gradient(90deg, #ff5fa2, #b388ff); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0%{ margin-left:-40%} 100%{ margin-left:100%} }

  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  #hud > * { pointer-events: auto; }

  #title { position: absolute; top: 14px; left: 18px; pointer-events: none;
    text-shadow: 0 0 14px rgba(255,120,190,.45); }
  #title h1 { margin: 0; font-size: 21px; font-weight: 400; letter-spacing: 6px; color: #ffd6eb; }
  #title p { margin: 3px 0 0; font-size: 10px; letter-spacing: 3px; color: rgba(232,213,240,.4); }

  #fps { position: absolute; top: 14px; right: 16px; font-size: 11px;
    color: rgba(232,213,240,.5); font-family: Consolas, monospace; pointer-events: none; }

  #toolbar { position: absolute; top: 48px; left: 18px; display: flex; gap: 7px; flex-wrap: wrap; max-width: 320px; }
  .tbtn {
    padding: 6px 11px; border-radius: 9px; border: 1px solid rgba(255,160,200,.2);
    background: rgba(30,18,40,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #ffd6eb; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .tbtn:hover { background: rgba(255,120,180,.25); }
  .tbtn.sel { background: rgba(255,120,180,.4); border-color: #ff7ab8; }

  #sizes { position: absolute; left: 18px; bottom: 78px; display: flex; gap: 5px; }
  #sizes button {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,160,200,.25); background: rgba(30,18,40,.6);
    color: #ffd6eb; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  #sizes button.sel { border-color: #ff7ab8; background: rgba(255,120,180,.35); }
  #sizes svg circle { fill: #ffd6eb; }

  #elements { position: absolute; left: 18px; bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 46vw; }
  .ebtn {
    padding: 5px 9px; border-radius: 9px; cursor: pointer; font-size: 12px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(20,12,28,.75);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: #f0e0f5; transition: all .12s; white-space: nowrap;
  }
  .ebtn:hover { transform: translateY(-2px); }
  .ebtn.sel { border-color: #ff7ab8; box-shadow: 0 0 12px rgba(255,120,190,.5); background: rgba(60,25,60,.9); }

  #help { position: absolute; right: 16px; bottom: 14px; font-size: 10px; line-height: 1.8;
    color: rgba(232,213,240,.4); text-align: right; pointer-events: none; }

  #toast {
    position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%);
    padding: 10px 22px; border-radius: 12px; font-size: 14px; letter-spacing: 2px;
    background: rgba(30,15,40,.85); border: 1px solid rgba(255,160,200,.35);
    color: #ffd6eb; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 720px) {
    #elements { max-width: 92vw; }
    #toolbar { top: 44px; }
    #help { display: none; }
    #title h1 { font-size: 16px; letter-spacing: 3px; }
  }
</style>

  vec4 s1 = floor(b1) * 2. + 1.;
  vec4 sh = -step(h, vec4(0.));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = 1.79284291400159 - 0.85373472095314 *
    vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3));
  p0 *= norm.xyz;
  p1 *= norm.xyz;
  p2 *= norm.xyz;
  p3 *= norm.xyz;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.);
  m = m * m;
  return 42. * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

void main() {
  vec3 color;
  vec2 textCoord = ((uv * vec2(0.5, -0.5)) + vec2(0.5)).yx;
  vec4 d = texture2D(data, textCoord);
  int type = int((d.r * 255.) + 0.1);
  float hue = 0.0;
  float saturation = 0.6;
  float lightness = 0.3 + d.g * 0.5;
  vec2 nq = floor(uv * resolution / dpi);
  float noise = fract(sin(dot(nq + t * 0.05, vec2(127.1, 311.7))) * 43758.5453) - 0.5;
  float a = 1.0;

  if (type == 0) {
    hue = 0.0; saturation = 0.1; lightness = 0.1; a = 0.1;
  } else if (type == 1) { hue = 0.1; saturation = 0.1; lightness = 0.4;
  } else if (type == 2) { hue = 0.1; saturation = 0.5; lightness += 0.3;
  } else if (type == 3) {
    hue = 0.6; lightness = 0.7 + d.g * 0.25 + noise * 0.1;
    int polarity = int(mod(d.g * 255., 2.) + 0.1);
    if (polarity == 0) lightness += 0.01;
  } else if (type == 4) {
    hue = 0.0; lightness += 0.4; saturation = 0.2 + (d.b * 1.5);
  } else if (type == 5) { hue = 0.9; saturation = 0.3;
  } else if (type == 6) {
    hue = (d.g * 0.1); saturation = 0.7;
    lightness = 0.7 + (d.g * 0.3) + ((noise + 0.8) * 0.5);
  } else if (type == 7) {
    hue = (d.g * 0.1); saturation = 0.3; lightness = 0.3 + d.g * 0.3;
  } else if (type == 8) {
    hue = (d.g * 0.1); lightness = 0.7 + d.g * 0.25 + noise * 0.1;
  } else if (type == 9) {
    hue = 0.6; saturation = 0.4; lightness = 0.7 + d.g * 0.5;
  } else if (type == 10) { hue = 0.9; saturation = 0.4; lightness = 1.0;
  } else if (type == 11) { hue = 0.4; saturation = 0.4;
  } else if (type == 12) {
    hue = 0.18; saturation = 0.9; lightness = 0.8 + d.g * 0.2 + noise * 0.05;
  } else if (type == 13) { hue = -0.4 + (d.g * 0.5); saturation = 0.1;
  } else if (type == 14) {
    hue = (d.g * 2.0) + t * .0008; saturation = 0.4; lightness = 0.8;
  } else if (type == 15) { hue = 0.8; saturation = 0.9; lightness = 0.8;
  } else if (type == 16) {
    hue = (d.g * 5.0) + t * .008; saturation = 0.2; lightness = 0.3;
  } else if (type == 17) {
    hue = 0.0; saturation = 0.4 + d.b; lightness = 0.9;
  } else if (type == 18) {
    hue = (d.g * 0.15) - 0.1; saturation = (d.g * 0.8) - 0.05; lightness = 1.5 - (d.g * 0.2);
  } else if (type == 19) {
    hue = fract(fract(d.b * 2.) * 0.5) - 0.3;
    saturation = 0.7 * (d.g + 0.4) + d.b * 0.2;
    lightness = 0.9 * (d.g + 0.9);
  }
  lightness *= (0.975 + (fract(sin(dot(floor(uv * resolution / dpi), vec2(127.1, 311.7))) * 43758.5453)) * 0.05);
  color = hsv2rgb(vec3(hue, saturation, lightness));
  gl_FragColor = vec4(color, a);
}
`;

function startGL(canvas) {
  const gl = canvas.getContext('webgl', { alpha: true, antialias: false });
  if (!gl) throw new Error('WebGL 不可用');

  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VSH));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FSH));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  // 全屏大三角形
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, 4, -1, -1, 4, -1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'position');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uT = gl.getUniformLocation(prog, 't');
  const uDpi = gl.getUniformLocation(prog, 'dpi');
  const uRes = gl.getUniformLocation(prog, 'resolution');
  const uData = gl.getUniformLocation(prog, 'data');

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  let t = 0;
  let texInit = false;
  return function draw(cells) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    if (!texInit) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, cells);
      texInit = true;
    } else {
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, cells);
    }
    gl.uniform1f(uT, t++);
    gl.uniform1f(uDpi, 1);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1i(uData, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
}

/* ---------- 4. 元素定义（暗黑幻想中文化） ---------- */
const ELEMENTS = [
  { id: -1,  cn: '🌫 风',    desc: '无形之风' },
  { id: 2,   cn: '🏜 流沙',  desc: '倾泻的沙' },
  { id: 3,   cn: '💧 圣泉',  desc: '生命之水' },
  { id: 6,   cn: '🔥 狱炎',  desc: '吞噬之火' },
  { id: 7,   cn: '🪵 枯木',  desc: '可燃的躯干' },
  { id: 11,  cn: '🌿 荆棘',  desc: '生长的藤蔓' },
  { id: 19,  cn: '🌱 魔种',  desc: '绽放之花' },
  { id: 13,  cn: '🪨 黑曜岩', desc: '坚不可摧' },
  { id: 9,   cn: '❄️ 玄冰',  desc: '冻结一切' },
  { id: 8,   cn: '🌋 熔核',  desc: '大地的血' },
  { id: 12,  cn: '🧪 毒沼',  desc: '溶解万物' },
  { id: 4,   cn: '☁️ 瘴雾',  desc: '升腾的气' },
  { id: 16,  cn: '🛢 幽油',  desc: '漂浮燃烧' },
  { id: 14,  cn: '✨ 魔尘',  desc: '缤纷之尘' },

  { id: 18,  cn: '🍄 菌毯',  desc: '蔓延的真菌' },
  { id: 5,   cn: '🟣 复制魔印', desc: '无限复制' },
  { id: 17,  cn: '🚀 咒焰火箭', desc: '冲向天际' },
  { id: 1,   cn: '🧱 结界',  desc: '隔绝尘世' },
  { id: 0,   cn: '🕳 虚空',  desc: '抹除一切' },
];
const SIZE_MAP = [1, 3, 7, 19, 39];
const SPECIES = {
  Empty: 0, Wall: 1, Sand: 2, Water: 3, Gas: 4, Cloner: 5, Fire: 6,
  Wood: 7, Lava: 8, Ice: 9, Acid: 12, Stone: 13, Dust: 14, Mite: 15,
  Oil: 16, Rocket: 17, Fungus: 18, Seed: 19,
};

/* ---------- 5. UI 状态 ---------- */
const state = {
  element: SPECIES.Sand,
  size: 2,
  paused: false,
};

/* ---------- 6. 输入系统（软笔刷：逐粒撒落 + 按住聚积） ---------- */
/* 实心圆 paint 会让一整块沙同时出现、整体下坠；改为圆内按密度逐格撒点，
   每粒沙由 wasm 内部 rng 独立取随机数，下落抖动彼此独立，形成自然沙流。
   固体元素（结界/黑曜岩/枯木/复制魔印）保持实心，虚空橡皮全密度。 */
const SOLID_SPECIES = new Set([1, 5, 7, 13]);

function setupInput(canvas, uni) {
  let painting = false;
  let last = null;
  let cur = null;
  let emitter = null;

  function toWorld(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const x = Math.min(Math.max(Math.floor((cx - r.left) / r.width * W), 0), W - 1);
    const y = Math.min(Math.max(Math.floor((cy - r.top) / r.height * H), 0), H - 1);
    return { x, y };
  }

  function cell(x, y, s) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    uni.paint(x, y, 1, s);
  }

  function scatter(p, size, density) {
    const s = state.element;
    if (s < 0) return; // 风 v1 未实现
    const solid = SOLID_SPECIES.has(s) || s === 0;
    const den = solid ? 1.0 : density;
    const r = size / 2;
    const ir = Math.ceil(r);
    for (let dx = -ir; dx <= ir; dx++) {
      for (let dy = -ir; dy <= ir; dy++) {
        if (dx * dx + dy * dy > r * r) continue;
        if (Math.random() < den) cell(p.x + dx, p.y + dy, s);
      }
    }
  }

  function stroke(p) {
    if (!painting) return;
    const size = SIZE_MAP[state.size];
    if (!last) { scatter(p, size, 0.5); last = p; return; }
    const step = Math.max(size / 4, 1);
    let a = last;
    let i = 0;
    while (Math.hypot(p.x - a.x, p.y - a.y) > step && i++ < 2000) {
      const d = Math.hypot(p.x - a.x, p.y - a.y);
      const rr = Math.min(step, d) / d;
      a = { x: a.x + (p.x - a.x) * rr, y: a.y + (p.y - a.y) * rr };
      scatter({ x: Math.round(a.x), y: Math.round(a.y) }, size, 0.4);
    }
    scatter(p, size, 0.4);
    last = p;
  }

  // 按住不动：指间缓缓漏沙，越聚越多
  function startEmit() {
    stopEmit();
    emitter = setInterval(() => {
      if (!painting || !cur || state.paused) return;
      scatter(cur, SIZE_MAP[state.size], 0.28);
    }, 80);
  }
  function stopEmit() {
    if (emitter) { clearInterval(emitter); emitter = null; }
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    uni.pushUndo();
    painting = true;
    last = null;
    cur = toWorld(e.clientX, e.clientY);
    stroke(cur);
    startEmit();
  });
  window.addEventListener('pointerup', () => { painting = false; last = null; stopEmit(); });
  canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    if (!painting) return;
    cur = toWorld(e.clientX, e.clientY);
    stroke(cur);
  });
  canvas.addEventListener('pointerleave', () => { last = null; });
}

/* ---------- 7. 面板 UI ---------- */
function setupUI(uni) {
  const elBox = document.getElementById('elements');
  const sizeBox = document.getElementById('sizes');

  ELEMENTS.forEach(el => {
    const b = document.createElement('button');
    b.className = 'ebtn' + (el.id === state.element ? ' sel' : '');
    b.textContent = el.cn;
    b.title = el.desc;
    b.onclick = () => {
      state.element = el.id;
      document.querySelectorAll('.ebtn').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      toast(el.cn.slice(2) + ' · ' + el.desc);
    };
    elBox.appendChild(b);
  });

  SIZE_MAP.forEach((v, i) => {
    const b = document.createElement('button');
    if (i === state.size) b.className = 'sel';
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 100 100"><circle cx="50" cy="50" r="' + (4 + v) + '"/></svg>';
    b.onclick = () => {
      state.size = i;
      sizeBox.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
    };
    sizeBox.appendChild(b);
  });

  const btnPause = document.getElementById('btnPause');
  function togglePause() {
    state.paused = !state.paused;
    btnPause.textContent = state.paused ? '▶ 继续' : '⏸ 暂停';
    btnPause.classList.toggle('sel', state.paused);
  }
  btnPause.onclick = togglePause;

  document.getElementById('btnClear').onclick = () => {
    uni.reset();
    toast('世界已重塑 🌀');
  };
  document.getElementById('btnUndo').onclick = () => {
    uni.popUndo();
    toast('时光回溯 ↜');
  };

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    if (e.key === 'z' || e.key === 'Z') uni.popUndo();
    const n = parseInt(e.key);
    if (n >= 1 && n <= 5) {
      state.size = n - 1;
      sizeBox.querySelectorAll('button').forEach((x, i) => x.classList.toggle('sel', i === state.size));
    }
  });
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

/* ---------- 8. 开场引导动画（沙丘 + 魔种） ---------- */
async function boot(uni) {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // 开场：细沙如雨，沿地平线撒落成丘
  for (let x = 5; x <= W - 5; x += 3) {
    if (Math.random() < 0.6) {
      uni.paint(x, Math.floor(H * 0.25 + Math.random() * 8), 1, SPECIES.Sand);
    }
    if (window.__stopBoot) return;
    await sleep(4);
  }
  await sleep(600);
  // 魔种点缀
  for (let x = 40; x <= W - 40; x += 50 + Math.random() * 10) {
    uni.paint(x, Math.floor(H / 2 + 20 * Math.sin(x / 20)), 2, SPECIES.Seed);
    if (window.__stopBoot) return;
    await sleep(140);
  }
}

/* ---------- 9. 主流程 ---------- */
(async function main() {
  try {
    const { w } = await loadWasm();
    const uni = wrapUniverse(w);
    window.uni = uni;

    const canvas = document.getElementById('sand');
    canvas.width = W;
    canvas.height = H;
    // CSS 尺寸：等比缩放，适配窗口（保留少量边距给 UI）
    const fit = () => {
      const s = Math.min(window.innerWidth / W, (window.innerHeight - 10) / H);
      canvas.style.width = Math.floor(W * s) + 'px';
      canvas.style.height = Math.floor(H * s) + 'px';
    };
    fit();
    window.addEventListener('resize', fit);

    const draw = startGL(canvas);
    setupInput(canvas, uni);
    setupUI(uni);

    document.getElementById('loading').classList.add('gone');
    canvas.classList.add('on');

    // FPS
    let frames = 0, lastFps = performance.now();
    const fpsEl = document.getElementById('fps');

    const loop = () => {
      if (!state.paused) {
        uni.tick();
      }
      draw(uni.cells());
      frames++;
      const now = performance.now();
      if (now - lastFps > 1000) {
        fpsEl.textContent = frames + ' fps';
        frames = 0; lastFps = now;
      }
      requestAnimationFrame(loop);
    };
    loop();
    boot(uni);
  } catch (err) {
    const l = document.getElementById('loading');
    l.innerHTML = '<div class="rune">💀</div><div>元素之力枯竭：' + err.message + '</div>';
    console.error(err);
  }
})();
