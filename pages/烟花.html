<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>烟花铺子 · 放置夜空</title>
<meta name="description" content="点哪儿哪儿开花的放置游戏：挣光尘、升级口径、攒一支乌篷船队，攒出一整片会自己热闹的水乡夜空。单文件零依赖。">
<style>
  :root {
    --bg: #0F172A; --fg: #E2E8F0; --muted: #94A3B8;
    --accent: #7C3AED; --primary: #4338CA;
    --gold: #FFD27A; --ui-bg: rgba(15, 23, 42, .78); --ui-line: rgba(255, 255, 255, .08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #050816; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #bg { z-index: 0; } #fx { z-index: 1; }
  .ui { position: fixed; z-index: 2; }

  header.ui { top: max(14px, env(safe-area-inset-top)); left: 20px; color: var(--fg); user-select: none; pointer-events: none; }
  header.ui h1 { font-size: 17px; font-weight: 600; letter-spacing: .34em; }
  header.ui p { font-size: 12.5px; line-height: 1.6; color: var(--muted); margin-top: 3px; }

  .dust { top: max(12px, env(safe-area-inset-top)); right: 20px; text-align: right; user-select: none; pointer-events: none; }
  .dust .num { font-size: clamp(20px, 4.4vw, 30px); font-weight: 700; color: var(--gold);
               text-shadow: 0 0 18px rgba(255,210,122,.35); font-variant-numeric: tabular-nums; }
  .dust .lbl { font-size: 12px; color: var(--muted); letter-spacing: .2em; margin-top: 2px; }
  .dust .rate { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .bar { bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
         display: flex; gap: 6px; align-items: center; padding: 8px 10px;
         background: var(--ui-bg); border: 1px solid var(--ui-line); border-radius: 14px;
         backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .bar button { appearance: none; border: 1px solid transparent; background: transparent; color: var(--fg);
         min-width: 44px; height: 44px; padding: 0 14px; border-radius: 10px; cursor: pointer;
         font-size: 13.5px; letter-spacing: .06em; display: flex; align-items: center; gap: 7px;
         transition: background .2s ease, border-color .2s ease; }
  .bar button:hover { background: rgba(255, 255, 255, .07); }
  .bar button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .bar button[aria-pressed="true"] { background: rgba(124, 58, 237, .24); border-color: rgba(124, 58, 237, .55); color: #C4B5FD; }
  .bar svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .sep { width: 1px; height: 22px; background: var(--ui-line); }

  .shop { bottom: max(74px, calc(env(safe-area-inset-bottom) + 62px)); right: 14px; width: 300px; max-height: min(62vh, 480px);
          overflow-y: auto; background: var(--ui-bg); border: 1px solid var(--ui-line); border-radius: 14px;
          backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 12px; display: none; }
  .shop.open { display: block; }
  .shop h2 { font-size: 13px; color: var(--fg); letter-spacing: .2em; font-weight: 600; padding: 2px 4px 10px; }
  .shop h2 small { color: var(--muted); letter-spacing: .05em; font-weight: 400; margin-left: 8px; }
  .item { border: 1px solid var(--ui-line); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; cursor: pointer;
          transition: border-color .2s ease, background .2s ease; }
  .item:hover { background: rgba(255,255,255,.05); }
  .item:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
  .item.can { border-color: rgba(124, 58, 237, .55); }
  .item .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .item .name { font-size: 13.5px; color: var(--fg); font-weight: 600; }
  .item .lv { font-size: 11px; color: var(--muted); }
  .item .d { font-size: 11.5px; color: var(--muted); line-height: 1.55; margin-top: 3px; }
  .item .cost { font-size: 12.5px; color: var(--gold); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .item.no .cost { color: var(--muted); opacity: .7; }

  .toast { position: fixed; z-index: 3; top: max(70px, calc(env(safe-area-inset-top) + 58px)); left: 50%; transform: translateX(-50%);
           background: var(--ui-bg); border: 1px solid rgba(255,210,122,.35); color: var(--gold);
           padding: 10px 18px; border-radius: 12px; font-size: 13px; letter-spacing: .06em;
           opacity: 0; transition: opacity .4s ease; pointer-events: none; max-width: 86vw; text-align: center; }
  .toast.show { opacity: 1; }

  .hint { position: fixed; z-index: 2; bottom: max(76px, calc(env(safe-area-inset-bottom) + 62px)); left: 50%; transform: translateX(-50%);
          color: var(--muted); font-size: 12.5px; letter-spacing: .1em; user-select: none; pointer-events: none;
          transition: opacity .6s ease; text-align: center; max-width: 86vw; }
  .hint.gone { opacity: 0; }
  .shop:not(.open) ~ .hint { bottom: max(76px, calc(env(safe-area-inset-bottom) + 62px)); }
  .shop.open ~ .hint { display: none; }

  @media (hover: none) { .bar button { min-width: 48px; height: 48px; } }
  @media (max-width: 470px) {
    .bar button span { display: none; }
    .bar button { padding: 0 12px; }
    .shop { left: 12px; right: 12px; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) { .hint, .toast { transition: none; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<header class="ui">
  <h1>烟花铺子</h1>
  <p>点哪儿，哪儿开花 · 光尘养夜空</p>
</header>

<div class="dust ui">
  <div class="num" id="dustNum">0</div>
  <div class="lbl">光　尘</div>
  <div class="rate" id="dustRate">每秒 0</div>
</div>

<div class="toast ui" id="toast" role="status"></div>
<div class="hint ui" id="hint">点一下夜空放花挣光尘 · 连点两下放大结局</div>

<nav class="bar ui" aria-label="烟花铺子控制">
  <button id="btnShop" aria-expanded="false" aria-label="烟花铺子" title="烟花铺子">
    <svg viewBox="0 0 24 24"><path d="M4 10l1.6-5h12.8L20 10M4 10v9a1 1 0 001 1h14a1 1 0 001-1v-9M4 10h16M9 20v-5h6v5"/></svg>
    <span>铺子</span>
  </button>
  <button id="btnSound" aria-pressed="false" aria-label="音效开关" title="音效开关">
    <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.8a7.6 7.6 0 010 10.4"/></svg>
    <span>声音</span>
  </button>
  <button id="btnReset" aria-label="重开一晚" title="重开一晚（清空进度）">
    <svg viewBox="0 0 24 24"><path d="M4 5v4h4M4.8 9A8 8 0 1112 20a8 8 0 01-7.4-4.9"/></svg>
    <span>重开</span>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button id="btnSave" aria-label="保存这一夜为图片" title="保存这一夜为图片">
    <svg viewBox="0 0 24 24"><path d="M12 4v10M12 14l-3.6-3.6M12 14l3.6-3.6"/><path d="M5 17.5V19a1.5 1.5 0 001.5 1.5h11A1.5 1.5 0 0019 19v-1.5"/></svg>
    <span>存一张</span>
  </button>
</nav>

<aside class="shop ui" id="shop" aria-label="烟花铺子商店">
  <h2>烟 花 铺 子<small>用光尘换更热闹的夜空</small></h2>
  <div id="shopItems"></div>
</aside>

<script>
(() => {
"use strict";
const bgCv = document.getElementById("bg"), fxCv = document.getElementById("fx");
const bg = bgCv.getContext("2d"), fx = fxCv.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR = Math.min(devicePixelRatio || 1, 2);
let W = 0, H = 0, groundY = 0, waterY = 0;

/* ================= 水乡夜景（随等级进化） ================= */
let stars = [], ridgeFar = [], ridgeNear = [], town = [], lanterns = [], boats = [], lotus = [];
let moon = { x: 0, y: 0, r: 0 };
function ridgePath(arr, x0, x1, step) {
  let out = "";
  for (let x = x0; x <= x1; x += step) out += x.toFixed(0) + "," + hillY(arr, x).toFixed(1) + ";";
  return out;
}
function mkRidge(W, base, amp1, amp2, seed) {
  const a1 = amp1 * (0.7 + Math.random() * 0.6), a2 = amp2 * (0.7 + Math.random() * 0.6);
  const f1 = 0.003 + Math.random() * 0.002, f2 = 0.012 + Math.random() * 0.006;
  return { base, a1, a2, f1, f2, seed };
}
function hillY(r, x) { return r.base - r.a1 * Math.sin(x * r.f1 + r.seed) - r.a2 * Math.sin(x * r.f2 + r.seed * 2); }

function buildScene() {
  const starN = Math.round(W * H / 5200 * (1 + G.lv.dome * 0.22));
  stars = [];
  for (let i = 0; i < starN; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * waterY * 0.88,
                 r: Math.random() * 1.1 + 0.3, p: Math.random() * Math.PI * 2, s: 0.5 + Math.random() * 1.6 });
  }
  ridgeFar = mkRidge(W, waterY * 0.62, waterY * 0.10, waterY * 0.05, Math.random() * 9);
  ridgeNear = mkRidge(W, waterY * 0.82, waterY * 0.09, waterY * 0.045, Math.random() * 9);
  // 左岸古镇：飞檐屋群
  town = [];
  let x = -26;
  while (x < W * 0.74) {
    const w = 52 + Math.random() * 62, h = 40 + Math.random() * 46;
    town.push({ x, w, h, tip: 5 + Math.random() * 5, ridgeY: waterY - h });
    x += w * (0.62 + Math.random() * 0.2) + 6;
  }
  lanterns = [];
  for (let i = 0; i < town.length; i++) {
    const b = town[i];
    lanterns.push({ x: b.x + b.w * 0.1, y: waterY - b.h + 9, p: Math.random() * 9 });
    if (i % 2 === 0) lanterns.push({ x: b.x + b.w * 0.82, y: waterY - b.h + 11, p: Math.random() * 9 });
  }
  // 乌篷船队（自动燃放等级）：泊在河面
  boats = [];
  const boatN = Math.min(6, G.lv.tower);
  for (let i = 0; i < boatN; i++) {
    boats.push({ x: W * (0.1 + (i + Math.random() * 0.6) / boatN * 0.82), p: Math.random() * 9 });
  }
  // 莲花河灯（稀有金弹等级）
  lotus = [];
  const lotusN = Math.min(16, G.lv.rare * 2);
  for (let i = 0; i < lotusN; i++) {
    lotus.push({ x: Math.random() * W, y: waterY + 14 + Math.random() * (H - waterY - 30),
                 v: (Math.random() < 0.5 ? -1 : 1) * (3 + Math.random() * 7), p: Math.random() * 9 });
  }
  moon = { x: W * 0.8, y: waterY * 0.22, r: Math.min(W, H) * 0.042 };
}
function resize() {
  W = innerWidth; H = innerHeight;
  groundY = waterY = H - Math.min(H * 0.24, 190);
  for (const cv of [bgCv, fxCv]) {
    cv.width = W * DPR; cv.height = H * DPR;
    cv.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  buildScene();
}

function drawEave(b, col) {
  // 飞檐屋：屋身 + 翘角屋顶
  const topY = waterY - b.h;
  bg.fillStyle = col;
  bg.fillRect(b.x + b.w * 0.08, topY + 9, b.w * 0.84, b.h - 9);
  bg.strokeStyle = "rgba(170,195,255,.16)"; bg.lineWidth = 1.2;
  bg.beginPath();
  bg.moveTo(b.x - b.tip, topY + 10 - b.tip * 0.5);
  bg.quadraticCurveTo(b.x + b.w * 0.18, topY + 3, b.x + b.w / 2, topY);
  bg.quadraticCurveTo(b.x + b.w * 0.82, topY + 3, b.x + b.w + b.tip, topY + 10 - b.tip * 0.5);
  bg.lineTo(b.x + b.w + b.tip - 4, topY + 15);
  bg.lineTo(b.x - b.tip + 4, topY + 15);
  bg.closePath();
  bg.fill();
  bg.stroke();
}
function drawPagoda(cx, baseY, col) {
  // 七层宝塔剪影
  const tiers = 7;
  let w = Math.min(W * 0.055, 64), y = baseY;
  bg.fillStyle = col;
  for (let i = 0; i < tiers; i++) {
    const h = 15 + (tiers - i) * 2.2;
    bg.fillRect(cx - w * 0.3, y - h, w * 0.6, h);
    bg.beginPath();
    bg.moveTo(cx - w / 2, y - h);
    bg.quadraticCurveTo(cx - w * 0.16, y - h - 7, cx, y - h - 9);
    bg.quadraticCurveTo(cx + w * 0.16, y - h - 7, cx + w / 2, y - h);
    bg.closePath(); bg.fill();
    y -= h + 9; w *= 0.88;
  }
  bg.fillRect(cx - 1.2, y - 12, 2.4, 12);
}
function drawBridge(x0, x1, col) {
  // 石拱桥：桥面 + 半圆桥洞
  const cx = (x0 + x1) / 2, span = x1 - x0, deckY = waterY - 34;
  bg.fillStyle = col;
  bg.beginPath();
  bg.moveTo(x0 - 8, deckY + 6);
  bg.quadraticCurveTo(cx, deckY - 16, x1 + 8, deckY + 6);
  bg.lineTo(x1 + 8, deckY + 14);
  bg.quadraticCurveTo(cx, deckY - 6, x0 - 8, deckY + 14);
  bg.closePath(); bg.fill();
  bg.beginPath();
  bg.moveTo(x0, waterY);
  bg.quadraticCurveTo(cx, waterY - span * 0.32, x1, waterY);
  bg.lineTo(x1, deckY + 14);
  bg.quadraticCurveTo(cx, deckY - 6, x0, deckY + 14);
  bg.closePath(); bg.fill();
}

function drawSky(t) {
  const g = bg.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#050816"); g.addColorStop(0.5, "#0F172A"); g.addColorStop(1, "#1B2540");
  bg.fillStyle = g; bg.fillRect(0, 0, W, H);
  // 星河（夜空穹顶）
  if (G.lv.dome > 0) {
    bg.save();
    bg.globalCompositeOperation = "lighter";
    const bands = Math.min(3, 1 + ((G.lv.dome / 4) | 0));
    for (let b = 0; b < bands; b++) {
      const ph = t * 0.00014 * (b % 2 ? -1 : 1) + b * 2.1;
      bg.beginPath();
      const baseY = waterY * (0.26 + b * 0.1);
      bg.moveTo(-40, baseY);
      for (let x = -40; x <= W + 40; x += 14) {
        const yy = baseY - 42 * Math.sin(x * 0.0032 + ph) - 20 * Math.sin(x * 0.009 + ph * 1.7);
        bg.lineTo(x, yy);
      }
      bg.strokeStyle = `hsla(${b % 2 ? 262 : 200}, 62%, 70%, ${0.045 + Math.min(0.09, G.lv.dome * 0.014)})`;
      bg.lineWidth = 30 + b * 14;
      bg.stroke();
    }
    bg.restore();
  }
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(t * 0.001 * s.s + s.p);
    bg.globalAlpha = 0.35 + 0.6 * tw;
    bg.fillStyle = "#dfe7ff";
    bg.fillRect(s.x, s.y, s.r, s.r);
  }
  bg.globalAlpha = 1;
  // 月亮与月晕
  bg.save();
  const glow = bg.createRadialGradient(moon.x, moon.y, moon.r * 0.4, moon.x, moon.y, moon.r * 3.4);
  glow.addColorStop(0, "rgba(220,228,255,.20)"); glow.addColorStop(1, "rgba(220,228,255,0)");
  bg.fillStyle = glow; bg.beginPath(); bg.arc(moon.x, moon.y, moon.r * 3.4, 0, 7); bg.fill();
  bg.fillStyle = "#e8edff"; bg.beginPath(); bg.arc(moon.x, moon.y, moon.r, 0, 7); bg.fill();
  bg.fillStyle = "#0F172A"; bg.beginPath(); bg.arc(moon.x - moon.r * 0.42, moon.y - moon.r * 0.18, moon.r * 0.92, 0, 7); bg.fill();
  bg.restore();
  // 水墨远山两层
  bg.fillStyle = "#101a30";
  bg.beginPath(); bg.moveTo(0, waterY);
  for (let x = 0; x <= W; x += 8) bg.lineTo(x, hillY(ridgeFar, x));
  bg.lineTo(W, waterY); bg.closePath(); bg.fill();
  bg.fillStyle = "#0b1224";
  bg.beginPath(); bg.moveTo(0, waterY);
  for (let x = 0; x <= W; x += 8) bg.lineTo(x, hillY(ridgeNear, x));
  bg.lineTo(W, waterY); bg.closePath(); bg.fill();
  // 宝塔与石拱桥（远景）
  drawPagoda(W * 0.9, waterY - 6, "#0a0f20");
  drawBridge(W * 0.6, W * 0.86, "#0a0f20");
  // 古镇飞檐群（近景，最暗压得住画面）
  for (const b of town) drawEave(b, "#080d1a");
  // 檐角灯笼：暖光 + 摆动 + 光晕
  for (const L of lanterns) {
    const sw = Math.sin(t * 0.0011 + L.p) * 2.2;
    const lx = L.x + sw, ly = L.y + Math.abs(sw) * 0.4 + 6;
    bg.strokeStyle = "rgba(255,200,120,.5)"; bg.lineWidth = 1;
    bg.beginPath(); bg.moveTo(L.x, L.y - 6); bg.lineTo(lx, ly - 3); bg.stroke();
    const gl = bg.createRadialGradient(lx, ly + 3, 0.5, lx, ly + 3, 13);
    gl.addColorStop(0, "rgba(255,190,110,.5)"); gl.addColorStop(1, "rgba(255,190,110,0)");
    bg.fillStyle = gl; bg.beginPath(); bg.arc(lx, ly + 3, 13, 0, 7); bg.fill();
    bg.fillStyle = "#ffcf8a"; bg.beginPath(); bg.ellipse(lx, ly + 3, 2.6, 3.6, 0, 0, 7); bg.fill();
  }
  // 水面
  const wg = bg.createLinearGradient(0, waterY, 0, H);
  wg.addColorStop(0, "#081020"); wg.addColorStop(1, "#03060d");
  bg.fillStyle = wg; bg.fillRect(0, waterY, W, H - waterY);
  // 岸线微光
  bg.fillStyle = "rgba(160,190,255,.10)"; bg.fillRect(0, waterY, W, 1.4);
  // 烟花倒影：把上一帧 fx 垂直镜像切片 + 波浪横移
  if (parts.length || rockets.length) {
    const Rh = H - waterY, slices = 34, sH = Rh / slices;
    bg.save();
    bg.globalAlpha = 0.3;
    for (let s = 0; s < slices; s++) {
      const d = s * sH;
      const wob = Math.sin(d * 0.055 + t * 0.0018) * (2 + d * 0.02);
      const fade = 1 - s / slices;
      bg.globalAlpha = 0.3 * fade;
      bg.drawImage(fxCv, 0, (waterY - d * 0.8) * DPR, W * DPR, sH * 0.8 * DPR + 1,
                   wob, waterY + d, W, sH + 0.8);
    }
    bg.restore();
    bg.fillStyle = "rgba(8,14,30,.32)"; bg.fillRect(0, waterY, W, H - waterY);
  }
  // 月光水路
  {
    bg.save();
    for (let i = 0; i < 26; i++) {
      const yy = waterY + 4 + i * ((H - waterY) / 27);
      const w = moon.r * (0.5 + Math.abs(Math.sin(t * 0.001 + i)) * 1.6) + i * 0.8;
      bg.globalAlpha = 0.028 + 0.03 * Math.abs(Math.sin(t * 0.0016 + i * 1.7));
      bg.fillStyle = "#cdd9ff";
      bg.fillRect(moon.x - w / 2 + Math.sin(t * 0.001 + i * 2.4) * 3, yy, w, 1.6);
    }
    bg.restore();
  }
  // 莲花河灯（稀有金弹）
  for (const Lo of lotus) {
    Lo.x += Lo.v * 0.016;
    if (Lo.x < -14) Lo.x = W + 14; if (Lo.x > W + 14) Lo.x = -14;
    const yy = Lo.y + Math.sin(t * 0.0009 + Lo.p) * 2;
    const gl = bg.createRadialGradient(Lo.x, yy, 0.5, Lo.x, yy, 12);
    gl.addColorStop(0, "rgba(255,170,90,.55)"); gl.addColorStop(1, "rgba(255,170,90,0)");
    bg.fillStyle = gl; bg.beginPath(); bg.arc(Lo.x, yy, 12, 0, 7); bg.fill();
    bg.fillStyle = "#ffc27a"; bg.fillRect(Lo.x - 2, yy - 1.4, 4, 2.8);
    bg.fillStyle = "rgba(255,190,120,.35)"; bg.fillRect(Lo.x - 3, yy + 5, 6, 1.2);
  }
  // 乌篷船（自动燃放等级）：船身随波轻摇 + 船头灯
  for (const bt of boats) {
    const yy = waterY + 7 + Math.sin(t * 0.0008 + bt.p) * 2;
    bg.fillStyle = "#0a0f1e";
    bg.beginPath();
    bg.moveTo(bt.x - 22, yy);
    bg.quadraticCurveTo(bt.x, yy + 7, bt.x + 22, yy);
    bg.lineTo(bt.x + 16, yy - 5);
    bg.lineTo(bt.x - 16, yy - 5);
    bg.closePath(); bg.fill();
    bg.beginPath();
    bg.ellipse(bt.x, yy - 6, 13, 6, 0, Math.PI, 0);
    bg.fill();
    const gl = bg.createRadialGradient(bt.x + 20, yy - 6, 0.5, bt.x + 20, yy - 6, 9);
    gl.addColorStop(0, "rgba(255,200,120,.6)"); gl.addColorStop(1, "rgba(255,200,120,0)");
    bg.fillStyle = gl; bg.beginPath(); bg.arc(bt.x + 20, yy - 6, 9, 0, 7); bg.fill();
    bg.fillStyle = "#ffd9a0"; bg.fillRect(bt.x + 19, yy - 8, 2.4, 3.4);
  }
}

/* ================= 游戏状态 ================= */
const SAVE_KEY = "fireworks-idle-v1";
const G = {
  dust: 0, total: 0, blooms: 0,
  lv: { fuse: 0, bore: 0, tower: 0, rare: 0, dome: 0 },
  lastSeen: Date.now(),
};
const fmt = (n) => {
  if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e10 ? 1 : 2) + " 亿";
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e6 ? 1 : 2) + " 万";
  return Math.floor(n).toString();
};
const ITEMS = [
  { id: "fuse", name: "速燃引线", d: () => "手放一朵的光尘 ×" + (2 ** G.lv.fuse).toFixed(0) + "。你的手越来越巧。",
    cost: () => 60 * Math.pow(2.4, G.lv.fuse), max: 25 },
  { id: "bore", name: "大口径", d: () => "每一朵更饱满（炸开半径 ×" + (1 + G.lv.bore * 0.09).toFixed(2) + "），光尘跟着涨。",
    cost: () => 240 * Math.pow(2.6, G.lv.bore), max: 20 },
  { id: "tower", name: "乌篷船队", d: () => "河上泊着 " + G.lv.tower + " 条乌篷船替你放，每 " + towerInterval().toFixed(1) + " 秒一朵，你不在它们也放。",
    cost: () => 550 * Math.pow(2.3, G.lv.tower), max: 30 },
  { id: "rare", name: "莲花河灯", d: () => "水面上漂起 " + (G.lv.rare * 2) + " 盏河灯；金弹概率 " + (rareChance() * 100).toFixed(0) + "%，光尘 ×10。",
    cost: () => 3000 * Math.pow(2.8, G.lv.rare), max: 12 },
  { id: "dome", name: "夜空星河", d: () => "天上淌着星河，星星更密，所有光尘 ×" + Math.pow(1.5, G.lv.dome).toFixed(2) + "。",
    cost: () => 9000 * Math.pow(3, G.lv.dome), max: 15 },
];
function towerInterval() { return Math.max(1.2, 6 * Math.pow(0.88, G.lv.tower)); }
function rareChance() { return Math.min(0.5, 0.04 * G.lv.rare); }
function globalMult() { return Math.pow(1.5, G.lv.dome); }
function dustPerBloom(isGolden) {
  const particles = 105 * Math.pow(1.25, G.lv.bore) * (isGolden ? 1.3 : 1);
  const typeM = isGolden ? 10 : 1;
  return particles * 0.1 * (2 ** G.lv.fuse) * typeM * globalMult();
}
function save() {
  try { G.lastSeen = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const j = JSON.parse(raw);
    if (j && j.lv) {
      G.dust = j.dust || 0; G.total = j.total || 0; G.blooms = j.blooms || 0;
      G.lv = { fuse: j.lv.fuse || 0, bore: j.lv.bore || 0, tower: j.lv.tower || 0, rare: j.lv.rare || 0, dome: j.lv.dome || 0 };
      const away = Math.min((Date.now() - (j.lastSeen || Date.now())) / 1000, 7200);
      if (G.lv.tower > 0 && away > 60) {
        const blooms = Math.floor(away / towerInterval());
        const earn = Math.round(blooms * dustPerBloom(false) * 0.6);
        if (earn > 0) {
          G.dust += earn; G.total += earn;
          setTimeout(() => toast("你不在的 " + Math.round(away / 60) + " 分钟，镇上放了你 " + fmt(blooms) + " 朵烟花，落下 " + fmt(earn) + " 光尘"), 900);
        }
      }
    }
  } catch (e) {}
}

/* ================= 烟花物理 ================= */
const parts = [];
const rockets = [];
const MAX = reduced ? 900 : 2600;
const PALETTES = [
  [[36, 100, 62], [45, 100, 70], [18, 100, 60]],
  [[340, 90, 64], [320, 95, 70], [275, 80, 66]],
  [[190, 95, 62], [205, 100, 70], [170, 85, 60]],
  [[130, 70, 62], [95, 80, 66], [60, 100, 70]],
  [[0, 0, 92], [45, 90, 72], [0, 0, 78]],
];
const GOLD = [[45, 100, 66], [40, 100, 74], [50, 100, 60]];
let soundOn = false;
let nextTower = 0;

function launch(tx, ty, big, golden) {
  const sx = tx + (Math.random() - 0.5) * 40;
  const sy = groundY - 4;
  const peak = Math.max(H * 0.1, Math.min(ty, groundY - H * 0.08));
  const vy = -Math.sqrt(2 * 0.05 * (sy - peak)) * Math.min(1.3, 1 + G.lv.fuse * 0.035);
  rockets.push({ x: sx, y: sy, vx: (tx - sx) * 0.022, vy, tx, ty, big: !!big, golden: !!golden,
                 hue: golden ? GOLD : PALETTES[(Math.random() * PALETTES.length) | 0], t: 0 });
  sfxLaunch();
}
function explode(x, y, pal, big, golden) {
  const r = Math.random();
  const type = golden ? "willow" : r < 0.34 ? "peony" : r < 0.62 ? "ring" : r < 0.84 ? "willow" : "crackle";
  const vis = 1 + G.lv.bore * 0.09;                       // 大口径：炸开半径肉眼可见地变大
  const base = (big ? 150 : 105) * Math.pow(1.25, G.lv.bore);
  const count = Math.min(MAX - parts.length, (base * (type === "willow" ? 0.8 : 1)) | 0);
  sfxBloom(type);
  if (count > 0) for (let i = 0; i < count; i++) {
    const a = type === "ring" ? (i / count) * Math.PI * 2 : Math.random() * Math.PI * 2;
    const sp = (type === "ring" ? (big ? 4.6 : 3.6) : Math.pow(Math.random(), 0.42) * (big ? 6.2 : 4.8) + 0.4) * vis;
    parts.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * (type === "ring" ? 0.55 : 1),
      life: 1,
      decay: type === "willow" ? 0.0055 + Math.random() * 0.004
           : type === "crackle" ? 0.011 + Math.random() * 0.008
           : 0.009 + Math.random() * 0.007,
      drag: type === "willow" ? 0.978 : 0.965,
      g: type === "willow" ? 0.052 : 0.075,
      c: pal[(Math.random() * pal.length) | 0],
      w: (type === "willow" ? 1.4 : 1.9) * (1 + G.lv.bore * 0.05),
      crack: type === "crackle" && Math.random() < 0.16,
    });
  }
  const earn = Math.round(dustPerBloom(golden) * (big ? 1.6 : 1) * (type === "willow" ? 1.6 : type === "crackle" ? 1.4 : type === "ring" ? 1.2 : 1));
  G.dust += earn; G.total += earn; G.blooms++;
  if (golden) toast("✧ 金弹开了，落下 " + fmt(earn) + " 光尘");
  milestones();
}
function step(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.t += dt;
    r.x += r.vx * dt; r.y += r.vy * dt;
    r.vy += 0.05 * dt;
    fx.globalAlpha = 0.85;
    fx.fillStyle = r.golden ? "#ffe9a8" : "#ffe9b8";
    fx.fillRect(r.x, r.y, 2, 6);
    if (G.lv.fuse > 0) {                                   // 速燃引线：双层尾焰 + 亮头
      fx.globalAlpha = 0.4;
      fx.fillStyle = "#ffcf7a";
      fx.fillRect(r.x - 1.6, r.y + 4, 5.2, 10);
      fx.globalAlpha = 0.9;
      fx.fillStyle = "#fff6e0";
      fx.beginPath(); fx.arc(r.x, r.y, 1.6, 0, 7); fx.fill();
    }
    if (Math.random() < 0.5) {
      fx.globalAlpha = 0.5;
      fx.fillStyle = "rgba(255,200,120,.8)";
      fx.fillRect(r.x + (Math.random() - 0.5) * 3, r.y + 6 * Math.random(), 1.6, 1.6);
    }
    fx.globalAlpha = 1;
    if (r.y <= r.ty || r.vy >= -0.5) {
      try { explode(r.x, r.y, r.hue, r.big, r.golden); }
      catch (err) { try { (window.__fw.log = window.__fw.log || []).push("ERR " + (err && err.message)); } catch (e2) {} }
      rockets.splice(i, 1);
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vx *= Math.pow(p.drag, dt); p.vy = p.vy * Math.pow(p.drag, dt) + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0 || p.y > groundY + 10) {
      if (p.crack && p.life <= 0) {
        for (let k = 0; k < 10; k++) {
          const a = Math.random() * Math.PI * 2, sp = Math.random() * 1.8 + 0.3;
          parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5,
            decay: 0.03, drag: 0.96, g: 0.06, c: [48, 100, 80], w: 1.4, crack: false });
        }
        sfxCrackle();
      }
      parts.splice(i, 1); continue;
    }
    const tw = p.life < 0.35 ? (Math.random() < 0.28 ? 0.25 : 1) : 1;
    fx.globalAlpha = Math.max(0, Math.min(1, p.life)) * tw;
    fx.fillStyle = `hsl(${p.c[0]} ${p.c[1]}% ${p.c[2] * (0.65 + 0.35 * p.life)}%)`;
    const s = p.w * (0.7 + 0.5 * p.life);
    fx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  fx.globalAlpha = 1;
}

/* ================= 合成音效 ================= */
let AC = null, master = null;
function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function noiseBuf(ac, dur) {
  const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function sfxLaunch() {
  if (!soundOn) return;
  const ac = audio(), t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf(ac, 0.5);
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.4;
  f.frequency.setValueAtTime(420, t); f.frequency.exponentialRampToValueAtTime(1500, t + 0.4);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.06, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.48);
  src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + 0.5);
}
function sfxBloom(type) {
  if (!soundOn) return;
  const ac = audio(), t = ac.currentTime;
  const o = ac.createOscillator(), og = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.28);
  og.gain.setValueAtTime(0.22, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(og).connect(master); o.start(t); o.stop(t + 0.32);
  const src = ac.createBufferSource(); src.buffer = noiseBuf(ac, 0.6);
  const f = ac.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(220, t + 0.5);
  const g = ac.createGain(); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + 0.6);
}
function sfxCrackle() {
  if (!soundOn || Math.random() < 0.6) return;
  const ac = audio(), t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf(ac, 0.05);
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 2600;
  const g = ac.createGain(); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  src.connect(f).connect(g).connect(master); src.start(t);
}

/* ================= 里程碑 ================= */
const STONES = [1e3, 1e4, 1e5, 1e6, 1e7, 1e8, 1e9];
const STONE_MSG = ["第一千粒光尘落进口袋", "一万了——铺子开始记住你", "十万光尘。夜里没有一朵烟花是白放的",
  "一百万。镇上的孩子以为这是节日", "一千万。你成了夜空本身", "一亿。天文台来登记这颗星", "十亿。你已经不需要这些数字了"];
function milestones() {
  while (STONES.length && G.total >= STONES[0]) {
    STONES.shift();
    toast(STONE_MSG[6 - STONES.length]);
  }
}
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 4200);
}

/* ================= 商店 ================= */
const shopEl = document.getElementById("shop"), itemsEl = document.getElementById("shopItems");
const itemEls = {};
for (const it of ITEMS) {
  const div = document.createElement("div");
  div.className = "item"; div.tabIndex = 0; div.setAttribute("role", "button");
  div.innerHTML = '<div class="t"><span class="name"></span><span class="lv"></span></div><div class="d"></div><div class="cost"></div>';
  itemsEl.appendChild(div);
  itemEls[it.id] = div;
  const buy = () => {
    const c = it.cost();
    if (G.dust < c || G.lv[it.id] >= it.max) return;
    G.dust -= c; G.lv[it.id]++;
    if (it.id === "tower") nextTower = 0;
    if (it.id === "tower" || it.id === "rare" || it.id === "dome") buildScene();
    sfxBloom("ring");
    save();
    renderShop();
  };
  div.addEventListener("click", buy);
  div.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); buy(); } });
}
function renderShop() {
  for (const it of ITEMS) {
    const el = itemEls[it.id];
    const c = it.cost();
    const maxed = G.lv[it.id] >= it.max;
    el.querySelector(".name").textContent = it.name;
    el.querySelector(".lv").textContent = maxed ? "满级" : "Lv." + G.lv[it.id];
    el.querySelector(".d").textContent = it.d();
    el.querySelector(".cost").textContent = maxed ? "——" : fmt(c) + " 光尘";
    el.classList.toggle("no", maxed || G.dust < c);
    el.classList.toggle("can", !maxed && G.dust >= c);
  }
}
function tickShop() {
  for (const it of ITEMS) {
    const el = itemEls[it.id];
    const c = it.cost();
    const maxed = G.lv[it.id] >= it.max;
    el.classList.toggle("no", maxed || G.dust < c);
    el.classList.toggle("can", !maxed && G.dust >= c);
    if (!maxed) el.querySelector(".cost").textContent = fmt(c) + " 光尘";
  }
}

/* ================= 交互 ================= */
let lastTap = 0;
addEventListener("pointerdown", (e) => {
  if (!(e.target instanceof Element) || e.target.closest(".bar") || e.target.closest(".shop")) return;
  document.getElementById("hint").classList.add("gone");
  const now = performance.now();
  const big = now - lastTap < 350;
  lastTap = now;
  const n = big ? 5 : 1;
  for (let i = 0; i < n; i++) {
    setTimeout(() => launch(e.clientX + (Math.random() - 0.5) * (big ? W * 0.5 : 0),
                            Math.min(e.clientY, groundY - 60) + (Math.random() - 0.5) * 40, big), i * 130);
  }
});

document.getElementById("btnShop").addEventListener("click", () => {
  const open = shopEl.classList.toggle("open");
  document.getElementById("btnShop").setAttribute("aria-expanded", String(open));
});
const btnSound = document.getElementById("btnSound");
btnSound.addEventListener("click", () => {
  soundOn = !soundOn;
  btnSound.setAttribute("aria-pressed", String(soundOn));
  if (soundOn) audio();
});
document.getElementById("btnReset").addEventListener("click", () => {
  if (!confirm("重开一晚？光尘、铺子等级全部清空，夜空重新开始。")) return;
  localStorage.removeItem(SAVE_KEY);
  G.dust = 0; G.total = 0; G.blooms = 0;
  G.lv = { fuse: 0, bore: 0, tower: 0, rare: 0, dome: 0 };
  renderShop();
  toast("新的一晚。天还没黑透。");
});
document.getElementById("btnSave").addEventListener("click", () => {
  const snap = document.createElement("canvas");
  snap.width = bgCv.width; snap.height = bgCv.height;
  snap.getContext("2d").drawImage(bgCv, 0, 0);
  snap.getContext("2d").drawImage(fxCv, 0, 0);
  const a = document.createElement("a");
  a.download = "烟花-" + new Date().toISOString().slice(0, 16).replace(/[T:]/g, "-") + ".png";
  a.href = snap.toDataURL("image/png");
  a.click();
});

/* ================= 主循环 ================= */
let last = 0, lastTick = 0, lastSave = 0;
function frame(t) {
  const dt = Math.min(2.4, (t - last) / 16.7 || 1); last = t;
  fx.globalCompositeOperation = "destination-out";
  fx.fillStyle = "rgba(0,0,0,.22)";
  fx.fillRect(0, 0, W, H);
  fx.globalCompositeOperation = "source-over";
  drawSky(t);
  step(dt);
  // 自动燃放塔
  if (G.lv.tower > 0 && t >= nextTower) {
    nextTower = t + towerInterval() * 1000;
    if (parts.length < MAX * 0.75) {
      const golden = Math.random() < rareChance();
      const bt = boats.length ? boats[(Math.random() * boats.length) | 0] : null;
      launch(bt ? bt.x + (Math.random() - 0.5) * 24 : W * (0.12 + Math.random() * 0.76), H * (0.1 + Math.random() * 0.34), Math.random() < 0.12, golden);
    }
  }
  // 界面节流刷新
  if (t - lastTick > 250) {
    lastTick = t;
    document.getElementById("dustNum").textContent = fmt(G.dust);
    const rate = G.lv.tower ? dustPerBloom(false) * 0.6 / towerInterval() : 0;
    document.getElementById("dustRate").textContent = G.lv.tower ? "每秒 " + fmt(rate) : "点夜空挣光尘";
    tickShop();
  }
  if (t - lastSave > 8000) { lastSave = t; save(); }
  requestAnimationFrame(frame);
}
load();
resize();
renderShop();
requestAnimationFrame(frame);
addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.__fw = { G, buildScene };   // 调试/极速验收句柄
})();
</script>
