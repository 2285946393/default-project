<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生重开模拟器 🔄 这一次，我要活出个人样</title>
<style>
  :root{
    --bg1:#1a1030;--bg2:#0d0a1e;--panel:rgba(28,20,52,.6);--panel-solid:#1c1434;
    --border:rgba(167,139,250,.18);--pink:#ff6bbf;--purple:#a78bfa;--cyan:#6ee7ff;
    --gold:#ffd54a;--red:#fb7185;--green:#4ade80;--text:#f0ecff;--muted:#b9aed6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at 50% 0%,var(--bg1),var(--bg2) 70%);
    color:var(--text);font-family:"Microsoft YaHei","Segoe UI",sans-serif;min-height:100vh;
  }
  header{padding:22px 20px 14px;text-align:center}
  header h1{font-size:23px;font-weight:800;letter-spacing:2px}
  header h1 span{color:var(--gold)}
  header .tag{font-size:12.5px;color:var(--muted);margin-top:5px}
  .stage{max-width:760px;margin:0 auto;padding:6px 20px 50px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:22px;margin-bottom:16px;backdrop-filter:blur(6px)}
  .card h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2 small{color:var(--muted);font-weight:400;font-size:12px}
  button{background:var(--panel-solid);border:1px solid var(--border);color:var(--text);
    padding:11px 22px;border-radius:10px;cursor:pointer;font-size:14px;transition:.15s}
  button:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
  button.primary{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;font-weight:600}
  button.primary:hover{filter:brightness(1.15);color:#fff}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .hint{font-size:12px;color:var(--muted);line-height:1.7}
  .screen{display:none}
  .screen.active{display:block}

  /* ---- 天赋选择 ---- */
  .talent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-bottom:16px}
  .talent{background:var(--panel-solid);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;cursor:pointer;transition:.15s}
  .talent:hover{border-color:var(--purple)}
  .talent.sel{border-color:var(--gold);background:rgba(255,213,74,.08);box-shadow:0 0 14px rgba(255,213,74,.15)}
  .talent .tn{font-size:14px;font-weight:600;margin-bottom:4px}
  .talent .td{font-size:11.5px;color:var(--muted);line-height:1.5}
  .talent .stars{font-size:10px;color:var(--gold);letter-spacing:1px}
  .talent .stars.s3{color:var(--pink)}
  /* ---- 属性面板 ---- */
  .props{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:560px){.props{grid-template-columns:repeat(3,1fr)}}
  .prop{background:var(--panel-solid);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
  .prop .k{font-size:11.5px;color:var(--muted)}
  .prop .v{font-size:20px;font-weight:800;margin-top:3px}
  .prop .plus{color:var(--gold)}
  .prop .v.warn{color:var(--red)}
  /* ---- 事件流 ---- */
  .log{background:#0d0a1e;border:1px solid var(--border);border-radius:12px;
    padding:16px;height:380px;overflow-y:auto;font-size:13.5px;line-height:2}
  .log .age-h{color:var(--gold);font-weight:700;margin-top:10px}
  .log .age-h:first-child{margin-top:0}
  .log .ev{padding:1px 0;border-left:2px solid transparent;padding-left:8px;margin-left:4px}
  .log .ev.good{border-color:var(--green)}
  .log .ev.bad{border-color:var(--red)}
  .log .fx{color:var(--muted);font-size:12px}
  .log .fx b{font-weight:600}
  .fx .up{color:var(--green)} .fx .dn{color:var(--red)}
  .log-controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .speed{font-size:12px;color:var(--muted)}
  /* ---- 结局 ---- */
  .ending{text-align:center;padding:12px 0}
  .ending .rank{font-size:15px;color:var(--gold);letter-spacing:3px;margin-bottom:10px}
  .ending .big{font-size:30px;font-weight:800;margin-bottom:8px;
    background:linear-gradient(135deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .ending .desc{font-size:13.5px;color:var(--muted);line-height:1.9;max-width:420px;margin:0 auto}
  .ending .final-props{display:flex;justify-content:center;gap:18px;margin-top:16px;flex-wrap:wrap;font-size:13px}
  .ending .final-props b{color:var(--cyan)}
  footer{text-align:center;padding:22px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);line-height:2}
  footer .qq{color:var(--cyan)}
  .stats-line{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
</style>
</head>

<header>
  <h1>🔄 人生重开 <span>模拟器</span></h1>
  <div class="tag">这一次，我要活出个人样 —— 数据来自开源项目 lifeRestart（MIT）</div>

<div class="stage">

  <section id="scr-start" class="screen active">
    <div class="card">
      <h2>🌅 转生殿 <small>先抽天赋，再分属性</small></h2>
      <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <button class="primary" id="btn-roll-talent">🎰 抽取天赋（10 选 3）</button>
        <button id="btn-random-all">🎲 全随机开局</button>
      </div>
      <div class="talent-grid" id="talent-grid"></div>
      <div class="hint" id="talent-hint">点击「抽取天赋」开始，选好 3 个天赋后分配属性</div>
    </div>
    <div class="card" id="alloc-card" style="display:none">
      <h2>⚖️ 属性分配 <small>剩余点数随天赋赠送</small></h2>
      <div class="hint" style="margin-bottom:12px">颜值 CHR · 智力 INT · 体质 STR · 快乐 SPR（家境 MNY 天赋决定）。上限 10 点单项。</div>
      <div class="props" id="alloc-props"></div>
      <div class="row" style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="primary" id="btn-start-life" disabled>🚀 开始人生</button>
      </div>
    </div>
  </section>

  <!-- ========== 人生页 ========== -->
  <section id="scr-life" class="screen">
    <div class="card">
      <div class="props" id="life-props"></div>
      <div class="log" id="life-log"></div>
      <div class="log-controls">
        <button class="primary" id="btn-next">⏭️ 继续下一年</button>
        <button id="btn-auto">▶️ 自动播放</button>
        <button id="btn-finish">⏩ 直接跳到结局</button>
        <span class="speed" id="auto-state"></span>
      </div>
    </div>
  </section>

  <!-- ========== 结局页 ========== -->
  <section id="scr-end" class="screen">
    <div class="card ending" id="end-card"></div>
    <div class="card" style="text-align:center">
      <button class="primary" id="btn-again">🔄 再来一世</button>
      <div class="stats-line" id="life-stats"></div>
    </div>
  </section>

</div>

<footer>

  talentRoll: [],      // 本轮抽到的 10 个天赋
  selected: [],        // 选中的 3 个
  base: {CHR:1,INT:1,STR:1,MNY:1,SPR:5},
  allocPts: 20,
  alloc: {CHR:0,INT:0,STR:0,SPR:0},
  life: null
};

function $(id){ return document.getElementById(id); }
function showScreen(name){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $('scr-' + name).classList.add('active');
  G.screen = name;
}

/* ===================== 天赋抽取 ===================== */
function rollTalents(){
  /* 按稀有度加权抽 10 个：grade 0/1/2/3 权重 60/25/12/3 */
  var pool = [];
  TALENTS.forEach(function(t){
    var w = [60,25,12,3][t.grade] || 60;
    for(var i=0;i<w;i++) pool.push(t);
  });
  var picked = [], seen = {};
  while(picked.length < 10 && picked.length < TALENTS.length){
    var t = pick(pool);
    if(!seen[t.id]){ seen[t.id] = 1; picked.push(t); }
  }
  G.talentRoll = picked;
  G.selected = [];
  renderTalents();
  $('talent-hint').textContent = '从 10 个天赋里选 3 个（金色为已选）';
}
function renderTalents(){
  var html = '';
  G.talentRoll.forEach(function(t, i){
    var stars = '★'.repeat(t.grade + 1);
    var sel = G.selected.indexOf(t) >= 0 ? ' sel' : '';
    html += '<div class="talent'+sel+'" data-i="'+i+'">'
      + '<div class="tn">'+t.name+'</div>'
      + '<div class="stars'+(t.grade>=3?' s3':'')+'">'+stars+'</div>'
      + '<div class="td">'+(t.desc||'')+'</div></div>';
  });
  var grid = $('talent-grid');
  grid.innerHTML = html;
  grid.querySelectorAll('.talent').forEach(function(el){
    el.addEventListener('click', function(){
      var t = G.talentRoll[parseInt(this.dataset.i,10)];
      var idx = G.selected.indexOf(t);
      if(idx >= 0){ G.selected.splice(idx,1); }
      else {
        if(G.selected.length >= 3){ return; }
        G.selected.push(t);
      }
      renderTalents();
      if(G.selected.length === 3){ renderAlloc(); }
    });
  });
}

/* ===================== 属性分配 ===================== */
function renderAlloc(){
  var card = $('alloc-card');
  card.style.display = 'block';
  /* 计算天赋加成 */
  var bonus = {CHR:0,INT:0,STR:0,MNY:0,SPR:0};
  G.selected.forEach(function(t){
    PROP_DEFS.forEach(function(p){
      if(t[p.key]) bonus[p.key] += t[p.key];
    });
  });
  /* 简化规则：智力天赋送分配点数（按 grade*2） */
  G.allocPts = 20 + G.selected.reduce(function(s,t){ return s + (t.grade||0)*2; }, 0);
  var keys = ['CHR','INT','STR','SPR'];
  keys.forEach(function(k){ G.alloc[k] = 0; });
  G.base = {CHR:1,INT:1,STR:1,MNY:1+bonus.MNY,SPR:5+bonus.SPR};
  function paint(){
    var used = keys.reduce(function(s,k){ return s + G.alloc[k]; }, 0);
    var left = G.allocPts - used;
    var html = '';
    PROP_DEFS.forEach(function(p){
      var val, extra = '';
      if(p.key === 'MNY'){
        val = G.base.MNY; extra = ' <span class="plus">天赋+'+bonus.MNY+'</span>';
      } else {
        val = G.base[p.key] + G.alloc[p.key];
      }
      html += '<div class="prop"><div class="k">'+p.icon+' '+p.name+extra+'</div><div class="v">'+val+'</div></div>';
    });
    html += '<div class="prop" style="grid-column:1/-1"><div class="k">剩余点数</div><div class="v'+(left<0?' warn':'')+'">'+left+'</div></div>';
    $('alloc-props').innerHTML = html;
    /* 加减按钮 */
    PROP_DEFS.forEach(function(p){
      if(p.key === 'MNY') return;
      var cell = document.createElement('div');
    });
    $('btn-start-life').disabled = left !== 0;
  }
  /* 分配 UI：每个可分配属性一行 +/- */
  var panelHtml = '';
  keys.forEach(function(k){
    var def = PROP_DEFS.find(function(p){ return p.key===k; });
    panelHtml += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      + '<span style="width:90px;font-size:13px">'+def.icon+' '+def.name+'</span>'
      + '<button data-k="'+k+'" data-d="-1" style="padding:4px 12px">−</button>'
      + '<b id="al-'+k+'" style="width:26px;text-align:center">0</b>'
      + '<button data-k="'+k+'" data-d="1" style="padding:4px 12px">＋</button></div>';
  });
  var old = $('alloc-btns');
  if(old) old.remove();
  var btns = document.createElement('div');
  btns.id = 'alloc-btns';
  btns.innerHTML = panelHtml;
  card.insertBefore(btns, card.querySelector('.row'));
  btns.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      var k = this.dataset.k, d = parseInt(this.dataset.d,10);
      var used = keys.reduce(function(s,kk){ return s + G.alloc[kk]; }, 0);
      if(d > 0 && used >= G.allocPts) return;
      if(d < 0 && G.alloc[k] <= 0) return;
      var cur = G.base[k] + G.alloc[k] + d;
      if(cur > 10 && d > 0) return;  /* 单项上限10 */
      G.alloc[k] += d;
      $('al-'+k).textContent = G.alloc[k];
      paint();
    });
  });
  keys.forEach(function(k){ /* 初始化显示 */ });
  paint();
}

/* ===================== 人生模拟 ===================== */
function newLife(){
  var bonus = {CHR:0,INT:0,STR:0,MNY:0,SPR:0};
  G.selected.forEach(function(t){
    PROP_DEFS.forEach(function(p){ if(t[p.key]) bonus[p.key] += t[p.key]; });
  });
  return {
    age: 0, alive: true,
    CHR: clamp(G.base.CHR + G.alloc.CHR, 0, 10),
    INT: clamp(G.base.INT + G.alloc.INT, 0, 10),
    STR: clamp(G.base.STR + G.alloc.STR, 0, 10),
    MNY: clamp(G.base.MNY, 0, 10),
    SPR: clamp(G.base.SPR, 0, 10),
    total: {CHR:0,INT:0,STR:0,MNY:0,SPR:0},
    eventCount: 0,
    autoTimer: null
  };
}
function lifePropHtml(L){
  var html = '';
  PROP_DEFS.forEach(function(p){
    var v = L[p.key];
    var cls = v <= 0 ? ' warn' : '';
    html += '<div class="prop"><div class="k">'+p.icon+' '+p.name+'</div><div class="v'+cls+'">'+v+'</div></div>';
  });
  html += '<div class="prop" style="grid-column:1/-1"><div class="k">🎂 年龄</div><div class="v">'+L.age+'</div></div>';
  return html;
}
/* 解析 include/exclude 条件
   支持三种格式：
   EVT?[10000,10001] —— 事件发生过（inc）/没发生过（exc）
   TLT?[1048]        —— 拥有天赋（inc）/没有天赋（exc）
   STR<0 / CHR>5     —— 属性比较 */
function parseCond(str){
  var s = String(str || '');
  var out = {evts: [], talents: [], attr: []};
  if(!s) return out;
  var m;
  var reEvt = /EVT\?\[([0-9,\s]+)\]/g;
  while((m = reEvt.exec(s))) m[1].split(',').forEach(function(x){ if(x.trim()) out.evts.push(parseInt(x,10)); });
  var reTlt = /TLT\?\[([0-9,\s]+)\]/g;
  while((m = reTlt.exec(s))) m[1].split(',').forEach(function(x){ if(x.trim()) out.talents.push(parseInt(x,10)); });
  var reAttr = /\b(CHR|INT|STR|MNY|SPR)\s*([<>]=?)\s*(-?[0-9]+)/g;
  while((m = reAttr.exec(s))) out.attr.push({k: m[1], op: m[2], v: parseFloat(m[3])});
  return out;
}
var condCache = {};
function getCond(str){
  if(!(str in condCache)) condCache[str] = parseCond(str);
  return condCache[str];
}
function attrCmp(L, c){
  var v = L[c.k];
  if(c.op === '<') return v < c.v;
  if(c.op === '<=') return v <= c.v;
  if(c.op === '>') return v > c.v;
  return v >= c.v;
}
function eventAllowed(e, L, happened){
  var inc = getCond(e.inc), exc = getCond(e.exc);
  var i;
  for(i=0;i<exc.evts.length;i++){ if(happened[exc.evts[i]]) return false; }
  for(i=0;i<exc.talents.length;i++){ if(G.talentIds.indexOf(exc.talents[i])>=0) return false; }
  for(i=0;i<exc.attr.length;i++){ if(attrCmp(L, exc.attr[i])) return false; }
  if(inc.evts.length){
    var ok = false;
    for(i=0;i<inc.evts.length;i++){ if(happened[inc.evts[i]]){ ok = true; break; } }
    if(!ok) return false;
  }
  for(i=0;i<inc.talents.length;i++){ if(G.talentIds.indexOf(inc.talents[i])<0) return false; }
  for(i=0;i<inc.attr.length;i++){ if(!attrCmp(L, inc.attr[i])) return false; }
  return true;
}
/* 自然衰老：体质逐年衰减，过低即死亡（体质越高越扛老） */
function aging(L, logEl){
  var t = L.age - 50;
  var drop = 0;
  if(t > 0){
    /* 体质 8+ 抗老，体质低加速衰老 */
    var rate = L.STR >= 8 ? 0.3 : (L.STR >= 5 ? 0.5 : 0.8);
    if(Math.random() < rate) drop = 1;
    if(t > 30 && Math.random() < 0.3) drop += 1;
  }
  if(drop > 0 && L.STR > 0){
    L.STR = clamp(L.STR - drop, 0, 10);
    var line = document.createElement('div');
    line.className = 'ev bad';
    line.innerHTML = '岁月不饶人，体质 <span class="fx">(<span class="dn">-'+drop+'</span>)</span>';
    logEl.appendChild(line);
  }
  if(L.STR <= 0){
    var line2 = document.createElement('div');
    line2.className = 'ev bad';
    line2.textContent = '油尽灯枯，你的生命走到了尽头。';
    logEl.appendChild(line2);
    return false;
  }
  return true;
}
function yearPass(L, logEl, happened){
  L.age++;
  /* 自然死亡判定：体质见底 */
  var evIds = AGES[String(L.age)] || [];
  if(!evIds.length){ return; }
  var pool = evIds.filter(function(id){
    var e = EVENTS[String(id)];
    return e && !e.noRandom && eventAllowed(e, L, happened);
  });
  var times = 1;
  if(L.age < 5) times = 2; else if(L.age < 20) times = 1 + (Math.random()<0.3?1:0);
  var ageHead = document.createElement('div');
  ageHead.className = 'age-h';
  ageHead.textContent = '—— ' + L.age + ' 岁 ——';
  logEl.appendChild(ageHead);
  for(var t=0; t<times && pool.length; t++){
    var id = pick(pool);
    var e = EVENTS[String(id)];
    happened[id] = 1;
    L.eventCount++;
    var line = document.createElement('div');
    line.className = 'ev';
    var fxTxt = [];
    if(e.ef){
      for(var k in e.ef){
        var dv = e.ef[k];
        L[k] = clamp(L[k] + dv, 0, 10);
        L.total[k] += dv;
        var nm = ({CHR:'颜值',INT:'智力',STR:'体质',MNY:'家境',SPR:'快乐',LIF:'生命',AGE:'寿命'})[k] || k;
        fxTxt.push(nm + (dv>0?'<span class="up">+'+dv+'</span>':'<span class="dn">'+dv+'</span>'));
      }
      if(fxTxt.length > 2 || (e.ef.LIF < 0)) line.className += ' bad';
      else if(fxTxt.length) line.className += ' good';
    }
    line.innerHTML = e.t + (fxTxt.length ? ' <span class="fx">('+fxTxt.join(' ')+')</span>' : '');
    logEl.appendChild(line);
    if(e.ef && e.ef.LIF < 0){ L.alive = false; break; }
  }
  /* 体质归零 = 死亡（婴儿期夭折线） */
  if(L.alive && L.STR <= 0){
    var die = document.createElement('div');
    die.className = 'ev bad';
    die.textContent = EVENTS['10000'] ? EVENTS['10000'].t : '你死了。';
    logEl.appendChild(die);
    L.alive = false;
  }
  /* 衰老结算（50 岁后） */
  if(L.alive && L.age > 50 && !aging(L, logEl)){ L.alive = false; }
  logEl.scrollTop = logEl.scrollHeight;
}
function finishLife(L, logEl, happened){
  while(L.alive && L.age < 500){ yearPass(L, logEl, happened); }
  /* 结局评级 */
  var sum = L.CHR + L.INT + L.STR + L.MNY + L.SPR;
  var rank, title, desc;
  if(L.age >= 90){ rank='SSS'; title='传奇人生'; desc='活了 '+L.age+' 岁，五维总和 '+sum+' 点。这辈子的你，值得写进族谱第一页。'; }
  else if(L.age >= 70){ rank='SS'; title='圆满人生'; desc='寿终正寝， '+L.age+' 岁安然谢幕。有过高光，也有遗憾，但这才叫人生。'; }
  else if(L.age >= 50){ rank='S'; title='平稳人生'; desc=L.age+' 岁的旅程画上句号。不算惊艳，但也过得有滋有味。'; }
  else if(L.age >= 30){ rank='A'; title='普通人生'; desc=L.age+' 岁，普通地来，普通地走。下次记得多点体质。'; }
  else if(L.age >= 15){ rank='B'; title='早逝人生'; desc='才 '+L.age+' 岁就没了！建议重开时选个「红肚兜」防夭折。'; }
  else { rank='C'; title='夭折'; desc=L.age+' 岁便离开人世……这就是不看天赋硬开的下场。'; }
  if(!L.alive && L.age < 90 && sum >= 35){ rank='S'; title='流星人生'; desc='虽然只活了 '+L.age+' 岁，但五维总和 '+sum+'，短暂而耀眼。'; }
  var card = $('end-card');
  var finalHtml = '<div class="rank">'+rank+' 评级</div>'
    + '<div class="big">'+title+'</div>'
    + '<div class="desc">'+desc+'</div>'
    + '<div class="final-props">'
    + PROP_DEFS.map(function(p){ return p.name+' <b>'+L[p.key]+'</b>'; }).join(' · ')
    + '</div>';
  card.innerHTML = finalHtml;
  $('life-stats').textContent = '本世共经历 ' + L.eventCount + ' 个事件 · 走到 ' + L.age + ' 岁';
  showScreen('end');
}

/* ===================== 流程按钮 ===================== */
$('btn-roll-talent').addEventListener('click', rollTalents);
$('btn-random-all').addEventListener('click', function(){
  rollTalents();
  /* 随机选3 */
  var idxs = [];
  while(idxs.length < 3){ var i = rnd(10); if(idxs.indexOf(i)<0) idxs.push(i); }
  idxs.forEach(function(i){ G.selected.push(G.talentRoll[i]); });
  renderTalents();
  renderAlloc();
  /* 随机分配 */
  var keys = ['CHR','INT','STR','SPR'];
  keys.forEach(function(k){ G.alloc[k] = 0; });
  var used = 0;
  while(used < G.allocPts){
    var k = pick(keys);
    if(G.base[k] + G.alloc[k] >= 10) continue;
    G.alloc[k]++; used++;
  }
  keys.forEach(function(k){ var el = $('al-'+k); if(el) el.textContent = G.alloc[k]; });
  /* 重绘 */
  renderAlloc();
  var ev = document.createEvent('HTMLEvents');
  /* 再跑一次随机分配（renderAlloc 会重置） */
  keys.forEach(function(k){ G.alloc[k] = 0; });
  used = 0;
  while(used < G.allocPts){
    var k2 = pick(keys);
    if(G.base[k2] + G.alloc[k2] >= 10) continue;
    G.alloc[k2]++; used++;
  }
  keys.forEach(function(k2){ var el = $('al-'+k2); if(el) el.textContent = G.alloc[k2]; });
  $('btn-start-life').disabled = false;
});
$('btn-start-life').addEventListener('click', function(){
  G.life = newLife();
  var logEl = $('life-log');
  logEl.innerHTML = '';
  G.happened = {};
  G.talentIds = G.selected.map(function(t){ return t.id; });
  var head = document.createElement('div');
  head.className = 'age-h';
  head.textContent = '—— 0 岁 · 出生 ——';
  logEl.appendChild(head);
  /* 0 岁特殊事件：胎死腹中（STR<0 时触发） */
  var still = EVENTS['10494'];
  if(still && G.life.STR <= 0){
    var line = document.createElement('div');
    line.className = 'ev bad';
    line.textContent = still.t;
    logEl.appendChild(line);
    G.life.alive = false;
  }
  $('life-props').innerHTML = lifePropHtml(G.life);
  showScreen('life');
  if(!G.life.alive) endNow();
});
$('btn-next').addEventListener('click', function(){
  if(!G.life || !G.life.alive){ endNow(); return; }
  yearPass(G.life, $('life-log'), G.happened);
  $('life-props').innerHTML = lifePropHtml(G.life);
  if(!G.life.alive) endNow();
});
$('btn-auto').addEventListener('click', function(){
  var L = G.life;
  if(!L) return;
  var b = $('btn-auto');
  if(L.autoTimer){
    clearInterval(L.autoTimer); L.autoTimer = null;
    b.textContent = '▶️ 自动播放'; $('auto-state').textContent = '';
    return;
  }
  b.textContent = '⏸️ 暂停';
  L.autoTimer = setInterval(function(){
    if(!L.alive){ clearInterval(L.autoTimer); L.autoTimer = null; b.textContent='▶️ 自动播放'; endNow(); return; }
    yearPass(L, $('life-log'), G.happened);
    $('life-props').innerHTML = lifePropHtml(L);
  }, 350);
});
function endNow(){
  if(!G.life) return;
  if(G.life.autoTimer) clearInterval(G.life.autoTimer);
  finishLife(G.life, $('life-log'), G.happened);
}
$('btn-finish').addEventListener('click', endNow);
$('btn-again').addEventListener('click', function(){
  G.selected = []; G.talentRoll = [];
  $('talent-grid').innerHTML = '';
  $('alloc-card').style.display = 'none';
  $('talent-hint').textContent = '点击「抽取天赋」开始';
  showScreen('start');
});

/* 若无数据（直接打开没注入），提示 */
if(!TALENTS.length){
  $('talent-hint').textContent = '⚠️ 数据未加载：请用完整版文件（数据内嵌版）';
}
</script>
