<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全能工具箱 All-in-One Kit</title>
<style>
  :root{--bg:#0f1220;--panel:#171a2b;--panel2:#1e2340;--line:#2a3050;--text:#e8ecff;--muted:#93a0c4;--cyan:#56c8ff;--green:#4ade80;--yellow:#fbbf24;--pink:#f472b6;--purple:#a78bfa;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","Segoe UI",sans-serif;min-height:100vh}
  header{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:linear-gradient(180deg,#131629,#0f1220)}
  header h1{font-size:21px;font-weight:700}
  header h1 span{color:var(--cyan)}
  header .tag{font-size:12.5px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;padding:20px 24px 30px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card h2 .ico{font-size:16px}
  .tool{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .tool:last-child{margin-bottom:0}
  .tool label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  .tool input[type=text],.tool input[type=number],.tool input[type=password],.tool textarea,.tool select{width:100%;background:#10142a;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px 11px;font-size:14px;margin-bottom:8px;font-family:Consolas,"Microsoft YaHei",monospace}
  .tool textarea{min-height:70px;resize:vertical}
  .tool textarea.big{min-height:140px}
  .tool input:focus,.tool textarea:focus,.tool select:focus{outline:none;border-color:var(--cyan)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px;transition:.15s}
  button:hover{border-color:var(--cyan);color:var(--cyan)}
  button.primary{background:var(--cyan);color:#04121c;border-color:var(--cyan);font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  .out{background:#0d1120;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;color:var(--green);margin-top:6px;font-family:Consolas,monospace;min-height:20px;word-break:break-all;display:none}
  .out.show{display:block}
  .units{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .units select{flex:1;min-width:120px}
  .eq{margin:0 2px;color:var(--muted)}
  .row2{display:flex;gap:8px;flex-wrap:wrap}
  .row2 input{flex:1;min-width:140px}
  .stat{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.8}
  .stat b{color:var(--text)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .chip:hover{border-color:var(--cyan);color:var(--cyan)}
  .chk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:8px}
  .chk input{width:16px;height:16px;accent-color:var(--cyan)}
  .hashbtn{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .hashbtn button{font-size:12px;padding:6px 11px}
</style>
</head>
<body>

<header>
  <h1>🧰 全能工具箱 <span>All-in-One Kit</span></h1>
  <span class="tag">单位换算 · 文本编码 · 随机生成 · 时间日期 · 每日离线可用</span>
</header>

<div class="grid">

  <!-- ============ 单位换算 ============ -->
  <div class="card">
    <h2><span class="ico">📐</span>单位换算</h2>

    <div class="tool">
      <label>长度 Length</label>
      <div class="units">
        <select id="lenFrom"><option value="1">米 m</option><option value="100">厘米 cm</option><option value="1000">毫米 mm</option><option value="0.001">千米 km</option><option value="39.37">英寸 in</option><option value="3.2808">英尺 ft</option><option value="1.0936">码 yd</option></select>
        <span class="eq">→</span>
        <select id="lenTo"><option value="1">米 m</option><option value="100">厘米 cm</option><option value="1000">毫米 mm</option><option value="0.001">千米 km</option><option value="39.37">英寸 in</option><option value="3.2808">英尺 ft</option><option value="1.0936">码 yd</option></select>
      </div>
      <input type="number" id="lenIn" placeholder="输入数值">
      <button class="primary" onclick="convUnit('len')">换算</button>
      <div class="out" id="lenOut"></div>
    </div>

    <div class="tool">
      <label>温度 Temperature</label>
      <div class="units">
        <select id="tempFrom"><option value="C">°C 摄氏</option><option value="F">°F 华氏</option><option value="K">K 开尔文</option></select>
        <span class="eq">→</span>
        <select id="tempTo"><option value="F">°F 华氏</option><option value="C">°C 摄氏</option><option value="K">K 开尔文</option></select>
      </div>
      <input type="number" id="tempIn" placeholder="输入温度">
      <button class="primary" onclick="convTemp()">换算</button>
      <div class="out" id="tempOut"></div>
    </div>

    <div class="tool">
      <label>重量 Mass</label>
      <div class="units">
        <select id="massFrom"><option value="1">千克 kg</option><option value="1000">克 g</option><option value="0.001">吨 t</option><option value="2.2046">磅 lb</option><option value="35.274">盎司 oz</option></select>
        <span class="eq">→</span>
        <select id="massTo"><option value="1">千克 kg</option><option value="1000">克 g</option><option value="0.001">吨 t</option><option value="2.2046">磅 lb</option><option value="35.274">盎司 oz</option></select>
      </div>
      <input type="number" id="massIn" placeholder="输入数值">
      <button class="primary" onclick="convUnit('mass')">换算</button>
      <div class="out" id="massOut"></div>
    </div>

    <div class="tool">
      <label>数据存储 Data Storage</label>
      <div class="units">
        <select id="dataFrom"><option value="1">字节 B</option><option value="0.001">千字节 KB</option><option value="0.000001">兆字节 MB</option><option value="0.000000001">吉字节 GB</option><option value="0.000000000001">太字节 TB</option></select>
        <span class="eq">→</span>
        <select id="dataTo"><option value="1">字节 B</option><option value="0.001">千字节 KB</option><option value="0.000001">兆字节 MB</option><option value="0.000000001">吉字节 GB</option><option value="0.000000000001">太字节 TB</option></select>
      </div>
      <input type="number" id="dataIn" placeholder="输入数值">
      <button class="primary" onclick="convUnit('data')">换算</button>
      <div class="out" id="dataOut"></div>
    </div>
  </div>

  <!-- ============ 文本工具 ============ -->
  <div class="card">
    <h2><span class="ico">🔤</span>文本工具</h2>

    <div class="tool">
      <label>输入文本</label>
      <textarea class="big" id="txtIn" placeholder="在这里输入或粘贴文本…"></textarea>
      <div class="btnrow">
        <button class="primary" onclick="txtStats()">📊 字数统计</button>
        <button onclick="txtUpper()">大写</button>
        <button onclick="txtLower()">小写</button>
        <button onclick="txtReverse()">反转</button>
        <button onclick="txtSort()">排序行</button>
        <button onclick="txtUnique()">去重行</button>
      </div>
      <div class="out" id="txtOut"></div>
      <div class="stat"><b>实时统计：</b> <span id="liveStats">0 字 / 0 字符 / 0 行</span></div>
    </div>

    <div class="tool">
      <label>编码转换</label>
      <textarea id="codeIn" placeholder="输入要编码/解码的文本…"></textarea>
      <div class="btnrow">
        <button class="primary" onclick="encBase64()">Base64 编码</button>
        <button onclick="decBase64()">Base64 解码</button>
        <button onclick="encUrl()">URL 编码</button>
        <button onclick="decUrl()">URL 解码</button>
      </div>
      <div class="out" id="codeOut"></div>
    </div>

    <div class="tool">
      <label>哈希计算 (MD5 / SHA)</label>
      <textarea id="hashIn" placeholder="输入要计算哈希的文本…"></textarea>
      <div class="hashbtn">
        <button class="primary" onclick="doHash('md5')">MD5</button>
        <button onclick="doHash('sha1')">SHA-1</button>
        <button onclick="doHash('sha256')">SHA-256</button>
        <button onclick="doHash('sha512')">SHA-512</button>
      </div>
      <div class="out" id="hashOut"></div>
    </div>
  </div>

  <!-- ============ 随机生成 ============ -->
  <div class="card">
    <h2><span class="ico">🎲</span>随机生成</h2>

    <div class="tool">
      <label>强密码生成器</label>
      <div class="chk">
        <label><input type="checkbox" id="pwUpper" checked> 大写</label>
        <label><input type="checkbox" id="pwLower" checked> 小写</label>
        <label><input type="checkbox" id="pwNum" checked> 数字</label>
        <label><input type="checkbox" id="pwSym" checked> 符号</label>
      </div>
      <div class="row2">
        <input type="number" id="pwLen" value="16" min="4" max="64">
        <button class="primary" onclick="genPassword()">生成</button>
      </div>
      <div class="out" id="pwOut"></div>
    </div>

    <div class="tool">
      <label>UUID 生成器 (v4)</label>
      <div class="btnrow">
        <button class="primary" onclick="genUuid()">生成 UUID</button>
        <button onclick="genUuid(5)">生成 5 个</button>
      </div>
      <div class="out" id="uuidOut"></div>
    </div>

    <div class="tool">
      <label>随机数</label>
      <div class="row2">
        <input type="number" id="randMin" value="1" placeholder="最小">
        <input type="number" id="randMax" value="100" placeholder="最大">
        <button class="primary" onclick="genRandom()">随机</button>
      </div>
      <div class="out" id="randOut"></div>
    </div>
  </div>

  <!-- ============ 时间日期 ============ -->
  <div class="card">
    <h2><span class="ico">🕒</span>时间日期</h2>

    <div class="tool">
      <label>当前时间</label>
      <div class="chips">
        <span class="chip" id="clock" style="font-size:15px;color:var(--cyan)">--:--:--</span>
      </div>
      <div class="stat" id="clockDate">请等待…</div>
    </div>

    <div class="tool">
      <label>Unix 时间戳转换</label>
      <div class="row2">
        <input type="number" id="tsIn" placeholder="输入Unix时间戳(秒)">
        <button class="primary" onclick="tsToDate()">→ 转日期</button>
      </div>
      <div class="out" id="tsOut"></div>
      <div class="stat">现在的时间戳：<b id="nowTs">-</b> 秒</div>
    </div>
  </div>

  <!-- ============ 颜色 / 其他 ============ -->
  <div class="card">
    <h2><span class="ico">🎨</span>其他实用</h2>

    <div class="tool">
      <label>颜色转换 (HEX → RGB)</label>
      <div class="row2">
        <input type="text" id="hexIn" value="#56c8ff" placeholder="#rrggbb">
        <button class="primary" onclick="hexToRgb()">转换</button>
      </div>
      <div class="out" id="hexOut"></div>
      <div style="height:34px;border-radius:7px;margin-top:8px;background:var(--panel2)"><div id="colorSwatch" style="height:100%;border-radius:7px;background:#56c8ff"></div></div>
    </div>

    <div class="tool">
      <label>数字进制转换</label>
      <div class="row2">
        <input type="text" id="numIn" value="255" placeholder="输入数字">
        <select id="numFrom" style="flex:0 0 90px">
          <option value="10">十进制</option><option value="2">二进制</option><option value="16">十六进制</option><option value="8">八进制</option>
        </select>
      </div>
      <div class="btnrow"><button class="primary" onclick="numConv()">转换</button></div>
      <div class="out" id="numOut"></div>
    </div>
  </div>

</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ---------- 单位换算 ---------- */
const unitMap = {
  len: {factor:{}, name:'长度'},
  mass: {factor:{}, name:'重量'},
  data:{factor:{}, name:'数据'}
};
function convUnit(which){
  const from = $(which+'From'), to=$(which+'To'), v=parseFloat($(which+'In').value);
  const out=$(which+'Out');
  if(isNaN(v)){ out.textContent='请输入有效数字'; out.classList.add('show'); return; }
  // factor: value(单位) = factor * base单位
  const fmap = {
    len: {1:1,100:0.01,1000:0.001,0.001:1000,39.37:0.0254,3.2808:0.3048,1.0936:0.9144},
    mass:{1:1,1000:0.001,0.001:1000,2.2046:0.453592,35.274:0.0283495},
    data:{1:1,0.001:1000,0.000001:1e6,0.000000001:1e9,0.000000000001:1e12}
  };
  const base = v * fmap[which][parseFloat(from.value)];
  const res = base / fmap[which][parseFloat(to.value)];
  out.textContent = `${v} ${from.options[from.selectedIndex].text.split(' ')[0]} = ${res.toLocaleString('zh-CN',{maximumFractionDigits:8})} ${to.options[to.selectedIndex].text.split(' ')[0]}`;
  out.classList.add('show');
}
function convTemp(){
  const f=$( 'tempFrom').value,t=$('tempTo').value,v=parseFloat($('tempIn').value);
  const out=$('tempOut');
  if(isNaN(v)){out.textContent='请输入有效数字';out.classList.add('show');return;}
  let c;
  if(f==='C')c=v; else if(f==='F')c=(v-32)*5/9; else c=v-273.15;
  let r;
  if(t==='C')r=c; else if(t==='F')r=c*9/5+32; else r=c+273.15;
  const unit={C:'°C',F:'°F',K:'K'}[t];
  out.textContent=`${v}°${f==='C'?'C':f==='F'?'F':'K'} = ${r.toFixed(2)}${unit}`;
  out.classList.add('show');
}

/* ---------- 文本工具 ---------- */
function getTxt(){return $('txtIn').value;}
function showTxt(s){const o=$('txtOut');o.textContent=s;o.classList.add('show');}
function txtStats(){
  const t=getTxt();
  const chars=t.length, words=t.trim()?t.trim().split(/\s+/).length:0, lines=t?t.split('\n').length:0;
  showTxt(`字数: ${words} · 字符: ${chars} · 行数: ${lines} · 中文: ${(t.match(/[\u4e00-\u9fa5]/g)||[]).length}`);
}
$('txtIn').oninput=()=>{const t=getTxt();$('liveStats').textContent=`${t.trim()?t.trim().split(/\s+/).length:0} 字 / ${t.length} 字符 / ${t?t.split('\n').length:0} 行`;};
function txtUpper(){showTxt(getTxt().toUpperCase());}
function txtLower(){showTxt(getTxt().toLowerCase());}
function txtReverse(){showTxt([...getTxt()].reverse().join(''));}
function txtSort(){showTxt(getTxt().split('\n').sort().join('\n'));}
function txtUnique(){showTxt([...new Set(getTxt().split('\n'))].join('\n'));}

/* ---------- 编码 ---------- */
function getCode(){return $('codeIn').value;}
function showCode(s){const o=$('codeOut');o.textContent=s;o.classList.add('show');}
function encBase64(){showCode(btoa(unescape(encodeURIComponent(getCode()))));}
function decBase64(){try{showCode(decodeURIComponent(escape(atob(getCode().trim()))));}catch(e){showCode('解码失败: 不是有效的Base64');}}
function encUrl(){showCode(encodeURIComponent(getCode()));}
function decUrl(){try{showCode(decodeURIComponent(getCode()));}catch(e){showCode('解码失败');}}

/* ---------- 哈希 (纯JS实现 MD5/SHA) ---------- */
// 简化: 用 crypto.subtle (需HTTPS或localhost) + 降级到简单哈希
function str2ab(s){const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&0xff;return a;}
async function doHash(alg){
  const inp=$('hashIn').value, o=$('hashOut');
  if(!inp){o.textContent='请输入文本';o.classList.add('show');return;}
  try{
    if(window.crypto && crypto.subtle){
      const buf=await crypto.subtle.digest(alg.replace('md5','SHA-1')==='md5'?'SHA-1':alg==='md5'?'SHA-1':alg, str2ab(inp));
      o.textContent=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    } else {
      // 降级: 简单FNV-1a哈希
      let h=0x811c9dc5;
      for(let i=0;i<inp.length;i++){h^=inp.charCodeAt(i);h=(h*0x01000193)>>>0;}
      o.textContent='[降级FNV-1a] '+h.toString(16);
    }
    o.classList.add('show');
  }catch(e){o.textContent='需在 localhost 或 HTTPS 环境计算';o.classList.add('show');}
}

// 重写doHash用内置md5
async function doHash(alg){
  const inp=$('hashIn').value,o=$('hashOut');
  if(!inp){o.textContent='请输入文本';o.classList.add('show');return;}
  if(alg==='md5'){o.textContent=md5(inp);o.classList.add('show');return;}
  try{
    const a=new Uint8Array(inp.length);for(let i=0;i<inp.length;i++)a[i]=inp.charCodeAt(i)&0xff;
    const buf=await crypto.subtle.digest(alg, a);
    o.textContent=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){o.textContent='SHA 需在 localhost/HTTPS 环境, MD5 可离线';}
  o.classList.add('show');
}

/* ---------- 随机生成 ---------- */
function genPassword(){
  const sets=[],upper='ABCDEFGHJKLMNPQRSTUVWXYZ',lower='abcdefghijkmnopqrstuvwxyz',num='23456789',sym='!@#$%^&*()-_=+[]{}?';
  if($('pwUpper').checked)sets.push(upper);if($('pwLower').checked)sets.push(lower);
  if($('pwNum').checked)sets.push(num);if($('pwSym').checked)sets.push(sym);
  const len=Math.min(64,Math.max(4,parseInt($('pwLen').value)||16));
  const all=sets.join('');if(!all){$('pwOut').textContent='至少勾选一种字符类型';$('pwOut').classList.add('show');return;}
  let pw='';
  // 保证每类至少一个
  for(const s of sets) pw+=s[Math.floor(Math.random()*s.length)];
  while(pw.length<len) pw+=all[Math.floor(Math.random()*all.length)];
  // 打乱
  pw=pw.split('').sort(()=>Math.random()-0.5).join('');
  $('pwOut').textContent=pw;$('pwOut').classList.add('show');
}
function genUuid(n){
  n=n||1;const outs=[];
  for(let k=0;k<n;k++){
    let s='';
    for(let i=0;i<36;i++){
      const r=Math.floor(Math.random()*16);
      if(i===8||i===13||i===18||i===23)s+='-';
      else if(i===14)s+='4';
      else if(i===19)s+=(Math.floor(Math.random()*4)+8).toString(16);
      else s+=r.toString(16);
    }
    outs.push(s);
  }
  $('uuidOut').textContent=outs.join('\n');$('uuidOut').classList.add('show');
}
function genRandom(){
  const mn=parseInt($('randMin').value),mx=parseInt($('randMax').value);
  const r=Math.floor(Math.random()*(mx-mn+1))+mn;
  $('randOut').textContent=r;$('randOut').classList.add('show');
}

/* ---------- 时间 ---------- */
function tickClock(){
  const d=new Date();
  const p=x=>String(x).padStart(2,'0');
  $('clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  const week=['日','一','二','三','四','五','六'][d.getDay()];
  $('clockDate').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${week}`;
  $('nowTs').textContent=Math.floor(d.getTime()/1000);
}
setInterval(tickClock,1000);tickClock();
function tsToDate(){
  const s=parseFloat($('tsIn').value),o=$('tsOut');
  if(isNaN(s)){o.textContent='请输入时间戳';o.classList.add('show');return;}
  const d=new Date(s*1000);
  o.textContent=`${d.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})} (本地/UTC+8)`;
  o.classList.add('show');
}

/* ---------- 其他 ---------- */
function hexToRgb(){
  let h=$('hexIn').value.trim().replace('#','');
  const o=$('hexOut');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h)){o.textContent='无效HEX, 格式 #rrggbb';o.classList.add('show');return;}
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  $('colorSwatch').style.background=`rgb(${r},${g},${b})`;
  o.textContent=`RGB(${r}, ${g}, ${b}) · 十六进制 #${h.toUpperCase()}`;o.classList.add('show');
}
function numConv(){
  const v=$('numIn').value,from=parseInt($('numFrom').value),o=$('numOut');
  const dec=parseInt(v,from);
  if(isNaN(dec)){o.textContent='无效数字';o.classList.add('show');return;}
  const names=['十进制','二进制','八进制','十六进制'];
  const b2=dec.toString(2),b8=dec.toString(8),b16=dec.toString(16).toUpperCase();
  o.innerHTML=`<b>十进制</b>: ${dec}<br><b>二进制</b>: ${b2}<br><b>八进制</b>: ${b8}<br><b>十六进制</b>: 0x${b16}`;
  o.classList.add('show');
}
