<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#ffe4ef">
<meta property="og:title" content="合成猫猫：养出猫猫大王">
<meta property="og:description" content="两只一样的喵合成更大的喵！粉色糖果猫咪合成消除，单文件双击即玩">
<title>合成猫猫 · 有花无实</title>
<style>
*{box-sizing:border-box;padding:0;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 30% 0%,#fff3f9 0%,#ffe1ef 45%,#ffd0e4 100%)}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:relative;margin:0 auto;top:50%;transform:translateY(-50%)}
#game-canvas{position:absolute;inset:0;overflow:hidden;border-radius:24px;box-shadow:0 18px 50px rgba(214,64,140,.30),0 0 0 6px rgba(255,255,255,.85),0 0 0 10px rgba(255,169,205,.45)}
#game-canvas canvas{border-radius:18px;display:block}
#warnline{position:absolute;left:4%;right:4%;top:10%;border-top:3px dashed rgba(224,31,110,.30);z-index:2;pointer-events:none}
#warnline::after{content:'🐾';position:absolute;right:-8px;top:-12px;font-size:14px;opacity:.55}
#guide{position:absolute;top:10%;bottom:5.5%;left:50%;width:0;border-left:2px dashed rgba(224,31,110,.28);z-index:2;pointer-events:none;display:none}
#ui{position:absolute;top:0;left:0;transform-origin:top left;z-index:3;pointer-events:none}
.card{background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;box-shadow:0 6px 18px rgba(214,64,140,.18),inset 0 0 0 2px rgba(255,255,255,.9)}
#nextcard{position:absolute;top:14px;left:14px;z-index:3;display:flex;align-items:center;gap:10px;padding:9px 16px 9px 9px}
#next-img{width:52px;height:52px;border-radius:50%;box-shadow:0 3px 8px rgba(214,64,140,.3)}
#nextcard .meta{display:flex;flex-direction:column;gap:3px}
#nextcard .lbl{font-size:12px;color:#c0568e;font-weight:700;letter-spacing:2px}
#next-name{font-size:15px;color:#8e1c55;font-weight:800}
#scorecard{position:absolute;top:14px;right:14px;z-index:3;padding:10px 20px;text-align:right}
#score{font-size:34px;font-weight:900;color:#d81b77;line-height:1;font-variant-numeric:tabular-nums}
#highscore{font-size:13px;color:#c0568e;font-weight:700;margin-top:4px}
#toast{position:absolute;top:17%;left:50%;transform:translateX(-50%);z-index:4;background:rgba(255,255,255,.95);color:#c2185b;font-size:21px;font-weight:800;padding:11px 28px;border-radius:999px;box-shadow:0 8px 22px rgba(224,31,110,.3);opacity:0;white-space:nowrap}
#toast.show{animation:toastPop 1.7s ease forwards}
@keyframes toastPop{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}22%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-18px)}}
#evobar{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;justify-content:center;align-items:center;gap:4px;padding:8px 6px}
#evobar img{width:26px;height:26px;border-radius:50%;transition:.4s;filter:grayscale(1);opacity:.30}
#evobar img.got{filter:none;opacity:1}
#evobar .arrow{color:#e39abf;font-size:9px}
#btn-home{position:absolute;bottom:64px;right:12px;z-index:7;background:rgba(255,255,255,.8);backdrop-filter:blur(6px);color:#d81b77;font-size:13px;font-weight:700;text-decoration:none;padding:7px 15px;border-radius:999px;box-shadow:0 3px 10px rgba(214,64,140,.2)}
.overlay{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,228,242,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;text-align:center;padding:24px}
.logo{font-size:72px;filter:drop-shadow(0 8px 14px rgba(214,64,140,.4))}
h1{font-size:44px;color:#d81b77;letter-spacing:6px;margin-top:2px;text-shadow:0 2px 0 #fff,0 10px 24px rgba(216,27,119,.25)}
.sub{margin-top:10px;font-size:15px;color:#b0447c;letter-spacing:3px;font-weight:600}
.rule{margin:24px auto 30px;font-size:14px;color:#a3386b;line-height:2.1;background:rgba(255,255,255,.75);padding:14px 26px;border-radius:18px;box-shadow:0 4px 14px rgba(214,64,140,.12)}
.btn{display:inline-block;border:none;cursor:pointer;background:linear-gradient(135deg,#ff8fbe,#e01f6e);color:#fff;font-size:22px;font-weight:900;letter-spacing:4px;padding:17px 56px;border-radius:999px;box-shadow:0 10px 26px rgba(224,31,110,.45),inset 0 -4px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .15s;font-family:inherit}
.btn:active{transform:scale(.93)}
#overlay-end{display:none}
#end-title{font-size:38px;font-weight:900;color:#d81b77;margin-bottom:8px}
#end-score{font-size:16px;color:#a3386b;margin-bottom:28px;font-weight:600}
#king-fx{display:none;position:absolute;inset:0;z-index:8;align-items:center;justify-content:center;pointer-events:none;flex-direction:column}
#king-fx .txt{font-size:54px;font-weight:900;color:#ffd94a;text-shadow:0 3px 0 #e01f6e,0 12px 34px rgba(224,31,110,.55);animation:kingBounce 2.4s ease forwards}
#king-fx .sub2{font-size:18px;color:#c2185b;margin-top:10px;font-weight:700;animation:kingBounce 2.4s ease forwards}
@keyframes kingBounce{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-24px) scale(1.05)}}
</style>
</head>
<body>
<div id="stage">
  <div id="game-canvas"></div>
  <div id="warnline"></div>
  <div id="guide"></div>
  <div id="ui">
    <div class="card" id="nextcard">
      <img id="next-img" alt="下一只"><div class="meta"><span class="lbl">下一只</span><span id="next-name">猫猫</span></div>
    </div>
    <div class="card" id="scorecard">
      <div id="score">0</div>
      <div id="highscore">最高 0</div>
    </div>
    <div id="toast"></div>
    <div class="card" id="evobar"></div>
  </div>
  <a id="btn-home" href="/">‹ 回展馆</a>

  <div class="overlay" id="overlay-start">
    <div class="logo">🐱</div>
    <h1>合成猫猫</h1>
    <div class="sub">两只一样的喵 ➜ 更大的喵</div>
    <div class="rule">移动瞄准，松手放猫（手机拖动即可）<br>堆过虚线就输啦 · 终极目标：猫猫大王 ♛</div>
    <button class="btn" id="btn-start">开始养猫</button>
  </div>

  <div class="overlay" id="overlay-end">
    <div class="logo" style="font-size:56px">😿</div>
    <div id="end-title">猫咪堆满啦！</div>
    <div id="end-score"></div>
    <button class="btn" id="btn-retry">再养一只</button>
  </div>

  <div id="king-fx">
    <div class="txt">♛ 猫猫大王 ♛</div>
    <div class="sub2">你养出了传说中的大猫咪！</div>
  </div>
</div>

  var gameStatics = [
    Bodies.rectangle(-(wallPad / 2), H / 2, wallPad, H, wallProps),
    Bodies.rectangle(W + (wallPad / 2), H / 2, wallPad, H, wallProps),
    Bodies.rectangle(W / 2, H + (wallPad / 2) - statusBarH, W, wallPad, wallProps)
  ];

  var mouse = Mouse.create(render.canvas);
  var mc = MouseConstraint.create(engine, { mouse: mouse, constraint: { stiffness: 0.2, render: { visible: false } } });
  render.mouse = mouse;

  /* ---------- 就绪流程：贴图渲染完成后激活 ---------- */
  texturesReady.then(function () {
    var bar = $('evobar');
    for (var i = 0; i < 11; i++) {
      if (i > 0) { var ar = document.createElement('span'); ar.className = 'arrow'; ar.textContent = '▸'; bar.appendChild(ar); }
      var img = document.createElement('img');
      img.src = CAT_TEX[i]; img.alt = CAT_NAMES[i]; img.title = CAT_NAMES[i];
      bar.appendChild(img);
    }
    $('next-img').src = CAT_TEX[0];
    Game.loadHigh();
  });

  Render.run(render);
  Runner.run(runner, engine);

  $('btn-start').addEventListener('click', function () { sfx.meow(); Game.start(); });
  $('btn-retry').addEventListener('click', function () { location.reload(); });
  $('btn-home').addEventListener('click', function (ev) {
    ev.preventDefault();
    if (document.referrer && document.referrer.indexOf(location.hostname) > -1) history.back();
    else location.href = '/';
  });

  /* ---------- 自适应缩放 ---------- */
  var resize = function () {
    var sw = document.body.clientWidth, sh = document.body.clientHeight;
    var nw = W, nh = H, sc = 1;
    if (sw * 1.5 > sh) { nh = Math.min(H, sh); nw = nh / 1.5; sc = nh / H; }
    else { nw = Math.min(W, sw); nh = nw * 1.5; sc = nw / W; }
    var st = $('stage');
    st.style.width = nw + 'px'; st.style.height = nh + 'px';
    render.canvas.style.width = nw + 'px';
    render.canvas.style.height = nh + 'px';
    var ui = $('ui');
    ui.style.width = W + 'px'; ui.style.height = H + 'px';
    ui.style.transform = 'scale(' + sc + ')';
  };
  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
