": "计划妥当", "new": "计划通", "key": "WELL_LAID_PLANS_POWER.title"}, {"old": "翱翔之跃", "new": "信仰之跃", "key": "WINGED_JUMP_POWER.title"}, {"old": "凋萎存在", "new": "衰神", "key": "WITHERING_PRESENCE_POWER.title"}, {"old": "幽魂形态", "new": "幽灵公主", "key": "WRAITH_FORM_POWER.title"}]}, {"table": "ancients", "name": "先古对白", "rows": [{"old": "囤积者", "new": "囤积狂", "key": "DARV.epithet"}, {"old": "达弗", "new": "达哥", "key": "DARV.title"}, {"old": "来来，这里有些被遗忘的宝石，拿一块去吧！", "new": "来来，这儿有些压箱底的宝贝，随便挑一个走！", "key": "DARV.talk.ANY.0-0r.ancient"}, {"old": "今天我还挺忙的！\n那堆东西里有啥想要的你就自己拿了吧！！", "new": "今天正忙着直播带货呢！\n那堆破烂里有想要的自己拿！！", "key": "DARV.talk.ANY.1-0r.ancient"}, {"old": "你这块大型垃圾还真是挺好看的，你知道吧？", "new": "你这块大型垃圾居然还挺好看，你知道吧？", "key": "DARV.talk.DEFECT.0-0.ancient"}, {"old": "回应", "new": "回一句", "key": "DARV.talk.DEFECT.0-0.next"}, {"old": "<3", "new": "<开心得直冒泡>", "key": "DARV.talk.DEFECT.0-1.char"}, {"old": "还在努力吶，我明白了……来看看能不能给你升个级呗！", "new": "还在肝呢，我懂了……来看看能不能给你升个级！", "key": "DARV.talk.DEFECT.1-0r.ancient"}, {"old": "我其实一直留着你那位朋友的，呃……唔。\n当我没说，当我没说！！", "new": "其实我一直替你留着那位朋友的，呃……唔。\n就当我放屁，就当我放屁！！", "key": "DARV.talk.DEFECT.2-0.ancient"}, {"old": "提问", "new": "追问", "key": "DARV.talk.DEFECT.2-0.next"}, {"old": "我勇敢的小家伙，忘了我刚才说的话吧！", "new": "我勇敢的小家伙，快忘了刚才那句！", "key": "DARV.talk.DEFECT.2-2.ancient"}, {"old": "啊，冒火的战士回来啦！\n我这儿有东西正适合你！", "new": "哟，冒火的战士回来了！\n我这儿有好货正适合你！", "key": "DARV.talk.IRONCLAD.0-0.ancient"}, {"old": "看到你还活着四处砸人脑壳，感觉真不错啊！", "new": "看你还活着，四处砸人脑壳，真好啊！", "key": "DARV.talk.IRONCLAD.1-0r.ancient"}, {"old": "我还留着你的那把重刃呢……但没能找到可以修好它的人。", "new": "我还留着你的那把重刃呢……可惜没人修得好它。", "key": "DARV.talk.IRONCLAD.2-0.ancient"}, {"old": "铁甲战士盯着达弗。", "new": "红裤衩盯着达哥看。", "key": "DARV.talk.IRONCLAD.2-1.char"}, {"old": "或许建筑师知道些什么呢。", "new": "说不定包工头知道点啥呢。", "key": "DARV.talk.IRONCLAD.2-2.ancient"}, {"old": "看得出来你比较严肃，能为你做点什么吗女士？", "new": "看得出你挺严肃的，能为你做点啥吗，女士？", "key": "DARV.talk.NECROBINDER.0-0.ancient"}, {"old": "任何能帮我杀死一个最可恶的人的东西。", "new": "任何能帮我弄死一个混蛋的东西。", "key": "DARV.talk.NECROBINDER.0-1.char"}, {"old": "这样啊……那你看看吧！", "new": "这样啊……那你随便看吧！", "key": "DARV.talk.NECROBINDER.0-2.ancient"}, {"old": "还在征战不休吶？我不拦着你哈！", "new": "还在打打杀杀呢？我不拦你哈！", "key": "DARV.talk.NECROBINDER.1-0r.ancient"}, {"old": "这本书看起来和你联系很紧密嘛，它可比你存在的时间长多了。", "new": "这本书跟你联系挺紧嘛，它比你岁数大多了。", "key": "DARV.talk.NECROBINDER.2-0.ancient"}, {"old": "指控", "new": "质问", "key": "DARV.talk.NECROBINDER.2-0.next"}, {"old": "你是怎么拿到它的？", "new": "你从哪弄来的？", "key": "DARV.talk.NECROBINDER.2-1.char"}, {"old": "可怕的东西总会兜兜转转来到我的收藏中。", "new": "诡异的东西总会兜兜转转到我收藏里。", "key": "DARV.talk.NECROBINDER.2-2.ancient"}, {"old": "你这样的人怎么会来这儿呀？想不想来看看我的收藏呀？", "new": "你这样的人怎么跑这儿来了？想不想看看我的收藏？", "key": "DARV.talk.REGENT.0-0.ancient"}, {"old": "我确实喜欢赏鉴高品质的东西……", "new": "我确实喜欢鉴赏高品质的东西……", "key": "DARV.talk.REGENT.0-1.char"}, {"old": "又来看更多吗，殿下？！", "new": "又来进货啦，殿下？！", "key": "DARV.talk.REGENT.1-0r.ancient"}, {"old": "我的新朋友，我可有好东西给你呀！", "new": "我的新朋友，我可有好东西给你！", "key": "DARV.talk.REGENT.2-0.ancient"}, {"old": "我在听！", "new": "你说，我听着呢！", "key": "DARV.talk.REGENT.2-1.char"}, {"old": "我很想给你，但东西已经被建筑师抢走了！！\n那你帮我这个好伙计一个忙呗！怎么样？", "new": "我超想给你的，可东西被包工头抢走了！！\n那你帮我这好哥们一个忙呗？咋样？", "key": "DARV.talk.REGENT.2-2.ancient"}, {"old": "你也回高塔里来啦，嗯？\n还是抵抗不住亮闪闪的东西的诱惑，是吧？！", "new": "你也爬回来啦？\n还是扛不住闪亮玩意儿的诱惑，对吧？！", "key": "DARV.talk.SILENT.0-0.ancient"}, {"old": "你的那个战利品，我有好东西和你交换！", "new": "你那件战利品，我有好东西跟你换！", "key": "DARV.talk.SILENT.1-0r.ancient"}, {"old": "可惜你不记得我过去的慷慨！\n是啦是啦，你也知道涅奥就是这样……", "new": "可惜你不记得我当年的阔绰！\n行行行，你也知道涅奥就这德性……", "key": "DARV.talk.SILENT.2-0.ancient"}, {"old": "好吧！那我们就给你整点儿适合最终决战之类的装备吧！", "new": "那成！给你整点适合最终决战的神装吧！", "key": "DARV.talk.SILENT.2-2.ancient"}, {"old": "……我把那东西放哪儿了……喔！\n来看我的收藏的吗！？那边那堆里随便挑一个吧，得好好用上哦！", "new": "……我把那玩意儿放哪了……喔！\n来看收藏的？！那边那堆随便挑一个，好好用啊！", "key": "DARV.talk.firstVisitEver.0-0.ancient"}, {"old": "复生之母（被放逐）", "new": "被流放的复活点", "key": "NEOW.epithet"}, {"old": "涅奥", "new": "钮钴禄", "key": "NEOW.title"}, {"old": "...再次... ..问好.....", "new": "...又... ..见面了.....", "key": "NEOW.talk.ANY.0-0r.ancient"}, {"old": "...醒来...\n..醒来....", "new": "...醒醒...\n..醒醒....", "key": "NEOW.talk.ANY.1-0r.ancient"}, {"old": "..我把你... ..带回... ..来了...", "new": "..我把你... ..带回来... ..了...", "key": "NEOW.talk.ANY.3-0r.ancient"}, {"old": "...杀.. 死... [jitter]建筑师[/jitter]", "new": "...弄.. 死... [jitter]包工头[/jitter]", "key": "NEOW.talk.ANY.4-0r.ancient"}, {"old": "...构装体.. 你...\n....变成.. 什么了...？", "new": "...机宝.. 你...\n....变成.. 啥了...？", "key": "NEOW.talk.DEFECT.0-0.ancient"}, {"old": "...他.. 可以...\n....修好.. 你.. ...和一切....", "new": "...他.. 能...\n....修好.. 你.. ...和一切....", "key": "NEOW.talk.DEFECT.1-0r.ancient"}, {"old": "...我.. 不能... ..让...\n...你.. 忘记....", "new": "...我.. 不能... ..让...\n...你.. 忘了....", "key": "NEOW.talk.DEFECT.2-0.ancient"}, {"old": "..起来吧.. 我的.. 战士...\n..是时候... 继续...战斗了...", "new": "..起来吧.. 我的.. 战士...\n..该... 继续...干架了...", "key": "NEOW.talk.IRONCLAD.0-0.ancient"}, {"old": "..依旧.. 深陷.. 狂怒么.. 很好...", "new": "..还是.. 这么.. 易怒么.. 很好...", "key": "NEOW.talk.IRONCLAD.1-0r.ancient"}, {"old": "..记起.. 你.. 第一..次\n...来到 ..我面前...的时候..", "new": "..还记得.. 你.. 头一..回\n...站到 ..我面前...的样子么..", "key": "NEOW.talk.IRONCLAD.2-0.ancient"}, {"old": "...那么..有用...", "new": "...那么..好用...", "key": "NEOW.talk.IRONCLAD.2-2.ancient"}, {"old": "...我们的.... 目标... ..是... ..一样的....", "new": "...我们的.... 目标... ..是一样..的....", "key": "NEOW.talk.NECROBINDER.0-0.ancient"}, {"old": "[jitter]他杀死了我爱的一切！！[/jitter]", "new": "[jitter]他杀了我爱的一切！！[/jitter]", "key": "NEOW.talk.NECROBINDER.0-1.char"}, {"old": "...我的力量..... 是你的了...", "new": "...我的力量..... 归你了...", "key": "NEOW.talk.NECROBINDER.0-2.ancient"}, {"old": "他... 依旧.. ....生存...", "new": "他... 还.. ....活着...", "key": "NEOW.talk.NECROBINDER.1-0r.ancient"}, {"old": "那... 真的.. ...可能... 吗...？", "new": "那... 真.. ...可能... 吗...？", "key": "NEOW.talk.NECROBINDER.2-0.char"}, {"old": "... 建筑师.... ..逐渐虚弱....\n..我们.... 变强...", "new": "... 包工头.... ..越来越虚....\n..我们.... 越来越强...", "key": "NEOW.talk.NECROBINDER.2-1.ancient"}, {"old": "巨大蓝色生物，我可是未来的王！", "new": "蓝胖子，我可是未来的王！", "key": "NEOW.talk.REGENT.0-0.char"}, {"old": "..可爱...\n...你... 会再次.. ..见到... ...我的....", "new": "..可爱...\n...你... 会再.. ..见到... ...我的....", "key": "NEOW.talk.REGENT.0-1.ancient"}, {"old": "...又一次..？", "new": "...又来了..？", "key": "NEOW.talk.REGENT.1-0r.ancient"}, {"old": "[jitter]为什么我赢不了？！[/jitter]", "new": "[jitter]为什么我总赢不了？！[/jitter]", "key": "NEOW.talk.REGENT.2-0.char"}, {"old": "...收下.. 这份... ..赐福...", "new": "...收下.. 这份... ..祝福...", "key": "NEOW.talk.REGENT.2-1.ancient"}, {"old": "……好的，谢谢你，涅奥。", "new": "……好吧，谢谢你，涅奥。", "key": "NEOW.talk.REGENT.2-2.char"}, {"old": "...从.. 外面... 回来了么？\n..我知道... 你会... 回来...", "new": "...从.. 外面... 回来了么？\n..我就知道... 你会... 回来...", "key": "NEOW.talk.SILENT.0-0.ancient"}, {"old": "...你的..\n ...猎物.. 在等待...", "new": "...你的..\n ...猎物.. 在等你...", "key": "NEOW.talk.SILENT.1-0r.ancient"}, {"old": "..两个...都知道..家族..的..痛苦...", "new": "..两个...都懂..家族..的..痛...", "key": "NEOW.talk.SILENT.2-0.ancient"}, {"old": "..还在...寻找..认同...？\n...[jitter]愚蠢[/jitter]...", "new": "..还在...找认同感...？\n...[jitter]傻孩子[/jitter]...", "key": "NEOW.talk.SILENT.2-2.ancient"}, {"old": "我又... 重铸了你....\n...上... ..去吧.....", "new": "我又... 把你拼起来了....\n...上... ..去吧.....", "key": "NEOW.talk.firstVisitEver.0-0.ancient"}, {"old": "机缘的化身", "new": "概率之神", "key": "NONUPEIPE.epithet"}, {"old": "诺奴佩普", "new": "笑不活了", "key": "NONUPEIPE.title"}, {"old": "塔顶有疯狂在等待。穿上我的力量，消灭一切吧。", "new": "塔顶有疯子在等你。穿上我的力量，去把一切摆平吧。", "key": "NONUPEIPE.talk.ANY.0-0r.ancient"}, {"old": "来到我这里，你走了很远吧！\n过来吧，接受我的赐福。", "new": "你能爬到我这儿，走了不少路吧！\n过来，接受我的赐福。", "key": "NONUPEIPE.talk.ANY.1-0r.ancient"}, {"old": "构装体也能够配得上我的赐福么？\n过来吧，故障机器人。在所有自动机械里，你将成为最美。", "new": "机宝也配得上我的赐福吗？\n过来吧，在所有铁疙瘩里，你会是最靓的仔。", "key": "NONUPEIPE.talk.DEFECT.0-0.ancient"}, {"old": "可怜的机器呀，如此残破不堪，来让我将你好好改善吧。", "new": "可怜的机器呀，破烂成这样，来让我好好拾掇拾掇你。", "key": "NONUPEIPE.talk.DEFECT.1-0r.ancient"}, {"old": "我通常不会喜欢建筑师的造物，但我承认，你让我有点喜欢上了。", "new": "我平时看不上包工头的造物，但我承认，你让我有点喜欢了。", "key": "NONUPEIPE.talk.DEFECT.2-0.ancient"}, {"old": "<羞赧的鸣叫>", "new": "<不好意思地滴了一声>", "key": "NONUPEIPE.talk.DEFECT.2-1.char"}, {"old": "啊，铁甲战士，终于来到了我的面前。\n过来吧，我会赐予你我的力量。", "new": "啊，红裤衩，你终于来了。\n过来，我把力量赐给你。", "key": "NONUPEIPE.talk.IRONCLAD.0-0.ancient"}, {"old": "铁甲战士，铁甲战士……是我之前的赠礼还不够么？", "new": "红裤衩，红裤衩……是上次给的礼物还不够吗？", "key": "NONUPEIPE.talk.IRONCLAD.1-0r.ancient"}, {"old": "你又回来了么，我的勇士？这是多少次了？\n过去的你，不是强大到可以消灭整个族群么？", "new": "你又回来了？这是第几回了？\n当年的你不是强到能灭掉一整个族群吗？", "key": "NONUPEIPE.talk.IRONCLAD.2-0.ancient"}, {"old": "你的护卫已经死了。传闻说，你会赐福给想要杀死建筑师的人。", "new": "你护卫已经没了。听说你会赐福给想弄死包工头的人。", "key": "NONUPEIPE.talk.NECROBINDER.0-0.char"}, {"old": "我喜欢有能力的人，所以我会把自己的力量分给你一部分。\n下一次，可别再杀我的护卫了。", "new": "我喜欢有本事的人，所以分你一点力量。\n下次别再杀我护卫了。", "key": "NONUPEIPE.talk.NECROBINDER.0-1.ancient"}, {"old": "法师若要战斗，自然需要上好的衣装和饰物。过来吧，亡灵契约师。", "new": "法师要打架，自然得配好行头。过来吧，骨妹。", "key": "NONUPEIPE.talk.NECROBINDER.1-0r.ancient"}, {"old": "建筑师见到你的宠物，一定不会高兴的。", "new": "包工头见到你的宠物，肯定高兴不起来。", "key": "NONUPEIPE.talk.NECROBINDER.2-0.ancient"}, {"old": "你是指奥斯提么？我会让他来完成最后一击的。", "new": "你说小骨么？最后一击我会让他来。", "key": "NONUPEIPE.talk.NECROBINDER.2-1.char"}, {"old": "你从遥远的地方带来了这么华美的袍子么！\n来，让你的仆从们把你带过来一点，我会给你赐福的。", "new": "你这身华服是从多远的地方带来的呀！\n来，让你的仆从把你抬近点，我给你赐福。", "key": "NONUPEIPE.talk.REGENT.0-1.ancient"}, {"old": "王室的访客，该有王室的赐福。\n仆人们！为我们倒点茶来。", "new": "王室的客人，就该有王室的赐福。\n仆人们！上茶。", "key": "NONUPEIPE.talk.REGENT.1-0r.ancient"}, {"old": "建筑师发了疯！只有一位高贵的勇士能拯救我们于此危难了……", "new": "包工头疯了！只有一位高贵勇士能救我们于水火……", "key": "NONUPEIPE.talk.REGENT.2-0.ancient"}, {"old": "无需担心！我，储君，将会终止这场疯狂！\n但是首先，喝茶！", "new": "无需担心！我，太子，必将终结这场疯狂！\n但是先喝茶！", "key": "NONUPEIPE.talk.REGENT.2-1.char"}, {"old": "一个小小的窃贼溜进了我的领域么？\n别以为我看不见你啊？出来吧！", "new": "一个小毛贼溜进我地盘了？\n别以为我看不见你啊？出来！", "key": "NONUPEIPE.talk.SILENT.0-0.ancient"}, {"old": "静默猎手从阴影中走了出来……", "new": "猎宝从阴影里走了出来……", "key": "NONUPEIPE.talk.SILENT.0-1.char"}, {"old": "猎手啊，是什么让你回到了高塔？\n过来吧，穿戴上这些赐福。", "new": "猎宝啊，是啥让你回到塔里？\n过来，把这赐福穿上。", "key": "NONUPEIPE.talk.SILENT.0-2.ancient"}, {"old": "我为你准备了礼物，刺客，不用害羞。", "new": "我给你备了礼物，刺客，别害羞。", "key": "NONUPEIPE.talk.SILENT.1-0r.ancient"}, {"old": "在她的傀儡之中，属你最让我吃惊。", "new": "在她的傀儡们里，属你最让我意外。", "key": "NONUPEIPE.talk.SILENT.2-0.ancient"}, {"old": "是什么夺走了你的第一次生命？是涅奥找到你的么？\n真可惜啊，你不说话。", "new": "是谁夺走了你的第一次生命？是涅奥捡到你的吗？\n真可惜，你不说话。", "key": "NONUPEIPE.talk.SILENT.2-2.ancient"}, {"old": "我有几千年都没有接待过访客了！\n哎呀，你的穿搭看起来有些乏味呢，来，我们给你挑些漂亮的穿吧。", "new": "我几千年没接过客了！\n哎呀，你这身穿搭有点素啊，来，我们给你挑点好看的。", "key": "NONUPEIPE.talk.firstVisitEver.0-0.ancient"}, {"old": "活体虹光", "new": "活体极光", "key": "OROBAS.epithet"}, {"old": "欧洛巴斯", "new": "欧拉欧拉", "key": "OROBAS.title"}, {"old": "锁定", "new": "焊死", "key": "OROBAS.pages.INITIAL.options.OPTION_POOL_3_LOCKED.title"}, {"old": "找到了很好的东西！！你看，你看！", "new": "捡到宝了！！你看，你看！", "key": "OROBAS.talk.ANY.1-0r.ancient"}, {"old": "什么！构装体仆人？！居然还在运作！！\n为什么在这里？？为什么不在工厂？？", "new": "什么！机宝仆人？！居然还在跑！！\n为啥在这？？为啥不在厂里？？", "key": "OROBAS.talk.DEFECT.0-0.ancient"}, {"old": "闪亮的充能球！怎么运作的？\n[jitter]啊呀！！[/jitter]", "new": "闪亮的球球！咋转的？\n[jitter]哎哟！！[/jitter]", "key": "OROBAS.talk.DEFECT.1-0r.ancient"}, {"old": "核心损坏？涅奥驱使着坏了的构装体？\n是利用？", "new": "核心坏了？涅奥开着坏机器？\n是薅羊毛？", "key": "OROBAS.talk.DEFECT.2-0.ancient"}, {"old": "<安静的嘀嘀声>", "new": "<安静地滴了一声>", "key": "OROBAS.talk.DEFECT.2-1.char"}, {"old": "建筑师能修你？", "new": "包工头能修你？", "key": "OROBAS.talk.DEFECT.2-2.ancient"}, {"old": "一个铁甲战士！？怎么可能？？可怕，真可怕！！", "new": "一个红裤衩！？怎么可能？？可怕，太可怕了！！", "key": "OROBAS.talk.IRONCLAD.0-0.ancient"}, {"old": "签下契约？为什么！？糟糕选择？对，大错误！", "new": "签了契约？为啥！？选错了？对，错得离谱！", "key": "OROBAS.talk.IRONCLAD.1-0r.ancient"}, {"old": "祝愿你自己！！拼命祝愿！\n瓦库坏，非常坏！建筑师能解放你？", "new": "祝你好运！！拼命祈祷！\n瓦库坏，特别坏！包工头能放你走？", "key": "OROBAS.talk.IRONCLAD.2-0.ancient"}, {"old": "死了？！没死！为何当傀儡？好大的手！！", "new": "死了？！没死！为啥当傀儡？手好大！！", "key": "OROBAS.talk.NECROBINDER.0-0.ancient"}, {"old": "不死者！有好礼物给你！！暴力不好。", "new": "不死人！有好礼物给你！！暴力不好。", "key": "OROBAS.talk.NECROBINDER.1-0r.ancient"}, {"old": "不要暴力！拿点亮闪闪的吧……亮闪闪！！", "new": "别暴力！拿点闪亮亮的吧……闪亮亮！！", "key": "OROBAS.talk.NECROBINDER.2-0.ancient"}, {"old": "只有当建筑师不复存在，我的使命才会结束。\n暴力不可避免。", "new": "只有包工头没了，我的使命才算完。\n暴力躲不掉。", "key": "OROBAS.talk.NECROBINDER.2-1.char"}, {"old": "建筑师不坏！或许聊聊？聊聊很好！！非常好！", "new": "包工头不坏！要不聊聊？聊聊好！！特别好！", "key": "OROBAS.talk.NECROBINDER.2-2.ancient"}, {"old": "旅行者！太空来的！？太空哪里？\n怎么从太空来？脑袋尖尖！还有小小伙伴！！", "new": "旅行者！从太空来的！？太空哪旮旯？\n咋从太空来？脑袋尖尖！还有小伙伴！！", "key": "OROBAS.talk.REGENT.0-0.ancient"}, {"old": "畅谈", "new": "畅聊", "key": "OROBAS.talk.REGENT.0-0.next"}, {"old": "储君独自说了几个小时。", "new": "太子一个人讲了几个小时。", "key": "OROBAS.talk.REGENT.0-1.char"}, {"old": "真有趣！真厉害！！再说说！再说说！！！", "new": "真有趣！真厉害！！再讲讲！再讲讲！！！", "key": "OROBAS.talk.REGENT.0-2.ancient"}, {"old": "更多故事！给你找了这些东西！\n所以快来说更多故事！！", "new": "更多故事！给你找了这些！\n所以快来讲更多故事！！", "key": "OROBAS.talk.REGENT.1-0r.ancient"}, {"old": "我的头号粉丝！欧洛巴斯，好朋友！\n看到你还活着真是不错！", "new": "我的头号粉丝！欧洛巴斯，好兄弟！\n看你还活着真不错！", "key": "OROBAS.talk.REGENT.2-0.char"}, {"old": "当然当然……不过你有给我找到更多饰品么？", "new": "当然当然……不过你给我找到更多饰品了么？", "key": "OROBAS.talk.REGENT.2-2.char"}, {"old": "感染……？[jitter]荒疫！？[/jitter]拿了东西就走吧！！", "new": "感染……？[jitter]疫病！？[/jitter]拿完东西赶紧走！！", "key": "OROBAS.talk.SILENT.0-0.ancient"}, {"old": "不传染？很快要死？建筑师能帮你？", "new": "不传染？快死了？包工头能帮你？", "key": "OROBAS.talk.SILENT.1-0r.ancient"}, {"old": "姐妹们在哪里？吓人又很凶的姐妹们！\n做个好人！别像姐妹们那样！！", "new": "姐妹们在哪？又吓人又凶的姐妹们！\n做个好人！别学姐妹们！！", "key": "OROBAS.talk.SILENT.2-0.ancient"}, {"old": "傀儡傀儡！！一路来到这里？！收下这些，拿去拿去！", "new": "傀儡傀儡！！一路爬过来了？！收下这些，拿去拿去！", "key": "OROBAS.talk.firstVisitEver.0-0.ancient"}, {"old": "融化巨龙", "new": "融化怪龙", "key": "PAEL.epithet"}, {"old": "佩尔", "new": "怕了怕了", "key": "PAEL.title"}, {"old": "欢迎回来，朋友。让我的血肉帮助你吧……", "new": "欢迎回来，朋友。让我的血肉帮帮你吧……", "key": "PAEL.talk.ANY.0-0r.ancient"}, {"old": "佩尔正在沉睡，它的鼾声让整个房间不停震动着。", "new": "佩尔在打呼噜，鼾声震得整间屋子都在抖。", "key": "PAEL.talk.ANY.1-0r.ancient"}, {"old": "困扰的自动机械，在找你的朋友吗？\n让我来帮忙……", "new": "发愁的机宝，在找你的朋友吗？\n让我来帮……", "key": "PAEL.talk.DEFECT.0-0.ancient"}, {"old": "构装体会做梦吗？\n看着我，模仿我……", "new": "机器会做梦吗？\n看着我，学我……", "key": "PAEL.talk.DEFECT.1-0r.ancient"}, {"old": "我梦见了你的朋友……\n父亲可以将缺陷复原……", "new": "我梦见你那位朋友了……\n爸爸能把缺陷复原……", "key": "PAEL.talk.DEFECT.2-0.ancient"}, {"old": "你心中有着如此多的愤怒。学习我吧，找到一些平静……", "new": "你心里火气太大了。学学我，找点清净……", "key": "PAEL.talk.IRONCLAD.0-0.ancient"}, {"old": "你还记得做梦的感觉吗？\n睡觉是件好事……", "new": "你还记得做梦是什么感觉吗？\n睡觉是好事……", "key": "PAEL.talk.IRONCLAD.1-0r.ancient"}, {"old": "你必须平息你的火焰。\n父亲可以让你获得自由……", "new": "你得把那团火压下去。\n爸爸能让你解脱……", "key": "PAEL.talk.IRONCLAD.2-0.ancient"}, {"old": "有如此的恶意涂满了你的心。", "new": "这么多恨意涂满了你的心。", "key": "PAEL.talk.NECROBINDER.0-0.ancient"}, {"old": "如果你知道我的遭遇，你的心也会被涂成相同的颜色。", "new": "你要是知道我的遭遇，心也会被涂成一样的颜色。", "key": "PAEL.talk.NECROBINDER.0-1.char"}, {"old": "你的道路上没有安宁。\n拿走我的一部分吧，让它减轻你的重负……", "new": "你这条路没有安宁。\n拿走我身上一块，让它替你减减负……", "key": "PAEL.talk.NECROBINDER.0-2.ancient"}, {"old": "带着手的人回来了。\n痛苦的回忆。拿走我的力量然后离开吧……", "new": "带手的那位回来了。\n痛苦的回忆。拿上我的力量就走吧……", "key": "PAEL.talk.NECROBINDER.1-0r.ancient"}, {"old": "杀死父亲不会带来安宁。", "new": "杀掉爸爸换不来安宁。", "key": "PAEL.talk.NECROBINDER.2-0.ancient"}, {"old": "你说那个[jitter]东西[/jitter]是你的父亲！？", "new": "你说那[jitter]玩意[/jitter]是你爸！？", "key": "PAEL.talk.NECROBINDER.2-1.char"}, {"old": "我们无法选择自己的家人……", "new": "家人这东西，由不得你选……", "key": "PAEL.talk.NECROBINDER.2-2.ancient"}, {"old": "你好！我是储君。\n你好？？[jitter]你好！？[/jitter]", "new": "你好！我是太子。\n你好？？[jitter]你好！？[/jitter]", "key": "PAEL.talk.REGENT.0-0.char"}, {"old": "安静点吧。\n拿走我的一部分，然后上路吧……", "new": "消停会儿吧。\n拿上我一块肉，然后上路……", "key": "PAEL.talk.REGENT.0-1.ancient"}, {"old": "我回来了！啊，你当然在睡觉。\n让我看看这里……", "new": "我回来了！啊，你果然在睡。\n让我瞅瞅这儿……", "key": "PAEL.talk.REGENT.1-0r.char"}, {"old": "你为什么要把自己的肉体送给别人？", "new": "你为什么把自己肉往外送？", "key": "PAEL.talk.REGENT.2-0.char"}, {"old": "既然我有大量的血肉，为什么不送呢？", "new": "既然我肉多得是，为啥不送呢？", "key": "PAEL.talk.REGENT.2-1.ancient"}, {"old": "当你再次归来时，我也会焕然一新。\n那就是睡眠的作用……", "new": "等你再回来，我也会焕然一新。\n这就是睡觉的意义……", "key": "PAEL.talk.REGENT.2-2.ancient"}, {"old": "杀戮的生物，这里不需要暴力。\n拿走我的一部分，寻找安宁吧……", "new": "杀戮的生物，这儿不需要暴力。\n拿走我一块，去找你的安宁……", "key": "PAEL.talk.SILENT.0-0.ancient"}, {"old": "猎取战利品？当然，拿走我的一部分吧……\n只有你安心就好……", "new": "来搜刮战利品？行，拿我一块走……\n你安心就好……", "key": "PAEL.talk.SILENT.1-0r.ancient"}, {"old": "你给我下了毒……？\n那能有什么作用呢……？zZZzz……", "new": "你给我下毒了……？\n那能有啥用呢……？zZZzz……", "key": "PAEL.talk.SILENT.2-0.ancient"}, {"old": "有傀儡来了？\n能帮我去看看父亲的状况么？我太累了……", "new": "来傀儡了？\n帮我去看看爸爸咋样了行不？我太累了……", "key": "PAEL.talk.firstVisitEver.0-0.ancient"}, {"old": "嵌合兽之王", "new": "缝合兽之王", "key": "TANX.epithet"}, {"old": "坦克斯", "new": "躺平", "key": "TANX.title"}, {"old": "快点变强，让我们好好战斗一番！！！", "new": "快点变强，来跟我痛快打一架！！！", "key": "TANX.talk.ANY.0-0r.ancient"}, {"old": "构装体！没有武器么！？收下这个！", "new": "机宝！没武器吗！？收下这个！", "key": "TANX.talk.DEFECT.0-0.ancient"}, {"old": "几个球球，算什么武器！", "new": "几个破球，算啥武器！", "key": "TANX.talk.DEFECT.1-0r.ancient"}, {"old": "故障机器人，与我一战！！", "new": "机宝，来跟我打！！", "key": "TANX.talk.DEFECT.2-0.ancient"}, {"old": "故障机器人英勇地战斗了。", "new": "机宝英勇地打了一架。", "key": "TANX.talk.DEFECT.2-1.char"}, {"old": "球球[jitter]真是[/jitter]武器！？", "new": "球球[jitter]真的[/jitter]是武器！？", "key": "TANX.talk.DEFECT.2-2.ancient"}, {"old": "好厉害的剑，战士！你该用上更多武器！", "new": "好猛的剑，战士！你该多用几件武器！", "key": "TANX.talk.IRONCLAD.0-0.ancient"}, {"old": "战士该有武器！拿上一把！我们来战斗吧！", "new": "战士就该有武器！拿一把！来打一场！", "key": "TANX.talk.IRONCLAD.1-0r.ancient"}, {"old": "铁甲战士，与我一战！！", "new": "红裤衩，来跟我打！！", "key": "TANX.talk.IRONCLAD.2-0.ancient"}, {"old": "铁甲战士与坦克斯战斗了。", "new": "红裤衩跟坦克斯打了一场。", "key": "TANX.talk.IRONCLAD.2-1.char"}, {"old": "好哇！！豪迈的一战，收下武器！", "new": "好哇！！豪迈一战，收下武器！", "key": "TANX.talk.IRONCLAD.2-2.ancient"}, {"old": "多么强大的巨镰！", "new": "好霸气的大镰刀！", "key": "TANX.talk.NECROBINDER.0-0.ancient"}, {"old": "是的，它是为复仇而特别打造的。", "new": "是的，它是为复仇专门打的。", "key": "TANX.talk.NECROBINDER.0-1.char"}, {"old": "那只手，是否需要武器！？", "new": "那只手，要不要武器！？", "key": "TANX.talk.NECROBINDER.0-2.ancient"}, {"old": "奥斯提，与我一战！！", "new": "小骨，来跟我打！！", "key": "TANX.talk.NECROBINDER.1-0r.ancient"}, {"old": "亡灵契约师，与我一战！！", "new": "骨妹，来跟我打！！", "key": "TANX.talk.NECROBINDER.2-0.ancient"}, {"old": "亡灵契约师与奥斯提和坦克斯战作一团。", "new": "骨妹带着小骨跟坦克斯打成一团。", "key": "TANX.talk.NECROBINDER.2-1.char"}, {"old": "了不起的团队合作！！收下一把武器吧！", "new": "团队配合太强了！！收下一把武器！", "key": "TANX.talk.NECROBINDER.2-2.ancient"}, {"old": "橙色！？这个存在为何会是橙色！？？", "new": "橙色！？这家伙为啥是橙色的！？？", "key": "TANX.talk.REGENT.0-0.ancient"}, {"old": "众所周知，橙色是最符合帝王的颜色！", "new": "众所周知，橙色最配帝王！", "key": "TANX.talk.REGENT.0-1.char"}, {"old": "了不起！真是强大！！", "new": "了不起！真是强！！", "key": "TANX.talk.REGENT.0-2.ancient"}, {"old": "橙色的！！选一把强大的武器吧！", "new": "橙色的那位！！挑把好武器吧！", "key": "TANX.talk.REGENT.1-0r.ancient"}, {"old": "储君，与我一战！！", "new": "太子，来跟我打！！", "key": "TANX.talk.REGENT.2-0.ancient"}, {"old": "不要！上次我来这里我们已经战斗过了！", "new": "不！上回我来这儿咱们已经打过了！", "key": "TANX.talk.REGENT.2-1.char"}, {"old": "再来与我战斗啊！", "new": "再来跟我打啊！", "key": "TANX.talk.REGENT.2-2.ancient"}, {"old": "一个猎手！我会把你细小的利爪磨得更利！！", "new": "一个猎手！我帮你把小爪子磨利点！！", "key": "TANX.talk.SILENT.0-0.ancient"}, {"old": "为何用匕首！！它不强大！", "new": "为啥用匕首！它不够劲！", "key": "TANX.talk.SILENT.1-0r.ancient"}, {"old": "静默猎手，与我一战！！", "new": "猎宝，来跟我打！！", "key": "TANX.talk.SILENT.2-0.ancient"}, {"old": "静默猎手逃离了战斗，沿途偷走了一把武器。", "new": "猎宝边打边跑，顺手偷走了一件武器。", "key": "TANX.talk.SILENT.2-1.char"}, {"old": "你去了哪里！！", "new": "你跑哪去了！！", "key": "TANX.talk.SILENT.2-2.ancient"}, {"old": "太弱小了！但是你很有潜力！\n用这把武器！！", "new": "太弱了！但你有潜力！\n拿上这把武器！！", "key": "TANX.talk.firstVisitEver.0-0.ancient"}, {"old": "饲火者", "new": "喂火大爷", "key": "TEZCATARA.epithet"}, {"old": "特兹卡塔拉", "new": "我命由我", "key": "TEZCATARA.title"}, {"old": "欢迎回来，小可爱。让我来[jitter]烧掉[/jitter]你的缺点。", "new": "欢迎回来，小可爱。让我来[jitter]烧掉[/jitter]你的毛病。", "key": "TEZCATARA.talk.ANY.0-0r.ancient"}, {"old": "进来吧，亲爱的！特兹卡塔拉今天能为你做些什么呢？", "new": "进来吧，亲爱的！特兹卡塔拉今天能为你做点啥呀？", "key": "TEZCATARA.talk.ANY.1-0r.ancient"}, {"old": "不是来这里烦扰我的吗？真是个[jitter]不同寻常[/jitter]的小小构装体呢……", "new": "怎么，不是来找我麻烦的呀？真是台[jitter]与众不同的[/jitter]小小机宝呢……", "key": "TEZCATARA.talk.DEFECT.0-1.ancient"}, {"old": "要是他被自己的同类给毁了，那该多荒唐呀？", "new": "要是他被自己的同类给灭了，那多可乐呀？", "key": "TEZCATARA.talk.DEFECT.1-0r.ancient"}, {"old": "你确定想要被修好么？", "new": "你确定想被修好么？", "key": "TEZCATARA.talk.DEFECT.2-0.ancient"}, {"old": "哎呀，要是你真的[jitter]确定[/jitter]的话。", "new": "哎呀，只要你[jitter]确定[/jitter]就行。", "key": "TEZCATARA.talk.DEFECT.2-2.ancient"}, {"old": "啊呀，你[jitter]燃烧[/jitter]得真漂亮！进来，进来吧！", "new": "哎呀，你[jitter]烧[/jitter]得真好看！进来，快进来！", "key": "TEZCATARA.talk.IRONCLAD.0-0.ancient"}, {"old": "你是个多么强壮的男孩啊！来，吃点东西吧。\n空着肚子可没法[jitter]杀戮[/jitter]！", "new": "你是个多壮的小伙子啊！来，吃点东西。\n空着肚子可没法[jitter]打架[/jitter]！", "key": "TEZCATARA.talk.IRONCLAD.1-0r.ancient"}, {"old": "哦哦，建筑师还活着吗？那能不能麻烦你[jitter]快点[/jitter]去杀了他呢？\n我就在这里等着吧！", "new": "哦哦，包工头还活着呢？那能麻烦你[jitter]快点[/jitter]去弄死他吗？\n我就在这儿等哈！", "key": "TEZCATARA.talk.IRONCLAD.2-0.ancient"}, {"old": "嗯，一具骷髅来到这个地方是要做什么呢？", "new": "嗯，一具骷髅跑来这儿是要干嘛呢？", "key": "TEZCATARA.talk.NECROBINDER.0-0.ancient"}, {"old": "我的目标很单纯，我要为我的家人们复仇。\n我会前往塔顶，让他付出代价。", "new": "我的目标很简单，给我家人报仇。\n我会爬到塔顶，让他付出代价。", "key": "TEZCATARA.talk.NECROBINDER.0-1.char"}, {"old": "进来吧，进来！我们来让你的火焰燃烧得更[jitter]明亮[/jitter]。", "new": "进来吧进来！我们来让你的火烧得更[jitter]旺[/jitter]。", "key": "TEZCATARA.talk.NECROBINDER.1-0r.ancient"}, {"old": "你周身的这些火焰，倒是让我想起了一样禁忌的东西。", "new": "你身上这些火，倒让我想起一样禁忌的东西。", "key": "TEZCATARA.talk.NECROBINDER.2-0.ancient"}, {"old": "你知道些什么？", "new": "你知道点什么？", "key": "TEZCATARA.talk.NECROBINDER.2-1.char"}, {"old": "啊呀呀，真是位稀奇的访客！你是哪位呀，亲爱的？", "new": "啊呀呀，真是位稀奇的客人！你是谁呀，亲爱的？", "key": "TEZCATARA.talk.REGENT.0-0.ancient"}, {"old": "我不是什么亲爱的！对我说话得尊重一点，巨大的……东西人类！", "new": "别叫我亲爱的！跟我说话客气点，你这大……东西人类！", "key": "TEZCATARA.talk.REGENT.0-1.char"}, {"old": "那我真是礼数不周啦？\n特兹卡塔拉高兴地咯咯笑。", "new": "那我可真是失礼啦？\n特兹卡塔拉乐得咯咯直笑。", "key": "TEZCATARA.talk.REGENT.0-2.ancient"}, {"old": "你和你的伙伴们又回来啦？\n我给你们做了好些[jitter]点心[/jitter]哦！", "new": "你和你那帮朋友又回来啦？\n我给你们做了好些[jitter]点心[/jitter]哦！", "key": "TEZCATARA.talk.REGENT.1-0r.ancient"}, {"old": "欢迎回来，王室男孩！看起来你在外头表现得[jitter]很棒[/jitter]呢。", "new": "欢迎回来，王室男孩！看你在外头表现得很[jitter]棒[/jitter]嘛。", "key": "TEZCATARA.talk.REGENT.2-0.ancient"}, {"old": "那当然了！只是在上层遇到了一些小小挫折……比如死掉。", "new": "那当然！就是在上层遇到点小挫折……比如死了。", "key": "TEZCATARA.talk.REGENT.2-1.char"}, {"old": "所有人都是从错误中吸取经验的吶。", "new": "谁还不是从翻车里长记性的呢。", "key": "TEZCATARA.talk.REGENT.2-2.ancient"}, {"old": "过来一点，安静的小家伙。我的眼神可不太好使啦……", "new": "凑近点，安静的小家伙。我这眼神可不中用了……", "key": "TEZCATARA.talk.SILENT.0-0.ancient"}, {"old": "你可以[jitter]信任[/jitter]我的。", "new": "你可以[jitter]信[/jitter]我的。", "key": "TEZCATARA.talk.SILENT.0-2.ancient"}, {"old": "你得了很严重的[jitter]疾病[/jitter]呢。让我来照顾你吧。", "new": "你病得可不轻[jitter]呢[/jitter]。让我来照顾你吧。", "key": "TEZCATARA.talk.SILENT.1-0r.ancient"}, {"old": "我也见过你的姐妹们，你知道吧？都是很可爱的女孩子呢。", "new": "我也见过你的姐妹们哦。都是挺可爱的小姑娘呢。", "key": "TEZCATARA.talk.SILENT.2-0.ancient"}, {"old": "哎呀亲爱的……你不会一直都在[jitter]战斗[/jitter]吧？", "new": "哎呀亲爱的……你不会一直在[jitter]打架[/jitter]吧？", "key": "TEZCATARA.talk.SILENT.2-2.ancient"}, {"old": "哎呀，有客人！快进来吧，亲爱的！\n特兹卡塔拉能为你做点什么吶？", "new": "哎呀，来客人啦！快进来，亲爱的！\n特兹卡塔拉能为你做点啥吶？", "key": "TEZCATARA.talk.firstVisitEver.0-0.ancient"}, {"old": "建筑师", "new": "包工头", "key": "THE_ARCHITECT.title"}, {"old": "你在这里做什么？", "new": "你来这儿干嘛？", "key": "THE_ARCHITECT.talk.DEFECT.0-0r.ancient"}, {"old": "修好你？凭什么。", "new": "修好你？凭啥。", "key": "THE_ARCHITECT.talk.DEFECT.0-2r.ancient"}, {"old": "你回来了？我不是把你拆解了吗？", "new": "你又回来了？我不是把你拆了吗？", "key": "THE_ARCHITECT.talk.DEFECT.1-0r.ancient"}, {"old": "你怎么还能一直回来？这是涅奥做的么？", "new": "你怎么还能一直回来？是涅奥干的？", "key": "THE_ARCHITECT.talk.DEFECT.2-0r.ancient"}, {"old": "是大恶魔的走狗来了么？", "new": "是大恶魔的狗腿子来了？", "key": "THE_ARCHITECT.talk.IRONCLAD.0-0r.ancient"}, {"old": "敌人……\n杀戮……", "new": "敌人……\n杀……", "key": "THE_ARCHITECT.talk.IRONCLAD.0-1r.char"}, {"old": "你被诅咒必须永远战斗，是吧？", "new": "你被诅咒必须永远战斗，对吧？", "key": "THE_ARCHITECT.talk.IRONCLAD.1-0r.ancient"}, {"old": "建筑师……最大……敌人！！", "new": "包工头……最大……敌人！！", "key": "THE_ARCHITECT.talk.IRONCLAD.1-1r.char"}, {"old": "你是不是连自己的名字都不记得了？", "new": "你是不是连自己叫啥都忘了？", "key": "THE_ARCHITECT.talk.IRONCLAD.1-2r.ancient"}, {"old": "我怜悯你。", "new": "我可怜你。", "key": "THE_ARCHITECT.talk.IRONCLAD.2-0r.ancient"}, {"old": "杀戮……", "new": "杀……", "key": "THE_ARCHITECT.talk.IRONCLAD.2-1r.char"}, {"old": "回塔底去吧，铁甲战士。", "new": "回塔底去吧，红裤衩。", "key": "THE_ARCHITECT.talk.IRONCLAD.2-2r.ancient"}, {"old": "建筑师！你杀死了我的父母，你杀死了我的朋友，你杀死了我的生命！……所以现在，我要杀死你！", "new": "包工头！你杀了我爹妈，你杀了我朋友，你杀了我的命！……所以现在，我要弄死你！", "key": "THE_ARCHITECT.talk.NECROBINDER.0-0.char"}, {"old": "复仇是么？敬谢不敏。", "new": "报仇是么？没兴趣。", "key": "THE_ARCHITECT.talk.NECROBINDER.0-1.ancient"}, {"old": "建筑师！你杀死了我的父母，你杀死了我的朋友，你杀死了我的——", "new": "包工头！你杀了我爹妈，你杀了我朋友，你杀了我的——", "key": "THE_ARCHITECT.talk.NECROBINDER.1-0r.char"}, {"old": "你无法用愤怒改变过去。", "new": "你没法用愤怒改变过去。", "key": "THE_ARCHITECT.talk.NECROBINDER.1-1r.ancient"}, {"old": "建筑师！你杀死了我的父母，你杀死了我的朋友，你杀死了我的生命——", "new": "包工头！你杀了我爹妈，你杀了我朋友，你杀了我的命——", "key": "THE_ARCHITECT.talk.NECROBINDER.2-0r.char"}, {"old": "我只是为了维持秩序，做了我必须做的事情。", "new": "我只是维持秩序，做了该做的事。", "key": "THE_ARCHITECT.talk.NECROBINDER.2-1r.ancient"}, {"old": "建筑师！你杀死了我的父母，你杀死了我的朋友，你杀死了我的——", "new": "包工头！你杀了我爹妈，你杀了我朋友，你杀了我的——", "key": "THE_ARCHITECT.talk.NECROBINDER.3-0r.char"}, {"old": "生命", "new": "命", "key": "THE_ARCHITECT.talk.NECROBINDER.3-1r.ancient"}, {"old": "哈……？！死吧，怪物！", "new": "哈……？！去死吧，怪物！", "key": "THE_ARCHITECT.talk.NECROBINDER.3-2r.char"}, {"old": "我终于到达了！喂，那边的平民！这里就是塔顶么？", "new": "我终于到了！喂，那边的那个！这儿就是塔顶？", "key": "THE_ARCHITECT.talk.REGENT.0-0.char"}, {"old": "看来我需要教你一点礼数！", "new": "看来我得教教你怎么做人！", "key": "THE_ARCHITECT.talk.REGENT.0-2.char"}, {"old": "我又到这里了！", "new": "我又来了！", "key": "THE_ARCHITECT.talk.REGENT.1-0r.char"}, {"old": "聒噪的愚者又来了么？", "new": "那个吵死人的蠢货又来了？", "key": "THE_ARCHITECT.talk.REGENT.1-1r.ancient"}, {"old": "我既不聒噪，也不是愚者！你快来面对着我！", "new": "我既不吵也不蠢！你给我当面说清楚！", "key": "THE_ARCHITECT.talk.REGENT.1-2r.char"}, {"old": "我已经受够了你的无礼了！", "new": "我受够你的无礼了！", "key": "THE_ARCHITECT.talk.REGENT.2-0r.char"}, {"old": "这一点，我们倒是意见一致。", "new": "这点上，我们倒是一拍即合。", "key": "THE_ARCHITECT.talk.REGENT.2-1r.ancient"}, {"old": "来起舞吧！", "new": "来跳舞吧！", "key": "THE_ARCHITECT.talk.REGENT.2-2r.char"}, {"old": "甚至都没有一句自我介绍么？", "new": "连句自我介绍都没有？", "key": "THE_ARCHITECT.talk.SILENT.0-0r.ancient"}, {"old": "你从何而来？\n所寻何物？", "new": "你从哪来？\n想找什么？", "key": "THE_ARCHITECT.talk.SILENT.1-0r.ancient"}, {"old": "第一个恶魔", "new": "头号恶魔", "key": "VAKUU.epithet"}, {"old": "瓦库", "new": "挖掘机", "key": "VAKUU.title"}, {"old": "在尖塔中追寻荣耀是么？我倒是有一些提案可以给你……", "new": "想在塔里追名逐利是么？我倒是有几个方案……", "key": "VAKUU.talk.ANY.0-0r.ancient"}, {"old": "{Visits}次。你已经来过这里{Visits}次。", "new": "{Visits}次。你已经来了{Visits}次了。", "key": "VAKUU.talk.ANY.1-0r.ancient"}, {"old": "你知道这永远不会结束，是吧？", "new": "你知道这永远不会结束，对吧？", "key": "VAKUU.talk.ANY.2-0r.ancient"}, {"old": "破损的存在呀，让我把你变得完美吧。", "new": "破烂的存在呀，让我把你变完美吧。", "key": "VAKUU.talk.DEFECT.0-0.ancient"}, {"old": "为何你的构装体同胞们都想杀死你，你就不觉得奇怪么？", "new": "为啥你的机宝同胞都想弄死你，你不觉得奇怪么？", "key": "VAKUU.talk.DEFECT.1-0r.ancient"}, {"old": "如果你把建筑师的心脏带给我，我就把你的同伴复原。", "new": "你要把包工头的心脏给我，我就把你那同伴复原。", "key": "VAKUU.talk.DEFECT.2-0.ancient"}, {"old": "何者更为重要？你的造主，还是你的朋友？", "new": "哪个更重要？你的造主，还是你的朋友？", "key": "VAKUU.talk.DEFECT.2-2.ancient"}, {"old": "真没想到，过了这么久，居然还会看见你。", "new": "没想到，过了这么久，居然还能见到你。", "key": "VAKUU.talk.IRONCLAD.0-0.ancient"}, {"old": "[jitter]神圣恶魔！[/jitter]\n你都对我做了什么！？", "new": "[jitter]神圣恶魔！[/jitter]\n你到底对我干了什么！？", "key": "VAKUU.talk.IRONCLAD.0-1.char"}, {"old": "正是你交易应得的哦。", "new": "都是你签的合同应得的哦。", "key": "VAKUU.talk.IRONCLAD.0-2.ancient"}, {"old": "失去的那些部落们是否仍让你感到沉重……？\n瓦库大笑起来。", "new": "失去的那些部落，还压得你喘不过气么……？\n瓦库笑了起来。", "key": "VAKUU.talk.IRONCLAD.1-0r.ancient"}, {"old": "我傀儡中的傀儡呵……你为何还没有杀死建筑师？", "new": "我傀儡中的傀儡啊……你咋还没弄死包工头？", "key": "VAKUU.talk.IRONCLAD.2-0.ancient"}, {"old": "我杀了建筑师之后，就会来杀了[jitter]你！[/jitter]", "new": "等我杀了包工头，就来杀[jitter]你！[/jitter]", "key": "VAKUU.talk.IRONCLAD.2-1.char"}, {"old": "哈欠\n我很期待看着你如何失败。", "new": "哈欠\n我很期待看你咋翻车。", "key": "VAKUU.talk.IRONCLAD.2-2.ancient"}, {"old": "我们都在寻求复仇。当然，收获总要有代价。", "new": "我们都在求复仇。当然，收获总得付代价。", "key": "VAKUU.talk.NECROBINDER.0-0.ancient"}, {"old": "我接受任何代价，只要能换来他的死亡。", "new": "什么代价我都接，只要能换他一条命。", "key": "VAKUU.talk.NECROBINDER.0-1.char"}, {"old": "我知道你的那只手是从哪里来的。", "new": "我知道你那只手是从哪来的。", "key": "VAKUU.talk.NECROBINDER.1-0r.ancient"}, {"old": "我们两个，都被建筑师伤得很痛。", "new": "咱俩，都被包工头伤得不轻。", "key": "VAKUU.talk.NECROBINDER.2-0.ancient"}, {"old": "别多费唇舌了，恶魔。把你的契约给我看吧。", "new": "别废话了，恶魔。把合同给我看看。", "key": "VAKUU.talk.NECROBINDER.2-1.char"}, {"old": "开门见山吗，很好……", "new": "开门见山，很好……", "key": "VAKUU.talk.NECROBINDER.2-2.ancient"}, {"old": "居然是一个星间来客？在这被诅咒的墙内？", "new": "居然是个星际来客？在这被诅咒的墙里头？", "key": "VAKUU.talk.REGENT.0-0.ancient"}, {"old": "你知道我么？", "new": "你认识我？", "key": "VAKUU.talk.REGENT.0-1.char"}, {"old": "是啊，我觉得我们可以互相帮助。", "new": "是啊，我觉得咱俩可以互相帮衬。", "key": "VAKUU.talk.REGENT.0-2.ancient"}, {"old": "只需付出小小代价，你就可以拥有我的更多力量。", "new": "只要付出小小的代价，你就能拿到我更多的力量。", "key": "VAKUU.talk.REGENT.1-0r.ancient"}, {"old": "我觉得这些条件都不怎么样，我感觉很不好。", "new": "我觉得这些条款都不咋地，我心里直发毛。", "key": "VAKUU.talk.REGENT.2-0.char"}, {"old": "你有好好完整地阅读过契约吧？\n你是在完全知情、主动、而且愿意接受所有相关责任的条件下签下的名字对吧？", "new": "合同你有好好从头到尾读过吧？\n你是完全知情、主动、且愿意承担一切相关责任才签的名，对吧？", "key": "VAKUU.talk.REGENT.2-1.ancient"}, {"old": "你不打算完成交易里自己的那一半么？\n那再来一份契约怎么样？是不是更好一些？", "new": "不打算履行你那份义务了？\n那再来一份合同咋样？是不是更合适点？", "key": "VAKUU.talk.REGENT.2-2.ancient"}, {"old": "杀人者。", "new": "杀人犯。", "key": "VAKUU.talk.SILENT.0-0.ancient"}, {"old": "你是不会有[jitter]好下场[/jitter]的。", "new": "你是不会有好[jitter]下场的[/jitter]。", "key": "VAKUU.talk.SILENT.0-2.ancient"}, {"old": "瓦库向静默猎手展示着他的各种契约。", "new": "瓦库向猎宝展示着他各式各样的合同。", "key": "VAKUU.talk.SILENT.1-0r.ancient"}, {"old": "建筑师还不够，把你的姐妹们也杀了吧！", "new": "包工头还不够，把你的姐妹们也都杀了吧！", "key": "VAKUU.talk.SILENT.2-0.ancient"}, {"old": "无需言语，我们两个是一样的。", "new": "不用说话，咱俩是一路人。", "key": "VAKUU.talk.SILENT.2-2.ancient"}, {"old": "把你自己交给我，你就能变得和我一样万众畏惧。", "new": "把你自己交给我，你就能变得和我一样人人畏惧。", "key": "VAKUU.talk.firstVisitEver.0-0.ancient"}, {"old": "锁定", "new": "404", "key": "ERROR.title"}, {"old": "继续", "new": "冲鸭", "key": "PROCEED.title"}]}, {"table": "events", "name": "事件", "rows": [{"old": "深渊浴场", "new": "东北大澡堂", "key": "ABYSSAL_BATHS.title"}, {"old": "敬而远之", "new": "不敢下水", "key": "ABYSSAL_BATHS.pages.INITIAL.options.ABSTAIN.title"}, {"old": "投身其中", "new": "搓一顿", "key": "ABYSSAL_BATHS.pages.INITIAL.options.IMMERSE.title"}, {"old": "沉溺", "new": "泡到发白", "key": "ABYSSAL_BATHS.pages.ALL.options.LINGER.title"}, {"old": "离开浴场", "new": "搓完走人", "key": "ABYSSAL_BATHS.pages.ALL.options.EXIT_BATHS.title"}, {"old": "熔合者", "new": "缝纫机", "key": "AMALGAMATOR.title"}, {"old": "融合打击", "new" D.title"}, {"old": "每日挑战", "new": "每日整活", "key": "SINGLE_PLAYER_DAILY_RUN.title"}, {"old": "自定义", "new": "自己整", "key": "SINGLE_PLAYER_CUSTOM.title"}]}];
let cur = "__ALL__", kw = "";

const tabs = document.getElementById("tabs");
function buildTabs(){
  const all = [{table:"__ALL__",name:"全部",rows:DATA.flatMap(t=>t.rows)}].concat(DATA);
  tabs.innerHTML = "";
  all.forEach(t=>{
    const d = document.createElement("div");
    d.className = "tab" + (t.table===cur ? " on" : "");
    d.innerHTML = t.name + "<i>" + t.rows.length + "</i>";
    d.onclick = ()=>{ cur = t.table; buildTabs(); render(); };
    tabs.appendChild(d);
  });
}

function esc(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(s){
  const e = esc(s);
  if(!kw) return e;
  return e.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi"), m=>"<mark>"+m+"</mark>");
}

function render(){
  const src = cur==="__ALL__" ? DATA.flatMap(t=>t.rows) : (DATA.find(t=>t.table===cur)||{rows:[]}).rows;
  const k = kw.trim().toLowerCase();
  const rows = k ? src.filter(r=>r.old.toLowerCase().includes(k) || r.new.toLowerCase().includes(k)) : src;
  document.getElementById("count").textContent = "显示 " + rows.length + " 条" + (k ? "（搜索：" + kw + "）" : "");
  const grid = document.getElementById("grid");
  if(!rows.length){ grid.innerHTML = '<div class="empty">没有匹配的条目 🐟</div>'; return; }
  grid.innerHTML = rows.slice(0, 3000).map(r=>
    '<div class="item"><div class="old">' + hl(r.old || "（原版没有）") + '</div>' +
    '<div class="new">' + hl(r.new) + '</div>' +
    '<div class="key">' + esc(r.key) + '</div></div>').join("");
}

document.getElementById("q").addEventListener("input", e=>{ kw = e.target.value; render(); });
buildTabs(); render();
</script>
