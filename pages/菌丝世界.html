;gap:18px;font-family:var(--mono);font-size:11px;color:var(--dim);user-select:none}.stats b{color:var(--ink);font-weight:500}.toast{position:fixed;bottom:84px;left:50%;transform:translate(-50%) translateY(8px);background:var(--glass-solid);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:12px;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:0 12px 40px #00000080}.toast.show{opacity:1;transform:translate(-50%) translateY(0)}.veil{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#04060b33,#04060bbf);z-index:20;transition:opacity .9s ease;text-align:center;padding:20px 300px 20px 20px}#ui-root>.veil.gone{opacity:0;pointer-events:none}.veil .big{font-size:clamp(38px,9vw,96px);font-weight:200;letter-spacing:.32em;padding-left:.32em;background:linear-gradient(180deg,#ffffff,#7fd8ff 60%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}.veil .sub{margin-top:18px;color:var(--dim);font-size:clamp(12px,2.4vw,15px);letter-spacing:.08em;line-height:1.6;max-width:520px;animation:rise 1.2s .15s cubic-bezier(.16,1,.3,1) both}.veil .hint{margin-top:26px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#56617a;animation:pulse 2.4s ease-in-out infinite}@keyframes rise{0%{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,to{opacity:.4}50%{opacity:1}}@media (max-width: 720px){.panel{display:none}.veil{padding:20px}.tagline{display:none}.seed-input{width:120px}.stats{display:none}.toolbar{bottom:84px}}</style>
