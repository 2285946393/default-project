<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#ffeef3">
<meta property="og:title" content="糖果果冻培育罐">
<meta property="og:description" content="拖拽揉捏 Q 弹果冻，看它撕裂回弹 · 单文件双击即跑">
<title>糖果果冻培育罐 · 有花无实</title>
<style>
  :root{
    --cream:#fff7ec; --berry:#ff8fab; --mint:#7ee8c2; --blue:#9ecbff; --lemon:#ffe98a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
  body{background:#ffeef3}
  #wrapper{width:100%;height:100%;position:fixed;inset:0}
  #canvas{width:100%;height:100%;display:block;position:absolute;inset:0}

  /* 粉彩奶油覆盖层：把灰色canvas染成奶油底，必须不挡拖拽 */
  #tint{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.30),rgba(255,214,229,.22) 55%,rgba(255,225,240,.30));
    mix-blend-mode:screen;
  }

  /* 樱色粒子 */
  #petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .petal{position:absolute;top:-4vh;width:14px;height:12px;background:radial-gradient(circle at 30% 30%,#ffd7e5,#ff9fbe);
    border-radius:100% 0 100% 0;opacity:.85;animation:fall linear infinite;box-shadow:0 0 6px rgba(255,160,190,.5)}
  @keyframes fall{0%{transform:translateY(-6vh) rotate(0) translateX(0)}100%{transform:translateY(106vh) rotate(300deg) translateX(6vw)}}
  @media (prefers-reduced-motion:reduce){.petal{animation:none;display:none}}

  /* 标题 */
  #title{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:6;text-align:center;pointer-events:none}
  #title h1{font-size:26px;font-weight:800;color:#d9537f;letter-spacing:3px;text-shadow:0 2px 12px rgba(255,190,215,.7),0 1px 0 #fff;font-family:'PingFang SC',sans-serif}
  #title p{font-size:13px;color:#e58aa9;margin-top:4px;letter-spacing:1px}

  /* 毛玻璃控制面板（底部，不抢主体） */
  #panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:10px 16px;
    box-shadow:0 8px 28px rgba(217,83,127,.18);max-width:94vw}
  .seg{display:flex;background:rgba(255,255,255,.5);border-radius:12px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;color:#b06785;font-size:12px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer;transition:.2s}
  .seg button.on{background:#fff;color:#d9537f;box-shadow:0 2px 8px rgba(217,83,127,.2)}
  .pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.5);border-radius:12px;padding:6px 11px;font-size:12px;color:#b06785;font-weight:600;cursor:pointer;user-select:none}
  .pill input{display:none}
  .pill .sw{width:26px;height:14px;border-radius:7px;background:#f2c9d8;position:relative;transition:.2s}
  .pill .sw::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .pill input:checked + .sw{background:#ff8fab}
  .pill input:checked + .sw::after{left:14px}
  #summon{border:none;background:linear-gradient(135deg,#ff9fbe,#ff6f9c);color:#fff;font-size:13px;font-weight:700;
    padding:9px 18px;border-radius:14px;cursor:pointer;box-shadow:0 4px 14px rgba(255,111,156,.4);transition:.2s;letter-spacing:1px}
  #summon:active{transform:scale(.94)}
  #flavor{position:fixed;right:16px;bottom:20px;z-index:6;font-size:12px;color:#e58aa9;pointer-events:none;text-align:right;line-height:1.7}

  /* 返回展馆 */
  #back{position:fixed;top:16px;left:16px;z-index:6;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.9);color:#d9537f;font-size:13px;font-weight:600;padding:7px 14px;border-radius:20px;
    text-decoration:none;box-shadow:0 4px 14px rgba(217,83,127,.15);transition:.2s}
  #back:hover{transform:translateY(-2px);background:#fff}

  /* 拖拽提示（渐隐） */
  #hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;text-align:center;
    background:rgba(255,255,255,.6);backdrop-filter:blur(6px);padding:10px 22px;border-radius:20px;color:#d9537f;font-size:14px;
    font-weight:600;border:1px solid rgba(255,255,255,.8);box-shadow:0 6px 20px rgba(217,83,127,.15);opacity:0;transition:opacity .8s}
  #hint.show{opacity:1}
</style>
</head>
<body>
  <a id="back" href="#">‹ 返回展馆</a>
  <div id="title">
    <h1>🍮 糖果果冻培育罐</h1>
    <p>拖拽揉捏你的果冻 · 看它 Q 弹撕裂</p>
  </div>
  <div id="wrapper"><canvas id="canvas"></canvas></div>
  <div id="tint"></div>
  <div id="petals"></div>

  <div id="panel">
    <div class="seg" id="quality">
      <button data-id="low" class="on">🍃 薄荷</button>
      <button data-id="medium">🍓 草莓</button>
      <button data-id="high">🫐 蓝莓</button>
      <button data-id="super">🍋 柠檬</button>
    </div>
    <label class="pill"><input type="checkbox" id="box"><span class="sw"></span>边界</label>
    <label class="pill"><input type="checkbox" id="velocity"><span class="sw"></span>流速</label>
    <button id="summon">✦ 召唤新果冻</button>
  </div>
  <div id="flavor">🍬 切口味 = 诞生新果冻<br>🐟 群号 574612434</div>
  <div id="hint">拖住它揉一揉，松手看它弹回去～</div>

  <!-- main.js 依赖的隐藏控件 -->
  <input type="radio" name="quality" id="low" checked>
  <input type="radio" name="quality" id="medium">
  <input type="radio" name="quality" id="high">
  <input type="radio" name="quality" id="super">

<script>

/* ---- 糖果果冻培育罐 · 包裹增强层 ---- */
(function(){
  var ids=['low','medium','high','super'];
  var names={'low':'🍃 薄荷','medium':'🍓 草莓','high':'🫐 蓝莓','super':'🍋 柠檬'};
  var btns=document.querySelectorAll('#quality button');
  var cur='low';

  // 点击切档
  btns.forEach(function(b){
    b.addEventListener('click',function(){
      cur=b.getAttribute('data-id');
      document.getElementById(cur).click(); // 触发 main.js 的 initSim → 诞生新果冻
      btns.forEach(function(x){x.classList.toggle('on',x===b)});
      showHint('✦ 诞生了一只「'+names[cur]+'」果冻！');
    });
  });

  // 召唤新果冻：重触发当前档位
  document.getElementById('summon').addEventListener('click',function(){
    document.getElementById(cur).click();
  });

  // 提示气泡
  var hintEl=document.getElementById('hint'),hintTimer;
  function showHint(t){
    hintEl.textContent=t; hintEl.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer=setTimeout(function(){hintEl.classList.remove('show')},1800);
  }

  // 初次拖拽提示
  var canvas=document.getElementById('canvas');
  var shown=false;
  ['pointerdown','mousedown','touchstart'].forEach(function(ev){
    canvas.addEventListener(ev,function(){
      if(!shown){shown=true;showHint('拖住它揉一揉，松手看它弹回去～');}
    },{passive:true});
  });

  // 樱色粒子
  var petalBox=document.getElementById('petals');
  var COLORS=['#ff9fbe','#ffc3d4','#ffd7e5','#ffb0c8'];
  for(var i=0;i<22;i++){
    var p=document.createElement('div');p.className='petal';
    var dur=6+Math.random()*8; p.style.animationDuration=dur+'s';
    p.style.animationDelay=(-Math.random()*dur)+'s';
    p.style.left=(Math.random()*100)+'vw';
    p.style.width=(10+Math.random()*8)+'px'; p.style.height=(p.style.width*0.85)+'px';
    p.style.background='radial-gradient(circle at 30% 30%,#ffdde9,'+COLORS[i%4]+')';
    p.style.opacity=(0.4+Math.random()*0.4).toFixed(2);
    petalBox.appendChild(p);
  }

  // 返回展馆：站内有来路才 back，否则回首页
  document.getElementById('back').addEventListener('click',function(e){
    e.preventDefault();
    if(document.referrer && document.referrer.indexOf(location.hostname)>-1) history.back();
    else location.href='/';
  });
})();

</script>
