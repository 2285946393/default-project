<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>万象棋作弊器 · 王者万象棋开挂模拟器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>">
<style>
:root{--bg1:#fdf9f0;--bg2:#f5edda;--card:#fffdf7;--ink:#403628;--sub:#8d7c64;--line:#eaddc2;--red:#d1495b;--gold:#c9962e;--green:#4fae6d}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(165deg,var(--bg1),var(--bg2));color:var(--ink);min-height:100vh}
header{max-width:980px;margin:0 auto;padding:26px 16px 0;text-align:center}
h1{margin:0;font-size:30px;letter-spacing:2px}
h1 .red{color:var(--red)}
.sub{color:var(--sub);font-size:13px;margin:8px 0 12px}
.statline{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.statline span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.tabs{position:sticky;top:0;z-index:9;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 8px;margin-top:12px;background:#fdf9f0e6;backdrop-filter:blur(8px);border-bottom:1px solid #eaddc27a}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer;transition:.15s}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 14px 60px}
section{display:none}
section.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
@keyframes pop{0%{transform:scale(.96);opacity:.4}60%{transform:scale(1.01)}100%{transform:scale(1)}}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:0 6px 18px #d9c9a422}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;color:#fff;margin-right:5px}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:11px;background:#f3ead4;color:#8a6d3b;border:1px solid #e5d5ae;margin-right:5px}
.mh{display:inline-block;border-radius:8px;padding:3px 9px;font-size:12px;color:#fff;margin:3px 4px 0 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;transition:.15s}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input.search{flex:1;min-width:160px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;background:#fff;outline:none}
.bigbtn{display:block;margin:18px auto 0;border:none;border-radius:999px;padding:16px 44px;font-size:19px;letter-spacing:2px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#d1495b,#e07a45);box-shadow:0 10px 24px #d1495b44;transition:.15s}
.bigbtn:active{transform:scale(.97)}
.bigbtn:disabled{opacity:.6;cursor:wait}
.cheat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-top:16px;box-shadow:0 10px 26px #d9c9a433;animation:pop .3s;position:relative}
.cheat .stamp{position:absolute;right:14px;top:12px;font-size:11px;color:var(--red);border:1.5px solid var(--red);border-radius:6px;padding:2px 8px;transform:rotate(6deg);opacity:.85;letter-spacing:1px}
.cheat h3{margin:0 0 4px;font-size:20px}
.cheat .row{margin:10px 0;font-size:14px;line-height:1.6}
.cheat .lbl{color:var(--sub);font-size:12px;margin-bottom:2px}
.bar{height:10px;background:#f0e7d2;border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c9962e,#d1495b);border-radius:99px;transition:width .8s}
.quote{margin-top:12px;font-size:13px;color:#8a6d3b;background:#faf3df;border:1px dashed #e0cf9f;border-radius:10px;padding:8px 12px}
.copybtn{margin-top:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer}
.copybtn:hover{border-color:var(--red);color:var(--red)}
.detail{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.sttabs{display:flex;gap:6px;margin-bottom:8px}
.sttabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer}
.sttabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:470px}
.cell{aspect-ratio:1;border:1.5px dashed #e6d8ba;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:1px;color:#fff;overflow:hidden;line-height:1.1}
.cell.e{background:#fbf5e6}
.cell.f{border-style:solid}
.cell.aw{box-shadow:0 0 0 2px var(--gold)}
.eqrow{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.7}
.eqrow b{color:var(--ink)}
.idea{font-size:13px;color:var(--sub);line-height:1.7;margin-top:8px;background:#faf5e8;border-radius:10px;padding:8px 12px}
.pcard .line{font-style:italic;color:var(--sub);font-size:12px;margin:4px 0 10px}
.pcard h3{margin:0;font-size:17px}
.pskill{font-size:13px;line-height:1.6;margin:6px 0}
.pskill b{color:var(--red)}
.tcat{margin:16px 0 8px;font-size:15px;font-weight:700}
.tcat .tag{vertical-align:2px}
.tip{margin-bottom:8px}
.tip b{font-size:14px}
.tip p{margin:4px 0 0;font-size:13px;color:var(--sub);line-height:1.7}
.randline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
footer{max-width:980px;margin:0 auto;padding:0 16px 34px;text-align:center;color:#b3a488;font-size:12px;line-height:1.9}
.core{color:var(--red);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>🀄 万象棋<span class="red">作弊器</span></h1>
  <div class="sub">王者万象棋 · 玄学开挂模拟器 + 阵容速查手册（S 赛季）</div>
  <div class="statline" id="statline"></div>
</header>
<nav class="tabs">
  <button class="on" data-t="cheat">🎲 一键开挂</button>

  <button data-t="players">🧙 棋手图鉴</button>

    <div class="filters"><input class="search" id="q" placeholder="搜阵容 / 英雄名，比如「马超」"></div>
    <div class="filters" id="campF"></div>
    <div class="filters" id="labelF"></div>
    <div class="grid" id="compsGrid"></div>

  <section id="tab-players"><div class="grid" id="playersGrid"></div></section>
  <section id="tab-tips">
    <div class="randline"><button class="chip" id="tipRnd">🎲 随机砸我一条冷知识</button><span style="color:var(--sub);font-size:12px">知己知彼，暗赚信息差</span></div>
    <div id="tipsBox"></div>
  </section>
</main>

<script>

,"q":3,"c":"逐鹿","r":"功能","sn":"幻纱之灵","sd":"西施随机向1个敌人所在位置释放持续3秒的能量球造成50+100%法术攻击力的法术伤害，3秒后能量球爆炸对这些单位造成100+100%法术攻击力的法术伤害。","pd":"整备：获得1张推演战术。"},{"n":"刘禅","q":3,"c":"三分之地","r":"前排","sn":"机关魔爪","sd":"刘禅操作机关魔爪对当前目标敌人造成50+100%物理攻击力的物理伤害并眩晕1秒，自身获得100点护盾，持续4秒。","pd":"你的英雄释放技能时，该英雄获得2临时等级。"},{"n":"猪八戒","q":3,"c":"无阵营","r":"前排","sn":"肉弹蹦床","sd":"被动：猪八戒每承受600点伤害将永久提升45点最大生命值并增大体型，但降低1%移动速度，最多叠加30层。 主动：猪八戒奋力跳起，落地时震击地面，对附近1格敌人造成7%最大生命值的法术伤害。","pd":"夺取 每当3阶及以下英雄合成时，与其同阶的英雄等级+1。"},{"n":"程咬金","q":3,"c":"河洛","r":"前排","sn":"正义潜能","sd":"程咬金迸发出自身的正义热情，3秒内恢复35+10%最大生命值的生命值。","pd":"整备：获得1张古币，对自身使用1张古币。"},{"n":"狄仁杰","q":3,"c":"河洛","r":"输出","sn":"迅捷","sd":"狄仁杰激发潜能，获得1层迅捷效果，增加自身40%基础攻击速度，持续5秒，若已经达到攻速上限，则获得3%的基础攻击力，最多叠加3次。","pd":"对狄仁杰使用古币时，其攻击速度永久+5%。"},{"n":"张良","q":3,"c":"大河流域","r":"功能","sn":"言灵·操纵","sd":"张良以言灵之术抓住1名敌人，持续1.5秒，期间每0.5秒造成100点法术伤害，并持续压制对方。","pd":"每当你的单位触发开团效果时，场上随机3名己方英雄等级永久+1。"},{"n":"少司缘","q":3,"c":"大河流域","r":"功能","sn":"因缘际会","sd":"少司缘指挥成群的缘崽向前拥簇飞行，恢复沿途友军100+50%法术攻击力的生命值。","pd":"在场时，召唤因缘图腾。"},{"n":"亚瑟","q":3,"c":"日落海","r":"前排","sn":"誓约之盾","sd":"亚瑟召唤圣盾围绕自身旋转，持续5秒。每秒对1格内敌人造成50%物理攻击力的物理伤害并获得15%伤害减免，亚瑟每次参与击杀获得30点最大生命值。","pd":"每当你使用【日落海】英雄牌时，阿科米亚核心等级+3。"},{"n":"钟馗","q":3,"c":"河洛","r":"前排","sn":"湮灭之锁","sd":"钟馗投出钩锁，将距离自己最远的1名敌人拉到身边，造成50+100%法术攻击力的法术伤害，并使其成为友军的优先攻击目标。","pd":"自身及左右1格的英雄获得牺牲：击败者等级临时降低10%（每场战斗限1次）。"},{"n":"貂蝉","q":3,"c":"三分之地","r":"功能","sn":"语·花印","sd":"貂蝉向周围2格的随机敌人施放5朵花球，每朵花球造成50+40%法术攻击力的法术伤害并降低敌人70%生命恢复效果，持续5秒。","pd":"登场：【三分】英雄等级+1。"},{"n":"安琪拉","q":3,"c":"日落海","r":"功能","sn":"炽热光辉","sd":"安琪拉引导魔力朝敌人最多的方向施放炽热光辉，持续3秒，对路径上的敌人每0.1秒造成10%法术攻击力的法术伤害。","pd":"整备：自身及阿科米亚核心等级+2。"},{"n":"瑶","q":3,"c":"大河流域","r":"功能","sn":"独立兮山之上","sd":"被动：瑶在备战阶段，选择最近的友方英雄作为保护目标并在开战时附身其上。附身提供200+20%瑶最大生命值的护盾，以及10点双攻和5点双防，直到目标被击败。附身期间瑶会每2秒随机攻击至多2名敌人，造成50+50%法术伤害。","pd":"开团：自身的首件普通装备分享给随机3名友方英雄（持续15秒）。"},{"n":"镜","q":3,"c":"逐鹿","r":"输出","sn":"裂空","sd":"镜旋转攻击，对当前目标敌人造成60+80%物理攻击力的物理伤害。","pd":"闪现 每使用2张效果牌，等级+1。"},{"n":"朵莉亚","q":3,"c":"日落海","r":"功能","sn":"逐浪","sd":"被动：朵莉亚在自身创建的水域内会化身人鱼形态。普通攻击会额外恢复5点法力值，对目标附带50%法术攻击力的法术伤害，在水域内再次施放技能，原水域消失形成新水域。 主动：跃向3格内友军密集处创造一片水域，水域持续10秒，朵莉亚在水域中化身人鱼形态，落地立即恢复范围内友军75+100%法术攻击力的生命值，10点法力值（法力值恢复不对朵莉亚生效），水域每秒恢复范围内友军50%法术攻击力的生命值，朵莉亚离开水域时水域消失并且恢复人形态。","pd":"每当你的英雄触发整备效果时，随机3名英雄及阿科米亚核心等级+1。"},{"n":"莱西奥","q":4,"c":"日落海","r":"输出","sn":"传奇英雄登场","sd":"被动：莱西奥每8次普攻，会使用小火鹰发射1枚强化飞弹，对目标造成150%物理攻击力的物理伤害并且对周围1格敌人造成50%物理攻击力的物理伤害，若未发射，则充能1层，最多储存5层。 主动：莱西奥扔出烟雾弹制造1片烟雾，使处于烟雾中的英雄不会被优先攻击，并且增加30%攻击速度。","pd":"每当你出售2名场上英雄后，阿科米亚核心等级+1。"},{"n":"上官婉儿","q":4,"c":"河洛","r":"功能","sn":"篆法·疾势","sd":"上官婉儿朝最远处的敌人挥出1记笔墨，对沿途敌人造成100+100%法术攻击力的法术伤害。","pd":"整备：随机对3名不同【河洛】英雄使用1张古币。"},{"n":"艾琳","q":4,"c":"日落海","r":"功能","sn":"叶舞·致意","sd":"被动：艾琳每次普攻为自己累积1层月桂祝福，当达到10/20层时，艾琳的技能会获得进化。 主动：艾琳向当前目标敌人发出1束月桂叶，造成100%法术攻击力的法术伤害。 10层进化：若周围2格有敌人，则位移至敌人较少处，随后向目标发出1片月桂飞叶，造成100%法术攻击力的法术伤害。 20层进化：若周围2格有敌人，则位移至敌人较少处，向目标发出5片月桂飞叶，每片造成100%法术攻击力的法术伤害。","pd":"开团：艾琳获得自身等级×1%的攻击速度。"},{"n":"扁鹊","q":4,"c":"逐鹿","r":"功能","sn":"万变灵药","sd":"扁鹊朝场上生命值比例最低的3个单位扔出药瓶，药瓶触地后破碎留下药液，持续5秒。处于药液中的友军每秒恢复20+60%法术攻击力的生命值，处于药液中的敌人每秒受到20+60%法术攻击力的法术伤害，效果可叠加。","pd":"友方单位护盾被击破时，对周围敌人造成该英雄最大生命值10%的法术伤害（冷却1秒）。"},{"n":"嬴政","q":4,"c":"逐鹿","r":"功能","sn":"至尊王权","sd":"嬴政展示王权，锁定最近的敌人，在5秒内号令80把飞剑朝其冲击，每把飞剑造成10+10%法术攻击力的法术伤害。若当前路径上没有敌人，嬴政会立即转向下个目标。","pd":"开团：法术攻击力+ 8。每次使用战术牌会提升该加成。"},{"n":"李信","q":4,"c":"河洛","r":"输出","sn":"力量觉醒","sd":"李信免控并短暂蓄力后当前方向挥出1道剑气，对命中的敌人造成50+180%物理攻击力的物理伤害。","pd":"每当你拥有牺牲效果的英雄阵亡时，李信临时等级+7。"},{"n":"李白","q":4,"c":"河洛","r":"输出","sn":"青莲剑歌","sd":"被动：李白施放技能时会积累1道剑气，最多4道。每道剑气提升10%基础物理攻击力。 主动：李白施展剑阵，降低目标敌人及其相邻敌人6点物理防御。随后化身剑气施展6次斩击，每次造成80%物理攻击力的物理伤害，伤害由范围内的敌人平均分摊。","pd":"闪现 古币牌会额外提供4临时等级。若目标为李白，该临时等级会额外+3。"},{"n":"雅典娜","q":4,"c":"日落海","r":"前排","sn":"敬畏圣盾","sd":"雅典娜举起圣盾，获得免控以及持续6秒15%最大生命值的护盾。2秒后雅典娜将使用圣盾反击，对附近1格敌人造成30点法术伤害。","pd":"开团：随机触发2名【日落海】英雄的整备效果。"},{"n":"太乙真人","q":4,"c":"无阵营","r":"前排","sn":"第三只手","sd":"太乙真人将自身拉向最远敌人，并嘲讽周围1格的敌人。","pd":"开团：使距离最近的1名英雄获得复生。"},{"n":"孙悟空","q":4,"c":"无阵营","r":"输出","sn":"大圣神威","sd":"孙悟空挥舞金箍棒砸向前方，造成100+400%物理攻击力的物理伤害。","pd":"闪现，夺取 整备：拥有闪现效果的英雄等级+2。"},{"n":"甄姬","q":4,"c":"三分之地","r":"功能","sn":"叹息水流","sd":"甄姬施放水流冲击当前目标敌人并弹向3格内最远的敌人，最多弹射4次，每次造成30+40%法术攻击力的法术伤害。敌人在3秒内受到3次水流伤害后会被冻结1秒。若目标附近无其他敌人则直接对其造成3倍水流伤害并直接被冻结。","pd":"登场：获得1张其他的登场英雄牌。"},{"n":"小乔","q":4,"c":"三分之地","r":"功能","sn":"甜蜜恋风","sd":"小乔持续引导1道旋风吹起最近的敌人，使其浮空并每0.2秒受到10%法术攻击力的法术伤害，最多3秒。","pd":"每当你的英雄触发登场效果时，随机3名英雄等级+1。"},{"n":"大司命","q":4,"c":"大河流域","r":"前排","sn":"魂归忘忧","sd":"被动：大司命的普通攻击会持续连接敌人，在3秒内造成5次伤害，每次造成50%物理攻击力的物理伤害。 主动：大司命神巫之力全开，从天而临对附近2格敌人造成150+200%物理攻击力的物理伤害并恢复100+5%最大生命值的生命值。同时凝聚1名范围内敌人的灵体协助战斗（视作召唤物）。之后进入神巫状态，无法恢复法力值，但普攻会恢复10+1%最大生命值的生命值。 灵体继承大司命部分属性，并且在大司命神巫状态攻击时，获得同样的生命恢复效果。","pd":"在场时，召唤往生图腾。 每当你触发牺牲效果时：往生图腾等级永久+2并获得50点法力值。"},{"n":"庄周","q":4,"c":"逐鹿","r":"前排","sn":"天人合一","sd":"庄周幻化梦域保护队友和自身，驱散自身和左右两边2格内友军，并获得200点护盾，持续5秒。","pd":"登场：自身等级+2并获得1张招募战术。"},{"n":"刘邦","q":4,"c":"大河流域","r":"前排","sn":"统御战场","sd":"刘邦在4秒内将普攻切换为范围横扫，期间每秒获得50点护盾。被横扫的敌人会被打上印记，友方造成伤害时会消耗标记，造成50+30%法术攻击力的法术伤害。","pd":"开团：摧毁你所有的图腾，每摧毁1个，刘邦等级永久+5。"},{"n":"诸葛亮","q":4,"c":"三分之地","r":"功能","sn":"元气弹","sd":"诸葛亮发射元气弹对当前目标造成150+100%法术攻击力的法术伤害，并对其相邻敌人造成40%伤害。","pd":"你的其他英雄释放技能时，诸葛亮获得15点法力值以及4临时等级。"},{"n":"韩信","q":4,"c":"大河流域","r":"输出","sn":"国士无双","sd":"被动：韩信每第3次普攻击飞敌人1秒，造成160%物理攻击力的物理伤害，并且每击败1名敌军增加10%基础攻击速度。 主动：韩信枪挑敌人造成击飞和100点物理伤害。","pd":"闪现 每当你的英雄触发整备或者开团效果时，韩信等级+1。"},{"n":"蒙犽","q":4,"c":"逐鹿","r":"输出","sn":"飞弹援袭","sd":"蒙犽发射8枚导弹攻击随机敌人，每枚造成30+100%物理攻击力的物理伤害。多枚导弹命中同一目标时，后续伤害衰减40%。","pd":"登场：获得1张特训战术。"},{"n":"东皇太一","q":5,"c":"大河流域","r":"功能","sn":"堕神契约","sd":"被动：东皇太一创造3颗能量球绕自身转动。能量球触碰到敌人时会造成其3%最大生命值的法术伤害并恢复东皇3%的最大生命值。 主动：东皇太一施展堕神契约压制目标敌人5秒，期间双方承受等量伤害。若期间目标距离过远，则效果提前中断。","pd":"图腾不会被优先攻击。 开团：获得每个图腾等级数15%的临时等级。"},{"n":"敖隐","q":5,"c":"大河流域","r":"输出","sn":"隐介藏形","sd":"敖隐唤出白龙冲向敌人密集处，造成100+75%物理攻击力的物理伤害。","pd":"战斗中，每个图腾每4秒为敖隐提供16%攻击速度和4临时等级。"},{"n":"鲁班大师","q":5,"c":"逐鹿","r":"功能","sn":"助推跳跃","sd":"鲁班大师跃入敌人最密集处连接3格内1名敌人并强制拽离，在落地后造成50+60%法术攻击力的法术伤害并眩晕0.5秒。","pd":"鲁班大师在场时，召唤1个等级与自身相同的机关傀儡。"},{"n":"花木兰","q":5,"c":"河洛","r":"输出","sn":"长城巡守者","sd":"被动：花木兰可以通过战场上的剑切换形态，两种形态的基础属性不同。 主动：轻剑形态下，挥舞双剑对目标发起7段攻击，每段造成80%物理攻击力的物理伤害。 重剑形态下，蓄力3秒后，将前方区域内敌人击飞并眩晕1.5秒，造成80+60%物理攻击力的物理伤害。蓄力期间自身处于免控状态。","pd":"本回合每使用4张古币牌，获得1次复生（总复生次数： 1）。  牺牲：临时等级+10。"},{"n":"司空震","q":5,"c":"河洛","r":"功能","sn":"雷霆万钧","sd":"司空震升入空中，使用雷鼓轰击全场敌人，造成50+65%法术攻击力的法术伤害。 雷霆之王：基础攻击速度增加15%。普攻能产生可传导3次的闪电链，造成75+50%法术攻击力的法术伤害，伤害逐次递减25%。闪电链伤害的40%会转化为自身护盾，上限300点。","pd":"你的其他英雄获得临时等级时，司空震获得一半效果（不超过自身真实等级的1倍）。"},{"n":"姜子牙","q":5,"c":"无阵营","r":"功能","sn":"天人法则","sd":"姜子牙变为天人形态，获得免控并朝最远的敌方汇聚天地能量2秒，发射1道冲击波对路径上的敌人造成80+80%法术攻击力的法术伤害。同一单位被多道冲击波命中时，伤害每次衰减15%，至多60%。","pd":"你每次使用不在场的阵营以及无阵营的英雄牌时，姜子牙和随机3名其他不同阵营的英雄等级+1。"},{"n":"武则天","q":5,"c":"河洛","r":"功能","sn":"君命无二","sd":"武则天以女帝权威施行制裁，持续吟唱8秒，每隔0.75秒随机选择1名敌人，在其脚下召唤法阵并引爆，命中时造成100+75%法术攻击力的法术伤害，并使其生命恢复效果降低50%，持续6秒（不可叠加）。法阵在3秒内连续命中相同敌人时，伤害将衰减15%，最多45%。","pd":"古币牌提升的等级+1。 登场：获得1张精致古币。"},{"n":"吕布","q":5,"c":"三分之地","r":"输出","sn":"魔神降世","sd":"被动：吕布的普通攻击能对身前敌人造成范围伤害。 主动：吕布跃入敌人密集区域，将2格内敌人击飞1秒并造成120+120%物理攻击力的物理伤害，降低其70%生命恢复效果，持续5秒。每命中1名敌人恢复5%最大生命值并在接下来的5秒内提升20%物理吸血。","pd":"开团：等级最高的3名【三分】英雄获得20%物理和法术吸血，若目标为吕布，效果翻倍。"},{"n":"海月","q":5,"c":"无阵营","r":"前排","sn":"流光","sd":"被动：海月的生命恢复效果大幅降低，但获得护盾时会转化30%护盾值为最大生命值。 主动：海月发出3枚琉璃法球，第1枚对目标敌人造成100+150%法术攻击力的法术伤害。随后2枚对附近敌人造成的伤害减半。","pd":"牺牲：将敌方等级最高的英雄困入水月幻境控制4秒，并造成等同于海月生命值的真实伤害。"},{"n":"鲁班七号","q":5,"c":"逐鹿","r":"输出","sn":"火力压制","sd":"鲁班七号呼唤河豚飞艇朝战场投掷4枚炸弹。炸弹对命中敌人造成50+80%物理攻击力的物理伤害并留下弹坑。弹坑中的敌人每秒受到80%物理攻击力的物理伤害，并降低70%生命恢复效果，持续4秒，效果不可叠加。","pd":"你的英雄每合成3次，随机获得1张战术牌。"},{"n":"海诺","q":5,"c":"日落海","r":"功能","sn":"追芒","sd":"海诺朝目标方向掷出能量化的命运神杖，对命中的敌人造成100+150%法术攻击力的法术伤害并朝目标敌人附近2名敌人掷出子杖，造成50+100%法术攻击力的法术伤害。","pd":"每当阿科米亚核心等级提升时，核心等级额外+1。"},{"n":"露娜","q":5,"c":"日落海","r":"功能","sn":"新月突击","sd":"露娜用月光标记最远端的敌人并向其突击（期间不可选中），对路径上所有敌人造成100+100%法术攻击力的法术伤害，同时消耗标记额外造成目标敌人15%最大生命值的法术伤害。","pd":"闪现 登场：阿科米亚核心等级+2，并且随机触发2名英雄的整备效果。"},{"n":"杨玉环","q":5,"c":"无阵营","r":"功能","sn":"惊鸿调","sd":"杨玉环弹奏琵琶，循环激活以下乐曲效果之一： 清平：为3名血量最低的友军恢复100+80%法术攻击力的生命值。 破阵：对当前血量百分比最高的3名敌人造成100+80%法术攻击力的法术伤害。","pd":"杨玉环在场时，每过3个回合获得1张弦音。 退场：获得1张弦音。"},{"n":"周瑜","q":5,"c":"三分之地","r":"前排","sn":"烽火赤壁","sd":"周瑜召唤火焰，对周围2格范围内敌人造成100+50%法术攻击力的法术伤害并恢复自身100+50%法术攻击力生命值，同时会留下   const ch=H[coreName];
  let pool;
  if(ch&&ch.r==="前排")pool=DB.equips.filter(e=>e.cls==="普通装备"&&e.k==="防御");
  else pool=DB.equips.filter(e=>e.cls==="普通装备"&&(e.k==="物理"||e.k==="法术"));
  if(!pool.length)pool=DB.equips.filter(e=>e.cls==="普通装备");
  const eqs=[];
  while(eqs.length<3&&pool.length){const e=pick(pool);if(!eqs.includes(e.n))eqs.push(e.n)}
  const talent=pick(DB.talentsInit);
  const luck=Math.floor(62+Math.random()*38);
  const camp=c.camps.length?c.camps[0]:(H[c.heroes[0]]?H[c.heroes[0]].c:"");
  const player=pick(DB.players);
  const stamp=luck>=95?"天选之人":luck>=88?"官方认证":luck>=78?"偷偷开挂":"轻度魔改";
  return `<div class="cheat">
  <div class="stamp">${stamp}</div>
  <h3>🃏 ${esc(c.name)}</h3>
  <div class="row"><div class="lbl">主打阵营 · 核心</div>
    ${(c.camps.length?c.camps:[camp]).filter(Boolean).map(x=>`<span class="tag" style="background:${campcol(x)}">${esc(x)}</span>`).join("")}
    <span style="color:var(--sub);font-size:12px">${c.timing?esc(c.timing):""}${c.label?" · "+esc(c.label):""}</span></div>
  <div class="row"><div class="lbl">本局天选棋手</div>🧙 <b>${esc(player.n)}</b> —— ${esc(player.skill.t||"")}：${esc(player.skill.d||"")}<div style="color:var(--sub);font-size:12px;font-style:italic">「${esc(player.line)}」</div></div>
  <div class="row"><div class="lbl">开挂首发（★=核心）</div>${c.heroes.map(n=>mchip(n,(c.core||[]).includes(n))).join("")}</div>
  <div class="row"><div class="lbl">外挂C位</div>🎯 <span class="core">${esc(coreName)}</span>${ch?`　<span style="color:var(--sub);font-size:12px">${esc(ch.c)}·${esc(ch.r)}｜技能「${esc(ch.sn)}」${esc(ch.sd.slice(0,60))}…</span>`:""}</div>
  <div class="row"><div class="lbl">C位神装推荐</div>📦 ${eqs.map(e=>`<span class="badge">${esc(e)}</span>`).join("")}</div>
  <div class="row"><div class="lbl">开局天赋外挂</div>🧬 <b>${esc(talent.n)}</b> <span style="color:var(--sub);font-size:12px">${esc(talent.d)}</span></div>
  <div class="row"><div class="lbl">开挂浓度</div><div class="bar"><i style="width:0%" id="luckbar"></i></div>
    <span style="font-size:12px;color:var(--sub)">${luck}% ${luck>=95?"· 建议低调，容易被当成代打":""}</span></div>
  <div class="quote">😎 ${pick(QUOTES)}</div>
  <button class="copybtn" onclick="copyCheat()">📋 复制这挂，发给队友</button>
  </div>`;
}
let lastCheatText="";
function copyCheat(){
  const el=document.querySelector("#cheatResult .cheat");
  if(!el)return;
  const txt="🀄 万象棋作弊器 · 本局外挂：\n"+el.innerText.replace(/\n{2,}/g,"\n");
  const done=()=>{const b=document.querySelector(".copybtn");if(b){b.textContent="✅ 已复制，去粘贴吧";setTimeout(()=>b.textContent="📋 复制这挂，发给队友",1600)}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done))}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta);done()}

const ST={camp:"",label:"",q:""};
const CAMPS=["全部","河洛","逐鹿","日落海","三分之地","大河流域","无阵营"];
const LABELS=["全部",...Array.from(new Set(DB.comps.map(c=>c.label).filter(Boolean)))];
function chips(el,items,key){
  el.innerHTML=items.map(x=>`<button class="chip${(ST[key]===""&&x==="全部")||ST[key]===x?" on":""}" data-v="${x==="全部"?"":x}">${x}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ST[key]=b.dataset.v;chips(document.getElementById("campF"),CAMPS,"camp");chips(document.getElementById("labelF"),LABELS,"label");renderComps()});
}
chips(document.getElementById("campF"),CAMPS,"camp");
chips(document.getElementById("labelF"),LABELS,"label");
document.getElementById("q").oninput=e=>{ST.q=e.target.value.trim();renderComps()};

function renderComps(){
  const g=document.getElementById("compsGrid");
  const list=DB.comps.filter(c=>{
    if(ST.camp&&!c.camps.includes(ST.camp))return false;
    if(ST.label&&c.label!==ST.label)return false;
    if(ST.q&&!(c.name.includes(ST.q)||c.heroes.some(h=>h.includes(ST.q))||c.core.some(h=>h.includes(ST.q))))return false;
    return true;
  });
  if(!list.length){g.innerHTML='<div class="empty">🫥 没有符合条件的阵容，换个条件试试</div>';return}
  g.innerHTML=list.map((c,idx)=>`<div class="card">
    <div style="font-size:16px;font-weight:700">${esc(c.name)}</div>
    <div style="margin:6px 0 2px">${c.camps.map(x=>`<span class="tag" style="background:${campcol(x)}">${esc(x)}</span>`).join("")}${c.player?`<span class="badge">🧙 ${esc(c.player)}</span>`:""}${c.label?`<span class="badge">${esc(c.label)}</span>`:""}${c.timing?`<span class="badge">${esc(c.timing)}</span>`:""}</div>
    ${c.desc?`<div style="font-size:12px;color:var(--sub)">${esc(c.desc)}</div>`:""}
    <div style="margin-top:4px">${c.heroes.map(n=>mchip(n,(c.core||[]).includes(n))).join("")}</div>
    ${c.stages.length?`<button class="chip" style="margin-top:8px" onclick="toggleDetail(${DB.comps.indexOf(c)},this)">🧩 看站位与思路</button>`:""}
    <div class="detail" style="display:none"></div>
  </div>`).join("");
}
function toggleDetail(i,btn){
  const card=btn.closest(".card");const d=card.querySelector(".detail");
  if(d.style.display!=="none"){d.style.display="none";btn.textContent="🧩 看站位与思路";return}
  const c=DB.comps[i];
  let html="";
  if(c.stages.length){
    html+=`<div class="sttabs">${c.stages.map((s,j)=>`<button class="${j===0?"on":""}" onclick="showStage(${i},${j},this)">${esc(s.label)}</button>`).join("")}</div>`;
    html+=`<div class="stagebox">${stageHTML(c,0)}</div>`;
  }
  if(c.idea)html+=`<div class="idea">💡 ${esc(c.idea)}</div>`;
  d.innerHTML=html;d.style.display="block";btn.textContent="🙈 收起站位";
}
function showStage(i,j,btn){
  const c=DB.comps[i];
  btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===btn));
  btn.closest(".detail").querySelector(".stagebox").innerHTML=stageHTML(c,j);
}
function stageHTML(c,j){
  const s=c.stages[j];if(!s)return "";
  const pos={};s.units.forEach(u=>{if(u.c&&u.c.length>=2)pos[u.c.toUpperCase()]=u});
  let cells="";
  for(let r=1;r<=4;r++)for(let ci=0;ci<7;ci++){
    const key="ABCDEFG"[ci]+r;const u=pos[key];const h=u?H[u.h]:null;
    if(u)cells+=`<div class="cell f${u.a?" aw":""}" style="background:${qcol(h?h.q:1)}" title="${u.e?("装备："+u.e.join("、")):""}${u.t?(" 天赋："+u.t.join("、")):""}">${esc(u.h)}</div>`;
    else cells+=`<div class="cell e"></div>`;
  }
  const eqs=s.units.filter(u=>u.e.length).map(u=>`<b>${esc(u.h)}</b>：${u.e.map(esc).join(" · ")}`).join("<br>");
  const tls=s.units.filter(u=>u.t&&u.t.length).map(u=>`<b>${esc(u.h)}</b> 天赋：${u.t.map(esc).join(" · ")}`).join("<br>");
  return `<div class="board">${cells}</div>${eqs?`<div class="eqrow">📦 ${eqs}</div>`:""}${tls?`<div class="eqrow">🧬 ${tls}</div>`:""}${s.note?`<div class="idea">${esc(s.note)}</div>`:""}`;
}
renderComps();

document.getElementById("playersGrid").innerHTML=DB.players.map(p=>`<div class="card pcard">
  <h3>🧙 ${esc(p.n)}</h3><div class="line">「${esc(p.line)}」</div>
  <div class="pskill"><b>${esc(p.skill.t||"")}</b><br>${esc(p.skill.d||"")}</div>
  <div class="pskill"><b>${esc(p.miji.t||"")}</b><br>${esc(p.miji.d||"")}</div>
  ${p.exclusive&&p.exclusive.t?`<div class="pskill" style="color:var(--sub)"><b style="color:var(--gold)">专属 · ${esc(p.exclusive.t)}</b><br>${esc(p.exclusive.d||"")}</div>`:""}
</div>`).join("");

const CATC={"英雄":"#d1495b","装备":"#c9962e","天赋":"#a05ae0","效果牌":"#3f9fb0","机制":"#4fae6d"};
function renderTips(focus){
  const box=document.getElementById("tipsBox");
  const cats=["英雄","装备","天赋","效果牌","机制"];
  let html="";
  cats.forEach(cat=>{
    const ts=DB.tips.filter(t=>t.cat===cat);
    html+=`<div class="tcat"><span class="tag" style="background:${CATC[cat]||"#98917f"}">${cat}</span> ${ts.length} 条</div>`;
    html+=ts.map((t,k)=>`<div class="card tip${focus&&focus.cat===cat&&focus.i===k?" hi":""}" id="tip-${cat}-${k}"><b>${esc(t.title)}</b><p>${esc(t.text)}</p></div>`).join("");
  });
  box.innerHTML=html;
}
renderTips();
document.getElementById("tipRnd").onclick=()=>{
  const t=pick(DB.tips);
  document.querySelectorAll("#tab-tips .card").forEach(x=>x.style.background="");
  const idx=DB.tips.indexOf(t);
  const same=DB.tips.filter(x=>x.cat===t.cat);
  const ki=same.indexOf(t);
  const el=document.getElementById("tip-"+t.cat+"-"+ki);
  if(el){el.style.background="#fbf0d0";el.scrollIntoView({behavior:"smooth",block:"center"})}
};
</script>
