<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

}
body{
  min-height:100vh; color:var(--ink);

  padding:34px 20px 70px;
}
.wrap{max-width:1240px;margin:0 auto}
header{text-align:center;margin-bottom:26px}
h1{font-size:29px;letter-spacing:.5px;font-weight:800}
h1 .dot{color:var(--rose)}
.sub{margin-top:9px;color:var(--sub);font-size:13.5px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.stat{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:13px;
  padding:8px 15px;font-size:12.5px;color:var(--sub);backdrop-filter:blur(10px)}
.stat b{color:var(--ink);font-size:15px;margin-right:3px}

.tools{position:sticky;top:0;z-index:20;padding:14px 0 12px;margin-bottom:6px;
  background:linear-gradient(180deg,rgba(255,250,252,.94),rgba(255,250,252,.78),transparent)}
.search{width:100%;padding:14px 18px;font-size:15px;color:var(--ink);
  background:rgba(255,255,255,.9);border:1.5px solid var(--line);border-radius:15px;
  outline:none;transition:.2s;box-shadow:0 6px 22px rgba(190,160,185,.13)}
.search:focus{border-color:var(--rose);box-shadow:0 8px 26px rgba(247,168,196,.28)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{cursor:pointer;user-select:none;font-size:13px;padding:7px 14px;border-radius:20px;
  border:1.5px solid var(--line);background:rgba(255,255,255,.78);color:var(--sub);transition:.18s}
.chip:hover{transform:translateY(-1px);color:var(--ink)}
.chip.on{color:#fff;border-color:transparent;font-weight:600}
.chip .n{opacity:.72;font-size:11.5px;margin-left:5px}

.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));margin-top:20px}
.card{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit;
  transition:transform .18s,box-shadow .18s,border-color .18s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(190,160,185,.20);border-color:rgba(247,168,196,.5)}
.ava{flex:0 0 38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px}
.meta{min-width:0;flex:1}
.tit{font-size:13.6px;font-weight:600;line-height:1.42;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dom{margin-top:4px;font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.045)}
.badge{position:absolute;top:9px;right:10px;font-size:10px;color:#fff;background:var(--rose);
  padding:1px 6px;border-radius:8px;font-weight:700}
.empty{text-align:center;color:var(--sub);padding:70px 0;font-size:14px;display:none}
footer{text-align:center;margin-top:46px;color:var(--sub);font-size:12px;line-height:1.9}
footer .warn{color:#c96b7f}

.privbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px auto 0;
  max-width:430px;padding:11px 16px;border-radius:14px;font-size:13px;
  background:rgba(107,91,115,.08);border:1px dashed rgba(107,91,115,.35);color:#6b5b73}
.privbar button{cursor:pointer;font:inherit;font-size:12.5px;padding:6px 14px;border-radius:10px;
  border:none;background:#6b5b73;color:#fff;transition:.18s}
.privbar button:hover{opacity:.86}
body:not(.show-priv) .card.priv .tit,
body:not(.show-priv) .card.priv .dom{filter:blur(6.5px);user-select:none}
body:not(.show-priv) .card.priv .ava{filter:blur(3px)}
.card.priv{border-color:rgba(107,91,115,.22)}
@media(max-width:520px){
  body{padding:22px 13px 50px}
  h1{font-size:23px}
  .grid{grid-template-columns:1fr}
}
</style>

const CMAP = {};
CATS.forEach(c => CMAP[c[0]] = { name: c[1], icon: c[2], color: c[3], n: c[4] });

const PALETTE = ['#f7a8c4','#8fd3a8','#c3a6f0','#7ec8e3','#f5c26b','#f08a8a','#e8a87c','#9bb7d4','#b8a6c9','#a3c9a8'];

function hash(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}
function color(host){ return PALETTE[hash(host) % PALETTE.length]; }
function initial(host){
  const s = host.replace(/^www\./, '');
  return (s[0] || '?').toUpperCase();
}

const grid = document.getElementById('grid');
const chips = document.getElementById('chips');
const empty = document.getElementById('empty');
const q = document.getElementById('q');
let cur = 'all';

function buildChips(){
  const all = document.createElement('div');
  all.className = 'chip on';
  all.dataset.c = 'all';
  all.innerHTML = '全部<span class="n">' + DATA.length + '</span>';
  all.style.background = '#f7a8c4';
  chips.appendChild(all);
  CATS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'chip';
    el.dataset.c = c[0];
    el.innerHTML = c[2] + ' ' + c[1] + '<span class="n">' + c[4] + '</span>';
    chips.appendChild(el);
  });
  chips.addEventListener('click', e => {
    const t = e.target.closest('.chip');
    if (!t) return;
    cur = t.dataset.c;
    [...chips.children].forEach(x => {
      x.classList.toggle('on', x === t);
      x.style.background = (x === t) ? (CMAP[x.dataset.c] ? CMAP[x.dataset.c].color : '#f7a8c4') : '';
      x.style.color = (x === t) ? '#fff' : '';
    });
    render();
  });
  chips.children[0].style.color = '#fff';
}

function render(){
  const kw = q.value.trim().toLowerCase();
  const frag = document.createDocumentFragment();
  let n = 0;
  for (const it of DATA){
    if (cur !== 'all' && it.c !== cur) continue;
    if (kw && !(it.t.toLowerCase().includes(kw) || it.u.toLowerCase().includes(kw) || it.h.includes(kw))) continue;
    n++;
    const a = document.createElement('a');
    a.className = 'card' + (it.c === 'private' ? ' priv' : '');
    a.href = it.u;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = it.t + '\n' + it.u + '\n来自：' + it.f;
    const c = CMAP[it.c];
    a.innerHTML =
      '<div class="ava" style="background:' + color(it.h) + '">' + initial(it.h) + '</div>' +
      '<div class="meta">' +
        '<div class="tit">' + escapeHtml(it.t || it.h) + '</div>' +
        '<div class="dom">' +
          '<span>' + escapeHtml(it.h) + '</span>' +
          '<span class="tag" style="color:' + c.color + '">' + c.icon + ' ' + c.name + '</span>' +
        '</div>' +
      '</div>' +
      (it.dup > 1 ? '<span class="badge">×' + it.dup + '</span>' : '');
    frag.appendChild(a);
  }
  grid.innerHTML = '';
  grid.appendChild(frag);
  empty.style.display = n ? 'none' : 'block';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

buildChips();
render();
