<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>花瓣粒子海报</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #fff4f8; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  .bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 999px; max-width: calc(100vw - 24px);
    background: rgba(255,255,255,.66); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); box-shadow: 0 10px 34px rgba(180,120,160,.22),
    inset 0 0 0 1px rgba(255,255,255,.8); z-index: 5; }
  .bar input { border: 0; outline: 0; background: transparent; width: 8.5em; min-width: 6em;
    font-size: 15px; font-weight: 700; color: #a5477a; text-align: center; letter-spacing: .06em; }
  .bar input::placeholder { color: #d9a8c4; font-weight: 500; }
  .swatches { display: flex; gap: 7px; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(150,100,140,.28); transition: transform .15s, box-shadow .15s; }
  .swatch:hover { transform: scale(1.16); }
  .swatch.on { outline: 2px solid rgba(165,71,122,.55); outline-offset: 1px; }
  .btn { border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; color: #fff;
    padding: 7px 15px; border-radius: 999px; background: linear-gradient(135deg,#ff8fbf,#c47bff);
    box-shadow: 0 6px 16px rgba(196,123,255,.34); transition: transform .15s, filter .15s; white-space: nowrap; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn:active { transform: translateY(0) scale(.97); }
  .hint { position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
    font-size: 12.5px; color: rgba(140,90,120,.55); letter-spacing: .1em; pointer-events: none;
    user-select: none; z-index: 4; }
  @media (max-width: 520px) {
    .bar { bottom: 14px; gap: 8px; padding: 9px 12px; }
    .bar input { font-size: 14px; width: 7em; }
    .swatch { width: 18px; height: 18px; }
    .btn { font-size: 13px; padding: 6px 12px; }
    .hint { font-size: 11px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">移动鼠标拂过花瓣 · 点一下会炸开</div>
<div class="bar">
  <input id="txt" value="有花无实" maxlength="12" placeholder="打字…" spellcheck="false">
  <div class="swatches" id="sw"></div>
  <button class="btn" id="save">导出海报</button>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var txt = document.getElementById('txt');
  var swBox = document.getElementById('sw');

  var W = 0, H = 0, DPR = 1, bgGrad = null;
  var text = txt.value || '有花无实';
  var paletteKey = 'sakura';
  var particles = [], texPool = [];

  // 四套配色：背景渐变 + 花瓣颜色
  var PALETTES = {
    sakura: { cn: '樱花', bg: ['#fff5f9', '#ffe8f2', '#f7ecff'],
              colors: ['#ff8fbf', '#ffa7cd', '#ff6fa8', '#ffc2da'] },
    violet: { cn: '紫罗兰', bg: ['#f9f4ff', '#eee2ff', '#f4ecff'],
              colors: ['#a97fff', '#c2a1ff', '#8f5cff', '#d9c2ff'] },
    mint:   { cn: '薄荷', bg: ['#f1fffb', '#e3fbf4', '#eef8ff'],
              colors: ['#5fc9c0', '#7fded4', '#48b3ab', '#a8ead0'] },
    honey:  { cn: '蜜金', bg: ['#fffaf1', '#fff1d8', '#fff8ec'],
              colors: ['#ffb84d', '#ffcf7a', '#ff9f1c', '#ffe1a8'] }
  };

  var mouse = { x: -9e5, y: -9e5, tx: -9e5, ty: -9e5 };

  // 颜色加深/变浅，用来做花瓣渐变
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = ((n >> 16) & 255) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
    r = r < 0 ? 0 : r > 255 ? 255 : r;
    g = g < 0 ? 0 : g > 255 ? 255 : g;
    b = b < 0 ? 0 : b > 255 ? 255 : b;
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }

  // 把一片花瓣画成一张小贴图（水滴形 + 渐变 + 中脉 + 高光）
  function makePetalTex(color) {
    var S = 40, c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    g.translate(S / 2, S / 2);

    var grad = g.createLinearGradient(0, -S / 2, 0, S / 2);
    grad.addColorStop(0, shade(color, 26));
    grad.addColorStop(0.55, color);
    grad.addColorStop(1, shade(color, -26));
    g.fillStyle = grad;

    g.beginPath();
    g.moveTo(0, -S * 0.40);
    g.bezierCurveTo(S * 0.34, -S * 0.22, S * 0.30, S * 0.22, 0, S * 0.42);
    g.bezierCurveTo(-S * 0.30, S * 0.22, -S * 0.34, -S * 0.22, 0, -S * 0.40);
    g.closePath();
    g.fill();

    // 中脉
    g.strokeStyle = 'rgba(255,255,255,.55)';
    g.lineWidth = 1.1;
    g.beginPath();
    g.moveTo(0, -S * 0.32);
    g.lineTo(0, S * 0.34);
    g.stroke();

    // 左上高光
    g.fillStyle = 'rgba(255,255,255,.42)';
    g.beginPath();
    g.ellipse(-S * 0.09, -S * 0.14, S * 0.07, S * 0.12, -0.5, 0, Math.PI * 2);
    g.fill();
    return c;
  }

  function makeTexPool() {
    var cols = PALETTES[paletteKey].colors;
    texPool = [];
    for (var i = 0; i < cols.length; i++) texPool.push(makePetalTex(cols[i]));
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    bgGrad = ctx.createLinearGradient(0, 0, W * 0.35, H);
    var bg = PALETTES[paletteKey].bg;
    bgGrad.addColorStop(0, bg[0]);
    bgGrad.addColorStop(0.5, bg[1]);
    bgGrad.addColorStop(1, bg[2]);
    build();
  }

  // 把文字采样成粒子（每个不透明像素点 -> 一片花瓣）
  function build() {
    var off = document.createElement('canvas');
    off.width = W; off.height = H;
    var oc = off.getContext('2d');

    var fontOf = function (s) { return '800 ' + s + 'px "PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif'; };
    var maxW = W * 0.84;
    var baseFs = Math.min(H * 0.40, 420);
    var fs = baseFs, lines;

    // 先试一行：能放下、字又不太小，就一行
    oc.font = fontOf(fs);
    while (oc.measureText(text).width > maxW && fs > 40) { fs *= 0.94; oc.font = fontOf(fs); }
    if (oc.measureText(text).width <= maxW && fs >= 112) {
      lines = [text];
    } else {
      // 否则换行（先均分 2 行，还挤就 3 行），字跟着放大
      var n = 2;
      fs = baseFs;
      for (var attempt = 0; attempt < 22; attempt++) {
        var per = Math.ceil(text.length / n);
        lines = [];
        for (var i2 = 0; i2 < text.length; i2 += per) lines.push(text.slice(i2, i2 + per));
        oc.font = fontOf(fs);
        var widest = 0;
        for (var j2 = 0; j2 < lines.length; j2++) widest = Math.max(widest, oc.measureText(lines[j2]).width);
        if (widest <= maxW && lines.length * fs * 1.14 <= H * 0.70) break;
        fs *= 0.90;
        if (fs < 42) { n = 3; fs = baseFs * 0.42; }
      }
    }
    oc.font = fontOf(fs);
    oc.textAlign = 'center';
    oc.textBaseline = 'middle';
    oc.fillStyle = '#000';
    var blockH = lines.length * fs * 1.14;
    var y0 = H / 2 - blockH / 2 + fs * 0.57;
    for (var k2 = 0; k2 < lines.length; k2++) oc.fillText(lines[k2], W / 2, y0 + k2 * 1.14 * fs);

    var data = oc.getImageData(0, 0, W, H).data;
    var gap = Math.max(3, Math.round(fs / 32));
    var list = [];
    for (var y = 0; y < H; y += gap) {
      for (var x = 0; x < W; x += gap) {
        if (data[(y * W + x) * 4 + 3] > 128) {
          list.push([x, y, gap]);
        }
      }
    }
    // 粒子太多就抽稀，保住帧率
    var MAXP = 6500;
    if (list.length > MAXP) {
      var keep = [];
      var step = list.length / MAXP;
      for (var i = 0; i < list.length; i += step) keep.push(list[i | 0]);
      list = keep;
    }

    particles = [];
    for (var k = 0; k < list.length; k++) {
      var pt = list[k];
      particles.push({
        x: pt[0] + (Math.random() - 0.5) * 110,
        y: pt[1] + (Math.random() - 0.5) * 110,
        hx: pt[0], hy: pt[1],
        vx: 0, vy: 0,
        size: pt[2] * (1.95 + Math.random() * 0.7),
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.09,
        phase: Math.random() * Math.PI * 2,
        sway: 1.4 + Math.random() * 2.6,
        tex: texPool[(Math.random() * texPool.length) | 0]
      });
    }
  }

  // 点一下：附近花瓣被炸开
  function burst(x, y) {
    var R = Math.max(120, Math.min(W, H) * 0.28), R2 = R * R;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var dx = p.x - x, dy = p.y - y, d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        var d = Math.sqrt(d2) || 1, f = 1 - d / R;
        var kick = f * f * 34;
        p.vx += dx / d * kick;
        p.vy += dy / d * kick;
      }
    }
  }

  function frame(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    mouse.x += (mouse.tx - mouse.x) * 0.2;
    mouse.y += (mouse.ty - mouse.y) * 0.2;

    var R = Math.max(85, Math.min(W, H) * 0.17), R2 = R * R;
    var mx = mouse.x, my = mouse.y;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      // 鼠标排斥
      var dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        var d = Math.sqrt(d2) || 1, f = 1 - d / R;
        var push = f * f * 15;
        p.vx += dx / d * push;
        p.vy += dy / d * push;
      }

      // 轻柔飘动 + 弹回原位
      var tx = p.hx + Math.sin(t * 0.0012 + p.phase) * p.sway;
      var ty = p.hy + Math.cos(t * 0.0016 + p.phase * 1.3) * p.sway;
      p.vx += (tx - p.x) * 0.045;
      p.vy += (ty - p.y) * 0.045;
      p.vx *= 0.90;
      p.vy *= 0.90;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;

      var co = Math.cos(p.rot) * DPR, si = Math.sin(p.rot) * DPR;
      ctx.setTransform(co, si, -si, co, p.x * DPR, p.y * DPR);
      ctx.drawImage(p.tex, -p.size / 2, -p.size / 2, p.size, p.size);
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    requestAnimationFrame(frame);
  }

  // 配色圆点
  (function initSwatches() {
    var keys = Object.keys(PALETTES);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var b = document.createElement('div');
      b.className = 'swatch' + (k === paletteKey ? ' on' : '');
      b.title = PALETTES[k].cn;
      b.style.background = 'linear-gradient(135deg,' + PALETTES[k].colors[0] + ',' + PALETTES[k].colors[2] + ')';
      b.dataset.k = k;
      b.addEventListener('click', function (e) {
        paletteKey = e.currentTarget.dataset.k;
        var all = swBox.querySelectorAll('.swatch');
        for (var j = 0; j < all.length; j++) all[j].classList.toggle('on', all[j] === e.currentTarget);
        bgGrad = ctx.createLinearGradient(0, 0, W * 0.35, H);
        var bg = PALETTES[paletteKey].bg;
        bgGrad.addColorStop(0, bg[0]);
        bgGrad.addColorStop(0.5, bg[1]);
        bgGrad.addColorStop(1, bg[2]);
        makeTexPool();
        build();
      });
      swBox.appendChild(b);
    }
  })();

  // 交互
  cv.addEventListener('pointermove', function (e) {
    mouse.tx = e.clientX; mouse.ty = e.clientY;
    if (mouse.x < -1e4) { mouse.x = e.clientX; mouse.y = e.clientY; }
  });
  cv.addEventListener('pointerdown', function (e) {
    mouse.tx = e.clientX; mouse.ty = e.clientY;
    if (mouse.x < -1e4) { mouse.x = e.clientX; mouse.y = e.clientY; }
    burst(e.clientX, e.clientY);
  });
  cv.addEventListener('pointerleave', function () { mouse.tx = -9e5; mouse.ty = -9e5; });

  txt.addEventListener('input', function () {
    text = txt.value.trim() || '有花无实';
    build();
  });

  document.getElementById('save').addEventListener('click', function () {
    var a = document.createElement('a');
    a.download = '花瓣海报-' + text + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  });

  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(resize, 180);
  });

  makeTexPool();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
