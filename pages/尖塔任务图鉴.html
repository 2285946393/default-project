 张攻击牌", "target": "4", "gold": "0", "reward": "CardRare", "card": "", "char": "", "meme": "「小孩子才做选择，我全都要」——攻击牌也不例外"}, {"kind": "CardsAddedSkill", "title": "我全都要·技", "desc": "往卡组加入 4 张技能牌", "target": "4", "gold": "0", "reward": "CardPower", "card": "", "char": "", "meme": "同上，技能牌那一份"}, {"kind": "CardsAddedPower", "title": "我全都要·能", "desc": "往卡组加入 4 张能力牌", "target": "4", "gold": "0", "reward": "CardAny", "card": "", "char": "", "meme": "同上，能力牌那一份"}, {"kind": "WorkerCards", "title": "打工人", "desc": "本局打出 60 张「打击 / 防御」这类起始牌", "target": "60", "gold": "100", "reward": "Gold", "card": "", "char": "", "meme": "打工人的一天从打卡开始"}, {"kind": "MokugyoSkills", "title": "电子木鱼", "desc": "本局打出 50 张技能牌", "target": "50", "gold": "100", "reward": "CardAny", "card": "", "char": "", "meme": "赛博功德：敲一下积一点，敲够五十下也算修行"}, {"kind": "RetreatBlock", "title": "退退退", "desc": "接下后，接下来 2 场战斗不能打出攻击牌；赢下 2 场", "target": "2", "gold": "100", "reward": "CardRare", "card": "", "char": "", "meme": "网络热梗，遇事不决先喊一嗓子把人劝退"}, {"kind": "SlackOff", "title": "摸鱼", "desc": "接下后，接下来 2 场战斗的前 2 回合不能出牌；赢下 2 场", "target": "2", "gold": "100", "reward": "CardPower", "card": "", "char": "", "meme": "上班/上学的第一生产力"}, {"kind": "NakedRun", "title": "裸装", "desc": "接下后，接下来 3 场战斗不能打出能力牌；赢下 3 场", "target": "3", "gold": "100", "reward": "Relic", "card": "", "char": "", "meme": "什么遗物都不依赖，纯靠本事打"}, {"kind": "SanheGod", "title": "三和大神", "desc": "一局里在篝火休息 3 次，且一次铁都没打", "target": "1", "gold": "100", "reward": "Relic", "card": "", "char": "", "meme": "「干一天玩三天」——在篝火躺着回血，一把铁都不打"}, {"kind": "FamilyBucket", "title": "全家桶", "desc": "牌组里同时有 6 张攻击、6 张技能、6 张能力", "target": "1", "gold": "100", "reward": "CardPower", "card": "", "char": "", "meme": "该有的全都要，一样不落"}, {"kind": "FirstTurnKill", "title": "一发入魂", "desc": "第一个回合就把这场战斗打完", "target": "1", "gold": "100", "reward": "CardRare", "card": "", "char": "", "meme": "网络语：一击就中，一次就爽"}, {"kind": "SpeedContract", "title": "限时特惠", "desc": "接下后，接下来 3 场都得在 3 回合内打赢", "target": "3", "gold": "100", "reward": "Relic", "card": "", "char": "", "meme": "促销话术——过期不候"}, {"kind": "EliteSpeedKill", "title": "落地成盒", "desc": "3 回合内打赢一场精英战", "target": "1", "gold": "250", "reward": "Gold", "card": "", "char": "", "meme": "网络语：刚落地就没了（这里是速通）"}, {"kind": "MinimalDeck", "title": "极简主义", "desc": "牌组不超过 10 张的时候赢下一场战斗", "target": "1", "gold": "100", "reward": "RemoveCard", "card": "", "char": "", "meme": "越少越好，卡组越薄越强"}, {"kind": "ZeroCostDeck", "title": "斗地主附体", "desc": "牌组里有 8 张 0 费牌", "target": "8", "gold": "100", "reward": "CardRare", "card": "", "char": "", "meme": "玩《斗地主》的梗——手里全是小牌才最舒服（0 费牌）"}, {"kind": "DiscardInCombat", "title": "羊关通关", "desc": "单场战斗里弃掉 25 张牌", "target": "25", "gold": "100", "reward": "CardAny", "card": "", "char": "", "meme": "一路弃牌不停手，牌堆清清爽爽"}, {"kind": "RainbowDeck", "title": "国际纵队", "desc": "牌组里有 4 张别的职业的牌", "target": "4", "gold": "100", "reward": "CardSkill", "card": "", "char": "", "meme": "老词：各国人凑一队（这里是各职业的牌凑一副）"}, {"kind": "PurgeMaster", "title": "清仓大甩卖", "desc": "本局一共删掉 6 张牌", "target": "6", "gold": "100", "reward": "RemoveCard", "card": "", "char": "", "meme": "促销话术——全部下架，一张不留"}];
const REW = {"Gold": "金币", "Relic": "遗物", "CardAny": "任意牌", "CardSkill": "技能牌", "CardPower": "能力牌", "CardRare": "稀有牌", "CardOtherClass": "别职业牌", "Upgrade": "升级卡", "Transform": "变化卡", "CardNamed": "指定核心牌", "Enchant": "附魔"};
const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const qEl = document.getElementById('q');
let filter = 'all';

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const q = qEl.value.trim().toLowerCase();
  let n = 0;
  const out = [];
  for (let i = 0; i < QUESTS.length; i++){
    const it = QUESTS[i];
    if (filter === 'meme' && !it.meme) continue;
    if (filter === 'special' && it.reward === 'Gold') continue;
    if (filter === 'gold' && it.reward !== 'Gold') continue;
    if (q){
      const hay = (it.title + ' ' + it.desc + ' ' + (it.meme||'') + ' ' + it.kind).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    n++;
    const gold = it.gold && it.gold !== '0' ? `<span class="tag gold">金币 +${esc(it.gold)}</span>` : '';
    const rew = it.reward !== 'Gold' ? `<span class="tag special">${esc(REW[it.reward] || it.reward)}</span>` : '';
    const ch = it.char ? `<span class="tag char">${esc(it.char)}</span>` : '';
    const meme = it.meme ? `<div class="meme">💡 ${esc(it.meme)}</div>` : '';
    out.push(`<div class="card${it.meme ? ' has-meme' : ''}">
      <div class="no">#${i + 1}</div>
      <div class="title">${esc(it.title)}</div>
      ${meme}
      <div class="desc">${esc(it.desc)}</div>
      <div class="foot">${gold}${rew}${ch}</div>
    </div>`);
  }
  grid.innerHTML = out.join('');
  emptyEl.style.display = n ? 'none' : 'block';
}

document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  filter = b.dataset.f;
  render();
}));
qEl.addEventListener('input', render);
render();
</script>
