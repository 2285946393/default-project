services:
  clodesen2api:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: clodesen2api:latest
    container_name: clodesen2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:8080"
    volumes:
      # 挂载整个 config 目录（可写）：config.toml 及同目录的
      # password.json / key.json 均位于 /config/ 下，需可写
      - ./config:/config
    environment:
      TZ: Asia/Shanghai
    init: true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
