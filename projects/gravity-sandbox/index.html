<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#05070c" />
<title>引力沙盒 · Gravity Sandbox</title>
<!--
  引力沙盒 Gravity Sandbox（中文单文件离线版）
  基于牛顿引力 N-body 物理，参考 Genicleito 轨道模拟器的天体类型与交互设计重写：
  子步半隐式欧拉积分、拖拽放置天体（方向长度决定初速度）、碰撞合并、发光天体与黑洞吸积盘、
  多预设场景、相机平移缩放、零依赖。双击即可离线运行。
-->
<style>
  :root{
    --ink:#eaf2ff; --dim:#8b99b4; --line:rgba(150,175,220,.14);
    --glass:rgba(11,15,24,.62); --glass-solid:rgba(9,12,20,.94);
    --accent:#46f5c8; --accent2:#5aa9ff;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#04060b;color:var(--ink);font-family:var(--font);user-select:none;}
  #stage{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none;}

  .glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.5);}

  .masthead{position:fixed;top:20px;left:24px;z-index:10;pointer-events:none;text-shadow:0 2px 14px #000;}
  .wordmark{font-size:19px;font-weight:600;letter-spacing:.14em;}
  .wordmark b{color:var(--accent);font-weight:700;}
  .tagline{margin-top:5px;font-size:12px;color:var(--dim);letter-spacing:.06em;}

  .panel{position:fixed;top:18px;right:18px;width:268px;max-height:calc(100vh - 36px);overflow-y:auto;
    padding:14px 14px 15px;z-index:15;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;}
  .panel::-webkit-scrollbar{width:7px;}.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px;}
  .panel.hidden{opacity:0;transform:translateX(24px);pointer-events:none;}
  .panel h2{font-size:12px;letter-spacing:.22em;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .panel h2 b{color:var(--accent);letter-spacing:.08em;font-weight:600;}
  .sec{border-top:1px solid var(--line);padding-top:11px;margin-top:11px;}
  .sec-title{font-size:11px;letter-spacing:.18em;color:var(--dim);margin-bottom:8px;}

  /* 天体类型选择 */
  .type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
  .type-btn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:9px;padding:7px 2px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;font-family:var(--font);}
  .type-btn:hover{background:rgba(70,245,200,.1);border-color:rgba(70,245,200,.3);}
  .type-btn.on{background:linear-gradient(180deg,rgba(70,245,200,.22),rgba(70,245,200,.08));border-color:rgba(70,245,200,.4);}
  .type-btn .swatch{width:14px;height:14px;border-radius:50%;box-shadow:0 0 8px currentColor;}
  .type-btn .nm{font-size:9.5px;color:var(--dim);}
  .type-btn.on .nm{color:var(--accent);}

  /* 预设场景 */
  .preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;}
  .preset-btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-family:var(--font);
    font-size:11px;padding:8px 4px;border-radius:8px;cursor:pointer;transition:.15s;}
  .preset-btn:hover{background:rgba(70,245,200,.12);border-color:rgba(70,245,200,.3);}

  .btnrow{display:flex;gap:6px;margin-top:8px;}
  .btn{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-family:var(--font);
    font-size:12px;padding:7px 6px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .btn:hover{background:rgba(70,245,200,.12);border-color:rgba(70,245,200,.3);}
  .btn.primary{background:linear-gradient(180deg,rgba(70,245,200,.22),rgba(70,245,200,.08));border-color:rgba(70,245,200,.34);color:var(--accent);}
  .btn.danger:hover{background:rgba(255,80,100,.14);border-color:rgba(255,80,100,.4);}

  .row{margin:8px 0;}
  .row .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px;}
  .row .lab output{color:var(--ink);font-family:var(--mono);}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.12);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--accent));cursor:pointer;box-shadow:0 0 8px rgba(70,245,200,.6);border:0;}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--accent);cursor:pointer;}

  .chkrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:7px 0;cursor:pointer;}
  .chkrow input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}

  .stats{position:fixed;left:22px;bottom:18px;z-index:10;font-family:var(--mono);font-size:11.5px;color:var(--dim);
    line-height:1.7;text-shadow:0 1px 8px #000;pointer-events:none;}
  .stats b{color:var(--ink);font-weight:600;}

  .toolbar{position:fixed;right:18px;bottom:18px;z-index:14;display:flex;gap:7px;padding:7px;border-radius:13px;}
  .iconbtn{width:36px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--ink);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .iconbtn:hover{background:rgba(70,245,200,.14);border-color:rgba(70,245,200,.3);}

  .veil{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;padding:20px;padding-right:300px;
    background:radial-gradient(ellipse at center,rgba(4,6,11,.25),rgba(4,6,11,.82));transition:opacity .8s ease;cursor:pointer;}
  .veil.gone{opacity:0;pointer-events:none;}
  .veil .big{font-size:clamp(34px,7.5vw,80px);font-weight:200;letter-spacing:.28em;padding-left:.28em;
    background:linear-gradient(180deg,#fff,#8fe0ff 58%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .veil .sub{margin-top:16px;color:var(--dim);font-size:clamp(12px,2.1vw,15px);line-height:1.8;max-width:520px;letter-spacing:.05em;}
  .veil .hint{margin-top:24px;font-size:11px;letter-spacing:.2em;color:#5a6785;text-transform:uppercase;animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45;}50%{opacity:1;}}

  @media (max-width:760px){
    .panel{width:230px;right:10px;top:10px;}
    .veil{padding:20px;}
    .tagline{display:none;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="masthead">
  <div class="wordmark">引力沙盒 · <b>GRAVITY</b></div>
  <div class="tagline">拖拽放下一颗星，看整个宇宙为它重新排列</div>
</div>

<div class="panel glass" id="panel"></div>
<div class="stats" id="stats"></div>

<div class="toolbar glass">
  <button class="iconbtn" id="tbPause" title="暂停 / 继续（空格）">⏸</button>
  <button class="iconbtn" id="tbClear" title="清空宇宙">🗑</button>
  <button class="iconbtn" id="tbCam" title="重置相机">🎯</button>
  <button class="iconbtn" id="tbSave" title="保存图片（P）">📷</button>
  <button class="iconbtn" id="tbPanel" title="隐藏 / 显示面板（G）">⚙</button>
</div>

<div class="veil" id="veil">
  <div>
    <div class="big">引力沙盒</div>
    <div class="sub">按下定位置，拖出方向和速度，松开就诞生一颗星。<br>恒星、行星、黑洞彼此吸引、绕行、吞噬、碰撞——没有两个宇宙相同。</div>
    <div class="hint">点击任意处开始 · 左键拖拽放天体 · 右键拖拽平移 · 滚轮缩放</div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   天体类型
============================================================ */
const TYPES = {
  asteroid: { m:0.1,  r:2.2, color:"#aab0bd", name:"小行星", glow:false },
  moon:     { m:1,    r:3.5, color:"#cfd4de", name:"卫星",   glow:false },
  planet:   { m:10,   r:7,   color:"#4aa8ff", name:"行星",   glow:false },
  gas:      { m:60,   r:14,  color:"#ffb86b", name:"巨行星", glow:false },
  star:     { m:1500, r:22,  color:"#ffe680", name:"恒星",   glow:true  },
  giant:    { m:8000, r:55,  color:"#ff6a3d", name:"红巨星", glow:true  },
  blackhole:{ m:30000,r:11,  color:"#000000", name:"黑洞",   glow:"bh"  },
};
const TYPE_KEYS = Object.keys(TYPES);

/* ============================================================
   状态
============================================================ */
const state = {
  curType:"planet",
  timeScale:1.0,
  G:1.2,
  softening:6,
  trailLen:120,
  showTrails:true,
  showGlow:true,
  showLabels:false,
  paused:false,
};
let bodies=[], particles=[], stars=[];
const cam={x:0,y:0,zoom:1};

/* ============================================================
   Canvas
============================================================ */
const canvas=document.getElementById("stage");
const ctx=canvas.getContext("2d");
let W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,1.6);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);

// 屏幕坐标 -> 世界坐标
function s2w(sx,sy){return{x:(sx-W/2)/cam.zoom+cam.x,y:(sy-H/2)/cam.zoom+cam.y};}

/* ============================================================
   天体
============================================================ */
let _id=0;
class Body{
  constructor(x,y,vx,vy,typeKey){
    const t=TYPES[typeKey];
    this.id=++_id;
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.m=t.m;this.r=t.r;this.color=t.color;this.name=t.name;this.typeKey=typeKey;
    this.glow=t.glow;
    this.trail=[];
    this.phase=Math.random()*Math.PI*2;
  }
}

/* ============================================================
   物理：子步半隐式欧拉 + 软化引力
============================================================ */
function stepPhysics(dt){
  const sub=4;
  const h=dt/sub;
  const G=state.G, soft2=state.softening*state.softening;
  for(let s=0;s<sub;s++){
    const n=bodies.length;
    // 加速度 + 速度
    for(let i=0;i<n;i++){
      const a=bodies[i];
      let ax=0,ay=0;
      for(let j=0;j<n;j++){
        if(i===j)continue;
        const b=bodies[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const d2=dx*dx+dy*dy+soft2;
        const d=Math.sqrt(d2);
        const f=G*b.m/d2;
        ax+=f*dx/d; ay+=f*dy/d;
      }
      a.vx+=ax*h; a.vy+=ay*h;
    }
    // 位置
    for(const b of bodies){b.x+=b.vx*h;b.y+=b.vy*h;}
    // 碰撞合并
    handleCollisions();
  }
  // 拖尾
  if(state.showTrails){
    for(const b of bodies){
      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>state.trailLen)b.trail.shift();
    }
  }
}

function handleCollisions(){
  for(let i=0;i<bodies.length;i++){
    for(let j=i+1;j<bodies.length;j++){
      const a=bodies[i],b=bodies[j];
      const dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<a.r+b.r){
        // 合并：动量守恒，质量相加，半径按质量比例
        const M=a.m+b.m;
        const nx=(a.x*a.m+b.x*b.m)/M, ny=(a.y*a.m+b.y*b.m)/M;
        const nvx=(a.vx*a.m+b.vx*b.m)/M, nvy=(a.vy*a.m+b.vy*b.m)/M;
        // 保留较大者的类型/外观，质量叠加
        const big=a.m>=b.m?a:b;
        big.x=nx;big.y=ny;big.vx=nvx;big.vy=nvy;big.m=M;
        big.r=Math.max(big.r, Math.cbrt(M)*0.9);
        explode(nx,ny,big.color,Math.min(40,10+Math.sqrt(M)*0.6));
        bodies.splice(bodies.indexOf(big===a?b:a),1);
        return; // 一帧只处理一次合并，避免数组混乱
      }
    }
  }
}

/* ============================================================
   爆炸粒子
============================================================ */
function explode(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, sp=Math.random()*3+0.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:Math.random()<0.3?"#ff8844":color});
  }
}
function stepParticles(dt){
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=0.018*dt;}
  particles=particles.filter(p=>p.life>0);
}

/* ============================================================
   背景星空
============================================================ */
function makeStars(){
  stars=[];
  for(let i=0;i<220;i++){
    stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+0.3,a:Math.random()*0.6+0.2,tw:Math.random()*Math.PI*2});
  }
}

/* ============================================================
   渲染
============================================================ */
let _t=0;
function render(){
  _t+=0.016;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // 背景
  ctx.fillStyle="#04060b";
  ctx.fillRect(0,0,W,H);
  // 星空（屏幕空间，不随相机）
  for(const s of stars){
    const tw=0.6+0.4*Math.sin(_t*1.5+s.tw);
    ctx.globalAlpha=s.a*tw;
    ctx.fillStyle="#cfe0ff";
    ctx.fillRect(s.x*W,s.y*H,s.r,s.r);
  }
  ctx.globalAlpha=1;

  // 相机变换
  ctx.translate(W/2,H/2);
  ctx.scale(cam.zoom,cam.zoom);
  ctx.translate(-cam.x,-cam.y);

  // 拖尾
  if(state.showTrails){
    for(const b of bodies){
      if(b.trail.length<2)continue;
      ctx.beginPath();
      ctx.moveTo(b.trail[0].x,b.trail[0].y);
      for(let i=1;i<b.trail.length;i++)ctx.lineTo(b.trail[i].x,b.trail[i].y);
      ctx.strokeStyle=b.color+"55";
      ctx.lineWidth=Math.max(0.6,b.r*0.25);
      ctx.lineCap="round";
      ctx.stroke();
    }
  }

  // 粒子
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-1,p.y-1,2,2);
  }
  ctx.globalAlpha=1;

  // 天体
  for(const b of bodies){
    if(b.glow==="bh"){
      drawBlackhole(b);
    }else if(b.glow && state.showGlow){
      drawStar(b);
    }else{
      drawPlanet(b);
    }
    if(state.showLabels){
      ctx.fillStyle="rgba(234,242,255,.7)";
      ctx.font=`${11/cam.zoom}px var(--font)`;
      ctx.fillText(b.name,b.x+b.r+4,b.y+3);
    }
  }

  // 放置预览
  if(placing.active){
    drawPlacement();
  }
}

function drawPlanet(b){
  if(state.showGlow){
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*3);
    g.addColorStop(0,b.color+"66");
    g.addColorStop(1,b.color+"00");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*3,0,Math.PI*2);ctx.fill();
  }
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle=b.color;ctx.fill();
}
function drawStar(b){
  const pulse=1+0.08*Math.sin(_t*2+b.phase);
  const R=b.r*pulse;
  const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,R*4);
  g.addColorStop(0,"#ffffff");
  g.addColorStop(0.25,b.color);
  g.addColorStop(0.6,b.color+"55");
  g.addColorStop(1,b.color+"00");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(b.x,b.y,R*4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);
  ctx.fillStyle="#fffbe6";ctx.fill();
}
function drawBlackhole(b){
  // 吸积盘（旋转椭圆）
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(_t*0.8+b.phase);
  const g=ctx.createRadialGradient(0,0,b.r*0.8,0,0,b.r*5);
  g.addColorStop(0,"#ff884400");
  g.addColorStop(0.3,"#ffaa44cc");
  g.addColorStop(0.6,"#ff448888");
  g.addColorStop(1,"#ff448800");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(0,0,b.r*5,b.r*1.6,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // 事件视界（纯黑 + 亮边）
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle="#000";ctx.fill();
  ctx.lineWidth=1.5/cam.zoom;ctx.strokeStyle="rgba(255,220,180,.8)";ctx.stroke();
}

/* ============================================================
   放置预览
============================================================ */
const placing={active:false,sx:0,sy:0,cx:0,cy:0};
function drawPlacement(){
  const t=TYPES[state.curType];
  // 起点天体预览
  ctx.globalAlpha=0.7;
  ctx.beginPath();ctx.arc(placing.sx,placing.sy,t.r,0,Math.PI*2);
  ctx.fillStyle=t.color;ctx.fill();
  ctx.globalAlpha=1;
  // 速度预测线
  ctx.beginPath();
  ctx.moveTo(placing.sx,placing.sy);
  ctx.lineTo(placing.cx,placing.cy);
  ctx.strokeStyle="rgba(70,245,200,.8)";
  ctx.lineWidth=1.5/cam.zoom;
  ctx.setLineDash([6/cam.zoom,4/cam.zoom]);
  ctx.stroke();
  ctx.setLineDash([]);
  // 箭头
  const dx=placing.cx-placing.sx,dy=placing.cy-placing.sy;
  const ang=Math.atan2(dy,dx), al=8/cam.zoom;
  ctx.beginPath();
  ctx.moveTo(placing.cx,placing.cy);
  ctx.lineTo(placing.cx-al*Math.cos(ang-0.4),placing.cy-al*Math.sin(ang-0.4));
  ctx.lineTo(placing.cx-al*Math.cos(ang+0.4),placing.cy-al*Math.sin(ang+0.4));
  ctx.closePath();ctx.fillStyle="rgba(70,245,200,.9)";ctx.fill();
}

/* ============================================================
   预设场景
============================================================ */
function clearAll(){bodies=[];particles=[];cam.x=0;cam.y=0;cam.zoom=1;}

function presets(){
  return {
    "太阳系":()=>{
      clearAll();
      bodies.push(new Body(0,0,0,0,"star"));
      const add=(d,key,name,color)=>{
        const v=Math.sqrt(state.G*1500/d);
        const b=new Body(d,0,0,v,key);if(name)b.name=name;if(color)b.color=color;
        bodies.push(b);
      };
      add(90,"asteroid","水星","#b0a890");
      add(140,"planet","金星","#e3bb76");
      add(195,"planet","地球","#4aa8ff");
      add(250,"asteroid","火星","#ff6a4a");
      add(360,"gas","木星","#ffb86b");
      add(470,"gas","土星","#ead6b8");
    },
    "双星共舞":()=>{
      clearAll();
      const d=120,m=1200;
      const v=Math.sqrt(state.G*m/(4*d))*0.9;
      bodies.push(new Body(-d,0,0,-v,"star"));
      bodies.push(new Body(d,0,0,v,"star"));
      // 环绕行星
      for(let i=0;i<5;i++){
        const a=Math.random()*Math.PI*2, r=280+Math.random()*120;
        const vv=Math.sqrt(state.G*2*m/r)*0.85;
        bodies.push(new Body(Math.cos(a)*r,Math.sin(a)*r,-Math.sin(a)*vv,Math.cos(a)*vv,"planet"));
      }
      cam.zoom=0.7;
    },
    "三体混沌":()=>{
      clearAll();
      const m=900,r=140;
      const v=Math.sqrt(state.G*m/(r*2))*0.7;
      bodies.push(new Body(r,0,0,v,"star"));
      bodies.push(new Body(-r*0.5,r*0.866,-v*0.866,-v*0.5,"star"));
      bodies.push(new Body(-r*0.5,-r*0.866,v*0.866,-v*0.5,"star"));
      cam.zoom=0.75;
    },
    "星系碰撞":()=>{
      clearAll();
      const makeGalaxy=(cx,cy,vx,vy,rot)=>{
        bodies.push(new Body(cx,cy,vx,vy,"star"));
        for(let i=0;i<40;i++){
          const a=rot+Math.random()*Math.PI*2, r=40+Math.random()*160;
          const vv=Math.sqrt(state.G*1500/r)*0.8;
          const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r;
          bodies.push(new Body(px,py,vx-Math.sin(a)*vv,vy+Math.cos(a)*vv,Math.random()<0.3?"planet":"asteroid"));
        }
      };
      makeGalaxy(-250,-80,1.2,0.2,0);
      makeGalaxy(250,80,-1.2,-0.2,Math.PI);
      cam.zoom=0.55;
    },
    "黑洞吞噬":()=>{
      clearAll();
      bodies.push(new Body(0,0,0,0,"blackhole"));
      for(let i=0;i<60;i++){
        const a=Math.random()*Math.PI*2, r=120+Math.random()*300;
        const vv=Math.sqrt(state.G*30000/r)*0.75;
        const key=Math.random()<0.5?"asteroid":(Math.random()<0.6?"moon":"planet");
        bodies.push(new Body(Math.cos(a)*r,Math.sin(a)*r,-Math.sin(a)*vv,Math.cos(a)*vv,key));
      }
      cam.zoom=0.6;
    },
    "随机星团":()=>{
      clearAll();
      for(let i=0;i<3;i++){
        const a=Math.random()*Math.PI*2,r=Math.random()*150;
        bodies.push(new Body(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-0.5)*2,(Math.random()-0.5)*2,"star"));
      }
      for(let i=0;i<50;i++){
        const a=Math.random()*Math.PI*2,r=Math.random()*350;
        bodies.push(new Body(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-0.5)*1.5,(Math.random()-0.5)*1.5,
          Math.random()<0.4?"asteroid":(Math.random()<0.6?"moon":"planet")));
      }
      cam.zoom=0.6;
    },
  };
}

/* ============================================================
   UI 构建
============================================================ */
const panel=document.getElementById("panel");
function buildPanel(){
  panel.innerHTML="";
  panel.append(el("h2",{},"宇宙控制台",el("b",{id:"bodyCount"},"0 天体")));

  // 天体类型
  const s1=el("div",{class:"sec"});
  s1.append(el("div",{class:"sec-title"},"放置天体（左键拖拽）"));
  const grid=el("div",{class:"type-grid"});
  TYPE_KEYS.forEach(k=>{
    const t=TYPES[k];
    const b=el("button",{class:"type-btn"+(k===state.curType?" on":""),dataset:{key:k}});
    b.append(el("span",{class:"swatch",style:{color:t.color,background:t.color==="#000000"?"#222":t.color}}));
    b.append(el("span",{class:"nm",textContent:t.name}));
    b.onclick=()=>{state.curType=k;[...grid.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");};
    grid.append(b);
  });
  s1.append(grid);
  panel.append(s1);

  // 预设场景
  const s2=el("div",{class:"sec"});
  s2.append(el("div",{class:"sec-title"},"预设场景"));
  const pg=el("div",{class:"preset-grid"});
  const P=presets();
  Object.keys(P).forEach(name=>{
    const b=el("button",{class:"preset-btn",textContent:name});
    b.onclick=()=>{P[name]();updateBodyCount();};
    pg.append(b);
  });
  s2.append(pg);
  panel.append(s2);

  // 参数
  const s3=el("div",{class:"sec"});
  s3.append(el("div",{class:"sec-title"},"世界参数"));
  s3.append(slider("时间速度",state.timeScale,0,5,0.1,v=>state.timeScale=v,"×"));
  s3.append(slider("引力常数",state.G,0.2,4,0.05,v=>state.G=v,"G"));
  s3.append(slider("拖尾长度",state.trailLen,0,400,10,v=>state.trailLen=v|0,"帧"));
  panel.append(s3);

  // 显示
  const s4=el("div",{class:"sec"});
  s4.append(el("div",{class:"sec-title"},"显示"));
  s4.append(check("运动拖尾",state.showTrails,v=>state.showTrails=v));
  s4.append(check("发光效果",state.showGlow,v=>state.showGlow=v));
  s4.append(check("天体名称",state.showLabels,v=>state.showLabels=v));
  panel.append(s4);

  // 操作
  const s5=el("div",{class:"sec"});
  s5.append(el("div",{class:"btnrow"},btn("⏸ 暂停",()=>togglePause(),true)));
  s5.append(el("div",{class:"btnrow"},
    btn("🗑 清空",()=>{clearAll();updateBodyCount();},false),
    btn("🎯 重置相机",()=>{cam.x=0;cam.y=0;cam.zoom=1;},false),
  ));
  panel.append(s5);
}

function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  attrs=attrs||{};
  for(const k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="html")e.innerHTML=attrs[k];
    else if(k==="dataset")Object.assign(e.dataset,attrs[k]);
    else if(k==="style"&&typeof attrs[k]==="object")Object.assign(e.style,attrs[k]);
    else e[k]=attrs[k];
  }
  for(const kid of kids){if(kid!=null)e.append(kid);}
  return e;
}
function slider(label,val,min,max,step,fn,suffix){
  const out=el("output",{textContent:fmt(val)+(suffix||"")});
  const inp=el("input",{type:"range",min,max,step,value:val});
  inp.oninput=()=>{const v=parseFloat(inp.value);out.textContent=fmt(v)+(suffix||"");fn(v);};
  return el("div",{class:"row"},el("div",{class:"lab"},el("span",{textContent:label}),out),inp);
}
function fmt(v){return Number.isInteger(v)?(""+v):(""+Math.round(v*1000)/1000);}
function check(label,val,fn){
  const inp=el("input",{type:"checkbox"});inp.checked=val;
  inp.onchange=()=>fn(inp.checked);
  return el("label",{class:"chkrow"},inp,el("span",{textContent:label}));
}
function btn(text,fn,primary){return el("button",{class:"btn"+(primary?" primary":""),textContent:text,onclick:fn});}

function togglePause(){
  state.paused=!state.paused;
  document.getElementById("tbPause").textContent=state.paused?"▶":"⏸";
}
function updateBodyCount(){
  const e=document.getElementById("bodyCount");
  if(e)e.textContent=bodies.length+" 天体";
}

/* ============================================================
   交互：放置 / 相机平移 / 缩放
============================================================ */
let panning=false, panLast={x:0,y:0};
canvas.addEventListener("pointerdown",e=>{
  const p=s2w(e.clientX,e.clientY);
  if(e.button===2||e.button===1||e.shiftKey){
    panning=true;panLast={x:e.clientX,y:e.clientY};
    canvas.style.cursor="grabbing";
  }else if(e.button===0){
    placing.active=true;
    placing.sx=p.x;placing.sy=p.y;
    placing.cx=p.x;placing.cy=p.y;
  }
});
canvas.addEventListener("pointermove",e=>{
  const p=s2w(e.clientX,e.clientY);
  if(panning){
    cam.x-=(e.clientX-panLast.x)/cam.zoom;
    cam.y-=(e.clientY-panLast.y)/cam.zoom;
    panLast={x:e.clientX,y:e.clientY};
  }
  if(placing.active){placing.cx=p.x;placing.cy=p.y;}
});
canvas.addEventListener("pointerup",e=>{
  if(panning){panning=false;canvas.style.cursor="crosshair";return;}
  if(placing.active){
    placing.active=false;
    const p=s2w(e.clientX,e.clientY);
    const vx=(p.x-placing.sx)*0.012, vy=(p.y-placing.sy)*0.012;
    bodies.push(new Body(placing.sx,placing.sy,vx,vy,state.curType));
    updateBodyCount();
  }
});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const factor=e.deltaY>0?0.9:1.1;
  const p=s2w(e.clientX,e.clientY);
  cam.zoom=Math.max(0.05,Math.min(8,cam.zoom*factor));
  // 以鼠标为中心缩放
  const p2=s2w(e.clientX,e.clientY);
  cam.x+=p.x-p2.x;cam.y+=p.y-p2.y;
},{passive:false});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

/* ============================================================
   快捷键
============================================================ */
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  switch(e.key.toLowerCase()){
    case " ":e.preventDefault();togglePause();break;
    case "g":panel.classList.toggle("hidden");break;
    case "p":savePNG();break;
    case "c":clearAll();updateBodyCount();break;
    case "r":presets()["随机星团"]();updateBodyCount();break;
  }
});

/* ============================================================
   工具栏
============================================================ */
document.getElementById("tbPause").onclick=togglePause;
document.getElementById("tbClear").onclick=()=>{clearAll();updateBodyCount();};
document.getElementById("tbCam").onclick=()=>{cam.x=0;cam.y=0;cam.zoom=1;};
document.getElementById("tbSave").onclick=savePNG;
document.getElementById("tbPanel").onclick=()=>panel.classList.toggle("hidden");
function savePNG(){
  const a=document.createElement("a");
  a.download=`引力沙盒_${Date.now()}.png`;
  a.href=canvas.toDataURL("image/png");
  a.click();
}

/* ============================================================
   开场遮罩
============================================================ */
const veil=document.getElementById("veil");
veil.addEventListener("click",()=>{
  veil.classList.add("gone");
  setTimeout(()=>{veil.style.display="none";},900);
});

/* ============================================================
   主循环
============================================================ */
const statsEl=document.getElementById("stats");
let last=performance.now(),fps=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(dt>0)fps=fps*0.92+(1/dt)*0.08;
  if(!state.paused){
    stepPhysics(state.timeScale);
    stepParticles(state.timeScale);
  }
  render();
  statsEl.innerHTML=`天体 <b>${bodies.length}</b> · 粒子 <b>${particles.length}</b><br>帧率 <b>${fps.toFixed(0)}</b> fps · 缩放 <b>${cam.zoom.toFixed(2)}</b>×`;
  updateBodyCount();
}

/* ============================================================
   启动
============================================================ */
resize();
makeStars();
buildPanel();
presets()["太阳系"]();
updateBodyCount();
requestAnimationFrame(loop);
</script>
