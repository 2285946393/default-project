<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枯山水 · 禅意花园</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: #d4c5a9;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    color: #4a3f35;
    -webkit-font-smoothing: antialiased;
  }

  /* 沙地画布 */
  #sandCanvas {
    position: absolute; inset: 0;
    cursor: crosshair;
  }

  /* 花园元素层 */
  #gardenLayer {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .garden-item {
    position: absolute;
    pointer-events: auto;
    cursor: grab;
    user-select: none;
    transition: filter 0.2s;
    filter: drop-shadow(3px 6px 6px rgba(0,0,0,0.18));
  }
  body.rake-mode .garden-item {
    pointer-events: none;
  }
  .garden-item:hover { filter: drop-shadow(4px 8px 10px rgba(0,0,0,0.28)); }
  .garden-item.dragging { cursor: grabbing; opacity: 0.85; }
  .garden-item.selected {
    filter: drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 8px rgba(139,90,43,0.5));
  }
  .garden-item svg { display: block; pointer-events: none; }

  /* 顶部标题 */
  .header {
    position: absolute; top: 0; left: 0; right: 0;
    text-align: center; padding: 24px 0 16px;
    pointer-events: none; z-index: 50;
  }
  .header h1 {
    font-size: 28px; font-weight: 400; letter-spacing: 12px;
    color: #5a4a3a; text-shadow: 0 1px 2px rgba(255,255,255,0.5);
  }
  .header .sub {
    font-size: 11px; letter-spacing: 6px; color: #8a7a6a; margin-top: 6px;
    font-family: sans-serif;
  }

  /* 左侧工具栏 */
  .toolbar {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    background: rgba(250, 245, 235, 0.92);
    backdrop-filter: blur(10px);
    border-radius: 16px; padding: 14px 10px;
    box-shadow: 0 8px 32px rgba(90, 70, 50, 0.15);
    border: 1px solid rgba(180, 160, 130, 0.3);
    z-index: 100; display: flex; flex-direction: column; gap: 6px;
  }
  .tool-divider {
    height: 1px; background: rgba(180,160,130,0.3); margin: 4px 8px;
  }
  .tool-btn {
    width: 52px; height: 52px; border: none; background: transparent;
    border-radius: 12px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.2s; position: relative;
  }
  .tool-btn:hover { background: rgba(180, 150, 100, 0.15); }
  .tool-btn.active {
    background: rgba(139, 90, 43, 0.15);
    box-shadow: inset 0 0 0 2px rgba(139, 90, 43, 0.4);
  }
  .tool-btn svg { width: 32px; height: 32px; }
  .tool-btn .label {
    position: absolute; bottom: -2px; font-size: 9px; color: #8a7a6a;
    font-family: sans-serif; letter-spacing: 1px;
  }

  /* 右下角控制 */
  .controls {
    position: absolute; bottom: 24px; right: 24px;
    display: flex; gap: 10px; z-index: 100;
  }
  .ctrl-btn {
    padding: 10px 20px; border: 1px solid rgba(139,90,43,0.3);
    background: rgba(250,245,235,0.9); backdrop-filter: blur(10px);
    border-radius: 10px; cursor: pointer; font-size: 13px;
    color: #5a4a3a; font-family: inherit; letter-spacing: 2px;
    transition: all 0.2s; box-shadow: 0 4px 12px rgba(90,70,50,0.1);
  }
  .ctrl-btn:hover { background: rgba(139,90,43,0.1); transform: translateY(-1px); }
  .ctrl-btn.danger { color: #a05050; border-color: rgba(160,80,80,0.3); }

  /* 左下角提示 */
  .hint {
    position: absolute; bottom: 24px; left: 24px;
    font-size: 12px; color: #8a7a6a; line-height: 2;
    font-family: sans-serif; letter-spacing: 1px; z-index: 50;
    pointer-events: none;
  }
  .hint kbd {
    display: inline-block; padding: 1px 6px; background: rgba(255,255,255,0.6);
    border: 1px solid rgba(180,160,130,0.4); border-radius: 4px;
    font-size: 10px; font-family: monospace;
  }

  /* 模式指示器 */
  .mode-indicator {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: #8a7a6a; letter-spacing: 4px;
    font-family: sans-serif; z-index: 50; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
  .mode-indicator.show { opacity: 0.7; }

  /* 樱花粒子 */
  .petal {
    position: absolute; pointer-events: none; z-index: 200;
    opacity: 0;
  }

  @media (max-width: 600px) {
    .toolbar { left: 8px; padding: 10px 6px; }
    .tool-btn { width: 42px; height: 42px; }
    .tool-btn svg { width: 26px; height: 26px; }
    .header h1 { font-size: 20px; letter-spacing: 8px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<canvas id="sandCanvas"></canvas>
<div id="gardenLayer"></div>

<div class="header">
  <h1>枯 山 水</h1>
  <div class="sub">KARE SANSUI · 一沙一世界</div>
</div>

<div class="mode-indicator" id="modeIndicator">耙沙模式</div>

<div class="toolbar" id="toolbar">
  <!-- 耙沙工具 -->
  <button class="tool-btn active" data-tool="rake" title="耙沙">
    <svg viewBox="0 0 32 32" fill="none">
      <line x1="8" y1="6" x2="24" y2="26" stroke="#8b5a2b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="4" x2="18" y2="8" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/>
      <line x1="11" y1="7" x2="15" y2="11" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="1" x2="21" y2="5" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="tool-divider"></div>
  <!-- 元素 -->
  <button class="tool-btn" data-element="stone" title="景石">
    <svg viewBox="0 0 32 32"><ellipse cx="16" cy="20" rx="11" ry="8" fill="#9a9590"/><ellipse cx="13" cy="17" rx="5" ry="3" fill="#b5b0aa" opacity="0.6"/></svg>
  </button>
  <button class="tool-btn" data-element="moss" title="苔藓">
    <svg viewBox="0 0 32 32"><circle cx="12" cy="20" r="6" fill="#6b8e4e"/><circle cx="20" cy="18" r="7" fill="#7a9e5a"/><circle cx="16" cy="22" r="5" fill="#5a7e3e"/></svg>
  </button>
  <button class="tool-btn" data-element="lantern" title="石灯笼">
    <svg viewBox="0 0 32 32"><rect x="12" y="22" width="8" height="4" fill="#8a8580" rx="1"/><rect x="13" y="14" width="6" height="9" fill="#9a9590"/><polygon points="10,14 22,14 18,9 14,9" fill="#a5a09a"/><rect x="14" y="5" width="4" height="5" fill="#8a8580"/><circle cx="16" cy="18" r="1.5" fill="#f5e6c8" opacity="0.8"/></svg>
  </button>
  <button class="tool-btn" data-element="bamboo" title="竹丛">
    <svg viewBox="0 0 32 32"><rect x="10" y="4" width="3" height="24" fill="#6b9e4a" rx="1"/><rect x="16" y="2" width="3" height="26" fill="#7aae5a" rx="1"/><rect x="22" y="6" width="3" height="22" fill="#5a8e3a" rx="1"/><line x1="10" y1="12" x2="13" y2="12" stroke="#4a7e2a" stroke-width="1"/><line x1="16" y1="10" x2="19" y2="10" stroke="#4a7e2a" stroke-width="1"/><line x1="22" y1="14" x2="25" y2="14" stroke="#4a7e2a" stroke-width="1"/><path d="M13 8 Q18 4 22 8" stroke="#7aae5a" stroke-width="1.5" fill="none"/></svg>
  </button>
  <button class="tool-btn" data-element="sakura" title="樱花树">
    <svg viewBox="0 0 32 32"><rect x="14" y="18" width="4" height="10" fill="#7a5a3a" rx="1"/><circle cx="16" cy="12" r="9" fill="#f5c8d8"/><circle cx="11" cy="14" r="5" fill="#f0b8c8"/><circle cx="21" cy="14" r="5" fill="#f8d0e0"/><circle cx="16" cy="8" r="4" fill="#fce0ec"/></svg>
  </button>
  <button class="tool-btn" data-element="pine" title="松树">
    <svg viewBox="0 0 32 32"><rect x="14" y="22" width="4" height="6" fill="#6a4a2a" rx="1"/><polygon points="16,2 8,14 24,14" fill="#3a6a3a"/><polygon points="16,8 6,20 26,20" fill="#4a7a4a"/><polygon points="16,14 5,24 27,24" fill="#5a8a5a"/></svg>
  </button>
  <button class="tool-btn" data-element="bridge" title="红桥">
    <svg viewBox="0 0 32 32"><path d="M4 22 Q16 8 28 22" stroke="#b84040" stroke-width="4" fill="none" stroke-linecap="round"/><line x1="8" y1="18" x2="8" y2="24" stroke="#8a3030" stroke-width="2"/><line x1="16" y1="12" x2="16" y2="24" stroke="#8a3030" stroke-width="2"/><line x1="24" y1="18" x2="24" y2="24" stroke="#8a3030" stroke-width="2"/></svg>
  </button>
  <button class="tool-btn" data-element="pond" title="锦鲤池">
    <svg viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="13" ry="9" fill="#5a9ac8"/><ellipse cx="16" cy="16" rx="10" ry="6" fill="#7ab8e0" opacity="0.6"/><ellipse cx="12" cy="17" rx="3" ry="1.5" fill="#e8a040"/><polygon points="9,17 6,15 6,19" fill="#e8a040"/><ellipse cx="20" cy="19" rx="2.5" ry="1.2" fill="#d06030"/><polygon points="17.5,19 15,17.5 15,20.5" fill="#d06030"/></svg>
  </button>
</div>

<div class="controls">
  <button class="ctrl-btn" id="saveBtn">保存</button>
  <button class="ctrl-btn danger" id="clearBtn">清空</button>
</div>

<div class="hint">
  <kbd>拖拽</kbd> 耙沙 / 布置元素 &nbsp; <kbd>滚轮</kbd> 旋转元素<br>
  <kbd>+/-</kbd> 缩放 &nbsp; <kbd>Delete</kbd> 删除 &nbsp; <kbd>R</kbd> 切换耙沙
</div>

<script>
(function() {
  'use strict';

  // ============ 沙地 Canvas ============
  const canvas = document.getElementById('sandCanvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    drawSandBase();
    if (savedRakes) redrawRakes();
  }

  // 沙地底色
  function drawSandBase() {
    // 基础渐变
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
    grad.addColorStop(0, '#e8dcc4');
    grad.addColorStop(0.6, '#ddd0b4');
    grad.addColorStop(1, '#d0c2a4');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 沙粒噪点
    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      const noise = (Math.random() - 0.5) * 12;
      data[i] += noise;
      data[i+1] += noise;
      data[i+2] += noise * 0.8;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  // 耙沙纹路存储
  let rakes = [];
  let savedRakes = null;

  function drawRakeLine(x1, y1, x2, y2, width) {
    ctx.strokeStyle = 'rgba(185, 168, 135, 0.4)';
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    // 耙子的多条纹路
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len < 1) return;
    const nx = -dy / len, ny = dx / len;
    const spacing = width * 0.5;
    const count = Math.max(3, Math.floor(width / spacing));
    for (let i = 0; i < count; i++) {
      const offset = (i - (count-1)/2) * spacing;
      ctx.strokeStyle = 'rgba(165, 148, 115, 0.35)';
      ctx.lineWidth = Math.max(1, width * 0.1);
      ctx.beginPath();
      ctx.moveTo(x1 + nx * offset, y1 + ny * offset);
      ctx.lineTo(x2 + nx * offset, y2 + ny * offset);
      ctx.stroke();
    }
  }

  function redrawRakes() {
    if (!savedRakes) return;
    rakes = savedRakes.map(r => ({...r, points: [...r.points]}));
    for (const rake of rakes) {
      for (let i = 1; i < rake.points.length; i++) {
        drawRakeLine(rake.points[i-1].x, rake.points[i-1].y, rake.points[i].x, rake.points[i].y, rake.width);
      }
    }
  }

  // ============ 交互状态 ============
  let currentTool = 'rake'; // 'rake' or element type
  let selectedItem = null;
  let isDrawing = false;
  let currentRake = null;
  let rakeWidth = 18;
  let dragItem = null;
  let dragOffset = {x: 0, y: 0};

  const gardenLayer = document.getElementById('gardenLayer');
  const modeIndicator = document.getElementById('modeIndicator');

  // ============ 元素 SVG 定义 ============
  const elementSVGs = {
    stone: '<svg viewBox="0 0 80 60" width="80" height="60"><ellipse cx="40" cy="42" rx="32" ry="16" fill="#8a8580"/><ellipse cx="40" cy="36" rx="28" ry="18" fill="#9a9590"/><ellipse cx="32" cy="30" rx="12" ry="7" fill="#b5b0aa" opacity="0.5"/><ellipse cx="50" cy="38" rx="8" ry="4" fill="#7a7570" opacity="0.3"/></svg>',
    moss: '<svg viewBox="0 0 70 50" width="70" height="50"><ellipse cx="35" cy="38" rx="28" ry="10" fill="#4a6a3a" opacity="0.4"/><circle cx="22" cy="32" r="12" fill="#6b8e4e"/><circle cx="42" cy="28" r="14" fill="#7a9e5a"/><circle cx="32" cy="36" r="10" fill="#5a7e3e"/><circle cx="50" cy="34" r="8" fill="#6a8e4a"/><circle cx="18" cy="28" r="4" fill="#8aae6a"/></svg>',
    lantern: '<svg viewBox="0 0 50 80" width="50" height="80"><rect x="18" y="68" width="14" height="8" fill="#7a7570" rx="2"/><rect x="20" y="50" width="10" height="20" fill="#8a8580"/><rect x="16" y="44" width="18" height="8" fill="#9a9590" rx="1"/><polygon points="12,44 38,44 32,30 18,30" fill="#a5a09a"/><rect x="21" y="18" width="8" height="14" fill="#8a8580"/><rect x="19" y="14" width="12" height="6" fill="#9a9590" rx="1"/><circle cx="25" cy="25" r="2.5" fill="#f5e6c8" opacity="0.9"/></svg>',
    bamboo: '<svg viewBox="0 0 60 90" width="60" height="90"><rect x="18" y="8" width="5" height="78" fill="#6b9e4a" rx="2"/><rect x="28" y="4" width="5" height="82" fill="#7aae5a" rx="2"/><rect x="38" y="12" width="5" height="74" fill="#5a8e3a" rx="2"/><line x1="18" y1="30" x2="23" y2="30" stroke="#4a7e2a" stroke-width="1.5"/><line x1="28" y1="24" x2="33" y2="24" stroke="#4a7e2a" stroke-width="1.5"/><line x1="38" y1="34" x2="43" y2="34" stroke="#4a7e2a" stroke-width="1.5"/><path d="M23 20 Q35 10 45 18" stroke="#7aae5a" stroke-width="2" fill="none"/><path d="M23 50 Q30 42 40 48" stroke="#6b9e4a" stroke-width="1.5" fill="none"/></svg>',
    sakura: '<svg viewBox="0 0 80 100" width="80" height="100"><rect x="36" y="60" width="8" height="35" fill="#7a5a3a" rx="2"/><path d="M40 65 Q30 55 25 45" stroke="#7a5a3a" stroke-width="4" fill="none"/><path d="M40 60 Q50 50 55 40" stroke="#7a5a3a" stroke-width="4" fill="none"/><circle cx="40" cy="35" r="22" fill="#f5c8d8"/><circle cx="25" cy="42" r="14" fill="#f0b8c8"/><circle cx="55" cy="42" r="14" fill="#f8d0e0"/><circle cx="40" cy="22" r="12" fill="#fce0ec"/><circle cx="32" cy="35" r="3" fill="#f8a0c0" opacity="0.6"/><circle cx="48" cy="38" r="2.5" fill="#f8a0c0" opacity="0.6"/></svg>',
    pine: '<svg viewBox="0 0 70 100" width="70" height="100"><rect x="31" y="75" width="8" height="20" fill="#6a4a2a" rx="1"/><polygon points="35,5 18,35 52,35" fill="#2a5a2a"/><polygon points="35,18 14,48 56,48" fill="#3a6a3a"/><polygon points="35,32 10,65 60,65" fill="#4a7a4a"/><polygon points="35,48 8,78 62,78" fill="#5a8a5a"/></svg>',
    bridge: '<svg viewBox="0 0 100 60" width="100" height="60"><path d="M10 50 Q50 10 90 50" stroke="#b84040" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M10 50 Q50 10 90 50" stroke="#d06060" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="22" y1="40" x2="22" y2="54" stroke="#8a3030" stroke-width="3"/><line x1="40" y1="28" x2="40" y2="54" stroke="#8a3030" stroke-width="3"/><line x1="60" y1="28" x2="60" y2="54" stroke="#8a3030" stroke-width="3"/><line x1="78" y1="40" x2="78" y2="54" stroke="#8a3030" stroke-width="3"/></svg>',
    pond: '<svg viewBox="0 0 100 70" width="100" height="70"><ellipse cx="50" cy="40" rx="42" ry="26" fill="#4a8ab8"/><ellipse cx="50" cy="36" rx="36" ry="20" fill="#6aa8d8" opacity="0.7"/><ellipse cx="50" cy="33" rx="28" ry="14" fill="#8ac0e8" opacity="0.4"/><ellipse cx="35" cy="38" rx="8" ry="4" fill="#e8a040"/><polygon points="27,38 20,34 20,42" fill="#e8a040"/><circle cx="39" cy="37" r="1" fill="#333"/><ellipse cx="62" cy="44" rx="7" ry="3.5" fill="#d06030"/><polygon points="55,44 48,41 48,47" fill="#d06030"/><circle cx="65" cy="43" r="0.8" fill="#333"/></svg>'
  };

  const elementSizes = {
    stone: {w: 80, h: 60}, moss: {w: 70, h: 50}, lantern: {w: 50, h: 80},
    bamboo: {w: 60, h: 90}, sakura: {w: 80, h: 100}, pine: {w: 70, h: 100},
    bridge: {w: 100, h: 60}, pond: {w: 100, h: 70}
  };

  // ============ 工具栏 ============
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.tool === 'rake') {
        currentTool = 'rake';
        modeIndicator.textContent = '耙沙模式';
        document.body.classList.add('rake-mode');
      } else {
        currentTool = btn.dataset.element;
        modeIndicator.textContent = '布置模式 · ' + btn.title;
        document.body.classList.remove('rake-mode');
      }
      modeIndicator.classList.add('show');
      setTimeout(() => modeIndicator.classList.remove('show'), 1500);
      deselectAll();
    });
  });

  // ============ 创建花园元素 ============
  function createElement(type, x, y, rotation = 0, scale = 1) {
    const item = document.createElement('div');
    item.className = 'garden-item';
    item.dataset.type = type;
    item.dataset.rotation = rotation;
    item.dataset.scale = scale;
    item.innerHTML = elementSVGs[type];
    const size = elementSizes[type];
    item.style.width = size.w + 'px';
    item.style.height = size.h + 'px';
    item.style.left = (x - size.w/2) + 'px';
    item.style.top = (y - size.h/2) + 'px';
    item.style.transform = `rotate(${rotation}deg) scale(${scale})`;
    gardenLayer.appendChild(item);
    return item;
  }

  // ============ 画布交互 ============
  canvas.addEventListener('mousedown', (e) => {
    const x = e.clientX, y = e.clientY;
    if (currentTool === 'rake') {
      isDrawing = true;
      currentRake = {width: rakeWidth, points: [{x, y}]};
      rakes.push(currentRake);
    } else {
      // 放置元素
      const item = createElement(currentTool, x, y);
      selectItem(item);
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing || !currentRake) return;
    const x = e.clientX, y = e.clientY;
    const last = currentRake.points[currentRake.points.length - 1];
    drawRakeLine(last.x, last.y, x, y, currentRake.width);
    currentRake.points.push({x, y});
  });

  window.addEventListener('mouseup', () => {
    isDrawing = false;
    currentRake = null;
  });

  // 触摸支持
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousedown', {clientX: t.clientX, clientY: t.clientY}));
  });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousemove', {clientX: t.clientX, clientY: t.clientY}));
  });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    window.dispatchEvent(new MouseEvent('mouseup'));
  });

  // ============ 元素拖拽 ============
  gardenLayer.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.garden-item');
    if (!item) return;
    e.stopPropagation();
    selectItem(item);
    dragItem = item;
    const rect = item.getBoundingClientRect();
    dragOffset.x = e.clientX - rect.left - rect.width/2;
    dragOffset.y = e.clientY - rect.top - rect.height/2;
    item.classList.add('dragging');
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragItem) return;
    const size = elementSizes[dragItem.dataset.type];
    const x = e.clientX - dragOffset.x;
    const y = e.clientY - dragOffset.y;
    dragItem.style.left = (x - size.w/2) + 'px';
    dragItem.style.top = (y - size.h/2) + 'px';
  });

  window.addEventListener('mouseup', () => {
    if (dragItem) {
      dragItem.classList.remove('dragging');
      dragItem = null;
    }
  });

  // ============ 选中操作 ============
  function selectItem(item) {
    deselectAll();
    selectedItem = item;
    item.classList.add('selected');
  }

  function deselectAll() {
    document.querySelectorAll('.garden-item.selected').forEach(el => el.classList.remove('selected'));
    selectedItem = null;
  }

  // 滚轮旋转
  window.addEventListener('wheel', (e) => {
    if (!selectedItem) return;
    e.preventDefault();
    let rot = parseFloat(selectedItem.dataset.rotation) || 0;
    rot += e.deltaY > 0 ? 5 : -5;
    selectedItem.dataset.rotation = rot;
    const scale = parseFloat(selectedItem.dataset.scale) || 1;
    selectedItem.style.transform = `rotate(${rot}deg) scale(${scale})`;
  }, {passive: false});

  // 键盘操作
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (selectedItem) {
        selectedItem.remove();
        selectedItem = null;
      }
    } else if (e.key === '+' || e.key === '=') {
      if (selectedItem) {
        let s = parseFloat(selectedItem.dataset.scale) || 1;
        s = Math.min(3, s + 0.1);
        selectedItem.dataset.scale = s;
        const rot = parseFloat(selectedItem.dataset.rotation) || 0;
        selectedItem.style.transform = `rotate(${rot}deg) scale(${s})`;
      }
    } else if (e.key === '-') {
      if (selectedItem) {
        let s = parseFloat(selectedItem.dataset.scale) || 1;
        s = Math.max(0.3, s - 0.1);
        selectedItem.dataset.scale = s;
        const rot = parseFloat(selectedItem.dataset.rotation) || 0;
        selectedItem.style.transform = `rotate(${rot}deg) scale(${s})`;
      }
    } else if (e.key === 'r' || e.key === 'R') {
      // 切换耙沙
      document.querySelector('[data-tool="rake"]').click();
    } else if (e.key === 'Escape') {
      deselectAll();
    }
  });

  // 点击空白取消选中
  canvas.addEventListener('mousedown', (e) => {
    if (e.target === canvas && currentTool !== 'rake') {
      // 不取消，因为要放置元素
    }
  });
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.garden-item') && !e.target.closest('.tool-btn') && !e.target.closest('.ctrl-btn') && e.target !== canvas) {
      deselectAll();
    }
  });

  // ============ 清空 / 保存 ============
  document.getElementById('clearBtn').addEventListener('click', () => {
    gardenLayer.innerHTML = '';
    rakes = [];
    savedRakes = null;
    selectedItem = null;
    drawSandBase();
    localStorage.removeItem('zenGarden');
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const items = [];
    document.querySelectorAll('.garden-item').forEach(el => {
      const size = elementSizes[el.dataset.type];
      items.push({
        type: el.dataset.type,
        x: parseFloat(el.style.left) + size.w/2,
        y: parseFloat(el.style.top) + size.h/2,
        rotation: parseFloat(el.dataset.rotation) || 0,
        scale: parseFloat(el.dataset.scale) || 1
      });
    });
    localStorage.setItem('zenGarden', JSON.stringify({items, rakes}));
    showToast('已保存');
  });

  function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;top:120px;left:50%;transform:translateX(-50%);background:rgba(90,70,50,0.85);color:#f5efe0;padding:10px 24px;border-radius:8px;font-size:14px;letter-spacing:2px;z-index:999;opacity:0;transition:opacity 0.3s;';
    document.body.appendChild(t);
    requestAnimationFrame(() => t.style.opacity = '1');
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 1500);
  }

  // 加载保存
  function loadSaved() {
    const data = localStorage.getItem('zenGarden');
    if (!data) return;
    try {
      const parsed = JSON.parse(data);
      if (parsed.items) {
        parsed.items.forEach(it => createElement(it.type, it.x, it.y, it.rotation, it.scale));
      }
      if (parsed.rakes && parsed.rakes.length > 0) {
        savedRakes = parsed.rakes;
      }
    } catch(e) {}
  }

  // ============ 樱花飘落 ============
  function createPetal() {
    const petal = document.createElement('div');
    petal.className = 'petal';
    const size = 4 + Math.random() * 6;
    petal.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 10 10"><ellipse cx="5" cy="5" rx="4" ry="3" fill="#f5c8d8" opacity="0.8"/></svg>`;
    petal.style.left = Math.random() * W + 'px';
    petal.style.top = '-20px';
    document.body.appendChild(petal);

    const duration = 6000 + Math.random() * 6000;
    const drift = (Math.random() - 0.5) * 200;
    const start = performance.now();

    function animate(now) {
      const elapsed = now - start;
      const t = elapsed / duration;
      if (t >= 1) { petal.remove(); return; }
      const y = t * (H + 40) - 20;
      const x = parseFloat(petal.style.left) + Math.sin(t * Math.PI * 3) * 30 + drift * t;
      petal.style.transform = `translate(${x - parseFloat(petal.style.left)}px, ${y}px) rotate(${t * 360}deg)`;
      petal.style.opacity = Math.sin(t * Math.PI) * 0.7;
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }

  setInterval(createPetal, 800);

  // ============ 初始化 ============
  window.addEventListener('resize', resize);
  resize();
  document.body.classList.add('rake-mode'); // 默认耙沙模式
  loadSaved();

  // 默认放一个示例花园（如果没有保存）
  if (!localStorage.getItem('zenGarden')) {
    setTimeout(() => {
      createElement('stone', W*0.3, H*0.55, 0, 1.2);
      createElement('stone', W*0.38, H*0.6, 20, 0.8);
      createElement('moss', W*0.32, H*0.5, 0, 1);
      createElement('sakura', W*0.7, H*0.4, 0, 1);
      createElement('pine', W*0.78, H*0.55, 0, 0.9);
      createElement('lantern', W*0.55, H*0.65, 0, 1);
      createElement('pond', W*0.5, H*0.35, 0, 1);
      // 画几条耙沙纹路
      const cx = W*0.45, cy = H*0.5;
      for (let r = 40; r < 160; r += 25) {
        const rake = {width: 12, points: []};
        for (let a = 0; a <= Math.PI * 1.5; a += 0.1) {
          rake.points.push({x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.6});
        }
        rakes.push(rake);
        for (let i = 1; i < rake.points.length; i++) {
          drawRakeLine(rake.points[i-1].x, rake.points[i-1].y, rake.points[i].x, rake.points[i].y, rake.width);
        }
      }
    }, 100);
  }

})();
</script>
</body>
</html>
